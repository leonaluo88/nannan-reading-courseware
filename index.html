h water passes（水所经历的），修饰 cycle of phenomena。"},{"t":"现在分词短语作状语，具体描述循环过程: beginning as..., passing into..., returning to...。这些分词并列，详细说明水循环的各个阶段。"}],"vo":[{"w":"hydrologic cycle","ipa":"/ˌhaɪdrəˈlɒdʒɪk ˈsaɪkl/","m":"n. 水循环"},{"w":"phenomena","ipa":"/fəˈnɒmɪnə/","m":"n. (phenomenon 的复数) 现象"},{"w":"atmospheric","ipa":"/ˌætməsˈferɪk/","m":"adj. 大气的"},{"w":"precipitation","ipa":"/prɪˌsɪpɪˈteɪʃ(ə)n/","m":"n. 降水"},{"w":"thence","ipa":"/ðens/","m":"adv. 从那里，此后"},{"w":"evaporation","ipa":"/ɪˌvæpəˈreɪʃ(ə)n/","m":"n. 蒸发"},{"w":"transpiration","ipa":"/ˌtrænspɪˈreɪʃ(ə)n/","m":"n. 蒸腾作用"}]},{"title":"美洲人口锐减的原因","en":["Increasingly, historians are blaming diseases imported from the Old World for the staggering disparity between the indigenous population of America in 1492—new estimates of which soar as high as 100 million, or approximately one-sixth of the human race at that time—and the few million full-blooded Native Americans alive at the end of the nineteenth century."],"zh":["历史学家们越来越多地将美洲土著人口在 149 年的庞大数量——新的估计高达 1 亿，约占当时人类总数的六分之一——与 19 世纪末仅存的几百万纯血统美洲原住民之间的惊人差距，归咎于从旧世界传入的疾病。"],"st":[{"t":"主句: historians are blaming diseases... for the staggering disparity...（历史学家将惊人的差距归咎于疾病）"},{"t":"定语: imported from the Old World（从旧世界传入的），修饰 diseases。"},{"t":"介词宾语（disparity）的修饰成分: between the indigenous population... and the few million...（介于... 土著人口和...几百万之间）。"},{"t":"插入语: new estimates of which soar as high as...（对它的新估计高达……），修饰 indigenous population，起到补充说明的作用。"}],"vo":[{"w":"increasingly","ipa":"/ɪnˈkriːsɪŋli/","m":"adv.越来越多地"},{"w":"blame A for B","ipa":"/bleɪm/","m":"v.因 B 而责备 A，将 B 归咎于 A"},{"w":"import","ipa":"/ɪmˈpɔːt/","m":"v.传入，进口"},{"w":"staggering","ipa":"/ˈstæɡərɪŋ/","m":"adj.令人震惊的"},{"w":"disparity","ipa":"/dɪˈspærəti/","m":"n.差异，悬殊"},{"w":"indigenous","ipa":"/ɪnˈdɪdʒənəs/","m":"adj.土著的，本地的"},{"w":"soar","ipa":"/sɔː(r)/","m":"v.飙升，高耸"},{"w":"full-blooded","ipa":"/ˈfʊlˈblʌdɪd/","m":"adj.纯血统的"}]},{"title":"对汤普森论点的修正","en":["With regard to this last question, we might note in passing that Thompson, while rightly restoring laboring people to the stage of eighteenth-century English history, has probably exaggerated the opposition of these people to the inroads of capitalist consumerism in general; for example, laboring people in eighteenth-century England readily shifted from home-brewed beer to standardized beer produced by huge, heavily capitalized urban breweries."],"zh":["关于最后这个问题，我们可以顺便指出，汤普森虽然正确地让劳动人民重新登上了 18 世纪英国历史的舞台，但他可能总体上夸大了这些人对资本主义消费主义侵蚀的抵制；例如，18 世纪英国的劳动人民就很乐意地从家酿啤酒转向了由大型的、资本雄厚的城市啤酒厂生产的标准化啤酒。"],"st":[{"t":"主句 : we might note... that Thompson... has probably exaggerated the opposition... （我们可以注意到……汤普森……可能夸大了这种反对）"},{"t":"让步状语: while rightly restoring laboring people to the stage...（虽然正确地让劳动人民重新登上……舞台），修饰 Thompson 的动作。"},{"t":"宾语从句: that Thompson has exaggerated the opposition...，作为 note 的宾语。"},{"t":"举例: for example 后跟一个完整的句子作为例证。"}],"vo":[{"w":"with regard to","ipa":"/wɪð rɪˈɡɑːd tuː/","m":"phr. 关于，至于"},{"w":"note in passing","ipa":"/nəʊt ɪn ˈpɑːsɪŋ/","m":"phr. 顺带提及"},{"w":"restore... to the stage","ipa":"/rɪˈstɔː(r) tu ðə steɪdʒ/","m":"phr. 使……重返舞台"},{"w":"exaggerate","ipa":"/ɪɡˈzædʒəreɪt/","m":"v. 夸大"},{"w":"opposition","ipa":"/ˌɒpəˈzɪʃ(ə)n/","m":"n. 反对，抵抗"},{"w":"inroads","ipa":"/ˈɪnrəʊdz/","m":"n. 侵蚀，侵袭"},{"w":"consumerism","ipa":"/kənˈsjuːmərɪzəm/","m":"n. 消费主义"},{"w":"readily","ipa":"/ˈredɪli/","m":"adv. 乐意地，容易地"},{"w":"home-brewed","ipa":"/ˈhəʊm bruːd/","m":"adj. 家酿的"},{"w":"capitalized","ipa":"/ˈkæpɪtəlaɪzd/","m":"adj. 资本化的，投入资本的"},{"w":"brewery","ipa":"/ˈbruːəri/","m":"n. 啤酒厂"}]},{"title":"真的是现实主义吗？","en":["In what, as one reviewer put it, was “clearly intended to be a realistic novel,” many reviewers perceived violations of the conventions of the realistic novel form, pointing out variously that late in the book, the narrator protagonist Celie and her friends are propelled toward a happy ending with more velocity than credibility, that the letters from Nettie to her sister Celie intrude into the middle of the main action with little motivation or warrant, and that the device of Celie ’ s letters to God is especially unrealistic inasmuch as it forgoes the concretizing details that traditionally have given the epistolary novel (that is, a novel composed of letters) its peculiar verisimilitude."],"zh":["在一部，用一位评论家的话说，“明确意图成为现实主义小说”的作品中，许多评论家却察觉到了它对现实主义小说形式惯例的违背。他们从不同方面指出：在书的后期，叙述者兼主人公塞莉和她的朋友们被推向一个快乐结局，其速度之快令其真实性大打折扣；内蒂写给姐姐塞莉的信件，在缺乏足够动机或理由的情况下，贸然插入了主线情节的中间；此外，塞莉写信给上帝的这一设定尤其不现实，因为它摒弃了那些传统上赋予书信体小说（即由信件构成的小说）独特真实感的具体细节。"],"st":[{"t":"主干: many reviewers perceived violations of the conventions...（许多评论家察觉到了对惯例的违背）"},{"t":"状语: In what was... a realistic novel（在一部……是现实主义小说的作品中）。as one reviewer put it 是插入语。"},{"t":"现在分词短语作状语，列举观点: pointing out variously that..., that..., and that...。这里有三个并列的that 宾语从句，具体说明违背了哪些惯例。"},{"t":"宾语从句 1: that... Celie and her friends are propelled... with more velocity than credibility（……被推进，速度超过可信度）"},{"t":"宾语从句 2: that the letters... intrude... with little motivation or warrant（……信件闯入，缺乏动机或理由）"},{"t":"宾语从句 3: that the device... is especially unrealistic inasmuch as it forgoes the concretizing details...","g":"（……设定不现实，因为它摒弃了具体细节）。that traditionally have given... verisimilitude 是定语从句修"},{"t":"饰 details。"}],"vo":[{"w":"perceive","ipa":"/pəˈsiːv/","m":"v. 察觉，认识到"},{"w":"violation","ipa":"/ˌvaɪəˈleɪʃ(ə)n/","m":"n. 违反，违背"},{"w":"convention","ipa":"/kənˈvenʃ(ə)n/","m":"n. 惯例，常规"},{"w":"propel","ipa":"/prəˈpel/","m":"v. 推动，推进"},{"w":"velocity","ipa":"/vəˈlɒsəti/","m":"n. 速度"},{"w":"credibility","ipa":"/ˌkredəˈbɪləti/","m":"n. 可信度"},{"w":"intrude","ipa":"/ɪnˈtruːd/","m":"v. 闯入，侵入"},{"w":"warrant","ipa":"/ˈwɒrənt/","m":"n. 正当理由，授权"},{"w":"device","ipa":"/dɪˈvaɪs/","m":"n. （文学）手法，设计"},{"w":"inasmuch as","ipa":"/ɪnəzˈmʌtʃ æz/","m":"conj. 因为，由于"},{"w":"forgo","ipa":"/fɔːˈɡəʊ/","m":"v. 放弃，摒弃"},{"w":"concretizing details","ipa":"/ˈkɒŋkriːtaɪzɪŋ ˈdiːteɪlz/","m":"n. 具体化的细节"},{"w":"epistolary novel","ipa":"/ɪˈpɪstələri ˈnɒv(ə)l/","m":"n. 书信体小说"},{"w":"verisimilitude","ipa":"/ˌverɪsɪˈmɪlɪtjuːd/","m":"n. 逼真，貌似真实"}]},{"title":"陪审团的认知偏差","en":["Also, a jury may give more probative weight than objective analysis would allow to vivid photographic evidence depicting a shooting victim’s wounds, or may underestimate the weight of defense testimony that is not delivered in a sufficiently forceful or persuasive manner."],"zh":["此外，陪审团可能会赋予描绘枪击受害者伤口的生动照片证据超出客观分析所允许的证明力，或者可能会低估那些未能以足够有力或有说服力的方式呈现的辩方证词的分量。"],"st":[{"t":"主干: 由 or 连接的两个并列谓语。"},{"t":"谓语 1: a jury may give more probative weight... to vivid photographic evidence..."},{"t":"谓语 2: (a jury) may underestimate the weight of defense testimony..."},{"t":"比较状语: than objective analysis would allow（比客观分析所允许的更多），修饰 more probative weight。"},{"t":"定语: depicting a shooting victim's wounds（描绘枪击受害者伤口的），修饰 evidence。"},{"t":"定语从句: that is not delivered in a sufficiently forceful or persuasive manner（没有以足够有力或有说服力的方式呈现的），修饰 testimony。"}],"vo":[{"w":"jury","ipa":"/ˈdʒʊəri/","m":"n. 陪审团"},{"w":"probative weight","ipa":"/ˈprəʊbətɪv weɪt/","m":"n. 证明力"},{"w":"vivid","ipa":"/ˈvɪvɪd/","m":"adj. 生动的，鲜明的"},{"w":"photographic evidence","ipa":"/ˌfəʊtəˈɡræfɪk ˈevɪdəns/","m":"n. 照片证据"},{"w":"depict","ipa":"/dɪˈpɪkt/","m":"v. 描绘，描述"},{"w":"underestimate","ipa":"/ˌʌndərˈestɪmeɪt/","m":"v. 低估"},{"w":"testimony","ipa":"/ˈtestɪməni/","m":"n. 证词，证明"},{"w":"forceful","ipa":"/ˈfɔːsf(ə)l/","m":"adj. 有力的"},{"w":"persuasive","ipa":"/pəˈsweɪsɪv/","m":"adj. 有说服力的"}]},{"title":"革命的考据困境","en":["As a consequence, it may prove difficult or impossible to establish for a successful revolution a comprehensive and trustworthy picture of those who participated, or to answer even the most basic questions one might pose concerning the social origins of the insurgents."],"zh":["其结果是，对于一场成功的革命，可能很难甚至不可能为其参与者建立一个全面而可信的图景，也不可能回答人们关于起义者社会出身所可能提出的那些最基本的问题。"],"st":[{"t":"主句: it may prove difficult or impossible to establish... a picture..., or to answer... questions..."},{"t":"It 是形式主语，真正的主语是两个并列的不定式短语 to establish... 和 to answer...。"},{"t":"prove 是系动词，意为“结果是，证明是”。"},{"t":"不定式 1: to establish for a successful revolution a comprehensive and trustworthy picture of those who participated（为一场成功的革命建立一个关于参与者的全面可信的图景）。for a successful revolution 是状语。"},{"t":"定语从句: who participated（那些参与的），修饰 those。"},{"t":"不定式 2: to answer even the most basic questions one might pose concerning the social origins of the insurgents（回答甚至是最基本的问题……）。one might pose 是省略了关系代词的定语从句，修饰questions。concerning... 是介词短语，修饰 questions。"}],"vo":[{"w":"as a consequence","ipa":"/æz ə ˈkɒnsɪkwəns/","m":"phr. 因此，结果"},{"w":"prove","ipa":"/pruːv/","m":"v. 证明是，结果是"},{"w":"establish","ipa":"/ɪˈstæblɪʃ/","m":"v. 建立，确定"},{"w":"comprehensive","ipa":"/ˌkɒmprɪˈhensɪv/","m":"adj. 全面的，综合的"},{"w":"trustworthy","ipa":"/ˈtrʌstˌwɜːði/","m":"adj. 可信的，可靠的"},{"w":"pose a question","ipa":"/pəʊz ə ˈkwestʃ(ə)n/","m":"phr. 提出问题"},{"w":"concerning","ipa":"/kənˈsɜːnɪŋ/","m":"prep. 关于"},{"w":"social origins","ipa":"/ˈsəʊʃ(ə)l ˈɒrɪdʒɪnz/","m":"n. 社会出身"},{"w":"insurgents","ipa":"/ɪnˈsɜːdʒənts/","m":"n. 起义者，叛乱者"}]}]},{"no":6,"header":"第七节","passages":[{"title":"《呼啸山庄》","en":["Many critics of Emily Bronte's novel Wuthering Heights see its second part as a counterpoint that comments on, if it does not reverse, the first part, where a “romantic” reading receives more confirmation. Seeing the two parts as a whole is encouraged by the novel's sophisticated structure, revealed in its complex use of narrators and time shifts. Granted that the presence of these elements need not argue an authorial awareness of novelistic construction comparable to that of Henry James, their presence does encourage attempts to unify the novel's heterogeneous parts. However, any interpretation that seeks to unify all of the novel's diverse elements is bound to be somewhat unconvincing. This is not because such an interpretation necessarily stiffens into a thesis (although rigidity in any interpretation of this or of any novel is always a danger), but because Wuthering Heights has recalcitrant elements of undeniable power that, ultimately, resist inclusion in an all-encompassing interpretation. In this respect, Wuthering Heights shares a feature of Hamlet."],"zh":["许多评论家认为，艾米莉·勃朗特的小说《呼啸山庄》的第二部分是对第一部分的对应（即使不是彻底逆转），也是对第一部分的评注；在第一部分中，“浪漫主义”解读得到了更多印证。小说精巧的结构——体现在对叙事者和时间转换的复杂运用上——促使人们将两部分视为一个整体。诚然，这些元素的存在未必能证明作者具有堪比亨利·詹姆斯的小说构建意识，但它们确实鼓励了人们将小说异质部分统一起来的尝试。然而，任何试图统一小说所有多元元素的解读都难免有些缺乏说服力。这并非因为此类解读必然会僵化为一种论点（尽管对这部或任何小说的解读都始终存在僵化的风险），而是因为《呼啸山庄》包含一些具有无可否认力量的顽固元素，它们最终抗拒被纳入任何包罗万象的解读。在这方面，《呼啸山庄》与《哈姆雷特》有一个共同特点。"],"st":[{"t":"主句为“Many critics see its second part as a counterpoint”，后接定语从句“that comments on... the first part”；“if it does not reverse”为插入状语；“where”引导定语从句修饰“the first part”。"},{"t":"主句为“Seeing the two parts as a whole is encouraged by... structure”，后接过去分词短语“revealed in...”作后置定语。"},{"t":"“Granted that”引导让步状语从句，主句为“their presence does encourage attempts...”。"},{"t":"主句为“any interpretation is bound to be unconvincing”，“that”引导定语从句修饰“interpretation”。"},{"t":"“This is not because... but because...”结构引导两个原因状语从句；括号内为插入语；“that”引导定语从句修饰“elements”。"}],"vo":[{"w":"counterpoint","ipa":"/ˈkaʊntərpɔɪnt/","m":"n. 对应物；复调"},{"w":"sophisticated","ipa":"/səˈfɪstɪkeɪtɪd/","m":"adj. 精巧的；复杂的"},{"w":"narrators","ipa":"/nəˈreɪtərz/","m":"n. 叙述者"},{"w":"granted that","ipa":"/ˈɡræntɪd ðæt/","m":"conj. 即使；诚然"},{"w":"heterogeneous","ipa":"/ˌhetərəˈdʒiːniəs/","m":"adj. 异质的；多样的"},{"w":"unconvincing","ipa":"/ˌʌnkənˈvɪnsɪŋ/","m":"adj. 缺乏说服力的"},{"w":"stiffen into","ipa":"/ˈstɪfən ˈɪntu/","m":"v. 僵化为"},{"w":"rigidity","ipa":"/rɪˈdʒɪdəti/","m":"n. 僵化；严格"},{"w":"recalcitrant","ipa":"/rɪˈkælsɪtrənt/","m":"adj. 顽固的；难处理的"},{"w":"all-encompassing","ipa":"/ɔːl ɪnˈkʌmpəsɪŋ/","m":"adj. 包罗万象的"}]},{"title":"新英格兰文化模式之实质","en":["However, recent scholarship has strongly suggested that those aspects of early New England culture that seem to have been most distinctly Puritan, such as the strong religious orientation and the communal impulse, were not even typical of New England as a whole, but were largely confined to the two colonies of Massachusetts and Connecticut. Thus, what in contrast to the Puritan colonies appears to Davis to be peculiarly Southern — acquisitiveness, a strong interest in politics and the law, and a tendency to cultivate metropolitan cultural models — was not only more typically English than the cultural patterns exhibited by Puritan Massachusetts and Connecticut, but also almost certainly characteristic of most other early modern British colonies."],"zh":["然而，近来的学术研究有力地表明，早期新英格兰文化中那些看起来最具清教特色的方面——例如强烈的宗教导向和社区意识——甚至并非整个新英格兰地区的典型特征，而主要局限于马萨诸塞和康涅狄格这两个殖民地。因此，与清教殖民地相比，戴维斯看来是南方所特有的那些特质——强烈的获取欲、对政治与法律的浓厚兴趣，以及培养大都市文化模式的倾向——不仅比清教的马萨诸塞和康涅狄格所展现的文化模式更具典型英国性，而且几乎可以肯定是其他大多数早期现代英国殖民地的特征。"],"st":[{"t":"第一句（However... Connecticut.）提出新研究结论：主句指出“近期研究强烈表明”，其后是 that 引导的宾语从句 A，从句 A 的核心是：those aspects... were not... typical..., but were... confined to...。aspects 后"},{"t":"有两个修饰成分：that 引导的定语从句和 such as 引导的同位语。"},{"t":"第二句（Thus... colonies.）基于第一句，推导出颠覆性观点：主句以“因此”开头，其主干为：what... appears... Southern... was not only more typically English..., but also... characteristic of...。what 引导主语从句，破折号内是同位语列举具体特质。"}],"vo":[{"w":"scholarship","ipa":"/ˈskɑː.lə.ʃɪp/","m":"(n.) 学术研究；学问"},{"w":"orientation","ipa":"/ˌɔː.ri.enˈteɪ.ʃən/","m":"(n.) 导向，方向"},{"w":"communal","ipa":"/kəˈmjuː.nəl/","m":"(adj.) 社区的，共有的"},{"w":"impulse","ipa":"/ˈɪm.pʌls/","m":"(n.) 冲动，驱动力"},{"w":"confined to","ipa":"/kənˈfaɪnd tuː/","m":"(phr.) 局限于"},{"w":"acquisitiveness","ipa":"/əˈkwɪz.ə.tɪv.nəs/","m":"(n.) 获取欲，贪婪"},{"w":"cultivate","ipa":"/ˈkʌl.tɪ.veɪt/","m":"(v.) 培养，发展"},{"w":"metropolitan","ipa":"/ˌmet.rəˈpɒl.ɪ.tən/","m":"(adj.) 大都市的"}]},{"title":"氢原子方程的启示","en":["Thus, for instance, it may come as a shock to mathematicians to learn that the Schrodinger equation for the hydrogen atom is not a literally correct description of this atom, but only an approximation to a somewhat more correct equation taking account of spin, magnetic dipole, and relativistic effects; and that this corrected equation is itself only an imperfect approximation to an infinite set of quantum field-theoretical equations."],"zh":["因此，举例来说，数学家们可能会震惊地得知：描述氢原子的薛定谔方程并非对这个原子的字面精确描述，而只是一个对更准确方程（该方程考虑了自旋、磁偶极和相对论效应）的近似；并且，这个修正后的方程本身，也只是一个对无穷无尽的量子场论方程组的非完美近似。"],"st":[{"t":"这是一个由分号连接两个并列 that 从句的复杂句。It 为形式主语，真正主语是两个由 and that 并列的 that 宾语从句。第一个从句包含 not... but... 的对比结构；第二个从句进一步说明修正后的方程也是近似。taking account of... 是现在分词短语作后置定语，修饰 equation。"}],"vo":[{"w":"approximation","ipa":"/əˌprɒk.sɪˈmeɪ.ʃən/","m":"(n.) 近似值，近似法"},{"w":"take account of","ipa":"/teɪk əˈkaʊnt ɒv/","m":"(phr.) 考虑到，顾及"},{"w":"spin","ipa":"/spɪn/","m":"(n.) 自旋"},{"w":"magnetic dipole","ipa":"/mæɡˌnet.ɪk ˈdaɪ.pəʊl/","m":"(n.) 磁偶极子"},{"w":"relativistic","ipa":"/ˌrel.ə.tɪˈvɪs.tɪk/","m":"(adj.) 相对论的"},{"w":"imperfect","ipa":"/ɪmˈpɜː.fekt/","m":"(adj.) 不完美的"},{"w":"quantum field-theoretical","ipa":"/ˈkwɒn.təm fiːld ˌθɪəˈret.ɪ.kəl/","m":"(adj.) 量子场论的"}]},{"title":"哲学作为独立学科的起源","en":["The idea of an autonomous discipline called “philosophy” distinct from and sitting in judgment on such pursuits as theology and science turns out, on close examination, to be of quite recent origin."],"zh":["一种被称为“哲学”的自主学科的理念——它既不同于神学、科学等学科，又凌驾于其上对其进行评判——经仔细审视，结果被证明起源相当晚近。"],"st":[{"t":"这是一个主系表结构的单句，主语很长。主语是 The idea of an autonomous discipline called “philosophy”，其后有两个由 and 连接的形容词短语 distinct from... 和 sitting in judgment on... 作后置定语，共同修饰 discipline。谓语是 turns out to be，on close examination 是插入语。"}],"vo":[{"w":"autonomous","ipa":"/ɔːˈtɒn.ə.məs/","m":"(adj.) 自主的，自治的"},{"w":"discipline","ipa":"/ˈdɪs.ə.plɪn/","m":"(n.) 学科，纪律"},{"w":"distinct from","ipa":"/dɪˈstɪŋkt frɒm/","m":"(phr.) 与...截然不同"},{"w":"sit in judgment on","ipa":"/sɪt ɪn ˈdʒʌdʒ.mənt ɒn/","m":"(phr.) 评判，审判"},{"w":"pursuit","ipa":"/pəˈsjuːt/","m":"(n.) 追求；事业，活动"},{"w":"theology","ipa":"/θiˈɒl.ə.dʒi/","m":"(n.) 神学"}]},{"title":"《伊利亚特》和《奥德赛》的叙事视角对照","en":["Odyssey’s subject is “life-as-spectacle,” for readers, diverted by its various incidents, observe its hero Odysseus primarily from without; the tragic Iliad, however, presents “life-as-experience”：readers are asked to identify with the mind of Achilles, whose motivations render him a not particularly likable hero."],"zh":["《奥德赛》的主题是“作为奇观的人生”，因为读者被其多样的情节所吸引，主要是从外部观察其英雄奥德修斯；然而，悲剧性的《伊利亚特》呈现的是“作为体验的人生”：读者被要求去认同阿喀琉斯的思想，而其动机却使他成为一个并不那么讨人喜欢的英雄。"],"st":[{"t":"这是一个由分号连接的两个并列复合句，形成对比。"},{"t":"分号前：主句是 Odyssey’s subject is “life-as-spectacle,”，后跟 for 引导的原因状语从句。从句中diverted by its various incidents 是插入的过去分词短语，修饰 readers。"},{"t":"分号后：主句是 the tragic Iliad presents “life-as-experience”，后跟冒号引导的解释性分句。该分句中包含一个 whose 引导的非限制性定语从句修饰 Achilles。"}],"vo":[{"w":"spectacle","ipa":"/ˈspek.tə.kəl/","m":"(n.) 景象，奇观"},{"w":"divert","ipa":"/daɪˈvɜːt/","m":"(v.) 使转移，使得到消遣"},{"w":"from without","ipa":"/frɒm wɪˈθaʊt/","m":"(phr.) 从外部"},{"w":"identify with","ipa":"/aɪˈden.tɪ.faɪ wɪð/","m":"(phr.) 认同，与...产生共鸣"},{"w":"motivation","ipa":"/ˌməʊ.tɪˈveɪ.ʃən/","m":"(n.) 动机"},{"w":"render","ipa":"/ˈren.dər/","m":"(v.) 使成为，致使"}]},{"title":"帕斯卡式的“暴政”","en":["Is it not tyrannical, in Pascal's sense, to insist that those who excel in “sensitivity” or “the ability to express compassion” merit equal wealth with those who excel in qualities (such as “the capacity for hard work”","） essential in producing wealth?"],"zh":["按帕斯卡的理解来看，坚持认为那些在“敏感性”或“表达同情的能力”上出众的人，理应获得与那些在（诸如“努力工作的能力”等）创造财富所必需的品质上出众的人同等的财富，这难道不是一种暴政吗？"],"st":[{"t":"这是一个反诘句。It 是形式主语，真正主语是 to insist that... 这个不定式短语。that 引导 insist 的"},{"t":"宾语从句，从句主干是：those... merit equal wealth with those...。两个 those 后分别有 who 引导的定语从句修饰。in Pascal's sense 是插入语。"}],"vo":[{"w":"tyrannical","ipa":"/tɪˈræn.ɪ.kəl/","m":"(adj.) 暴虐的，专制的"},{"w":"in sb's sense","ipa":"/ɪn ˈsʌm.bɒ.di z sens/","m":"(phr.) 按某人的理解/标准"},{"w":"excel in","ipa":"/ɪkˈsel ɪn/","m":"(phr.) 在...方面擅长"},{"w":"sensitivity","ipa":"/ˌsen.səˈtɪv.ə.ti/","m":"(n.) 敏感（性）"},{"w":"compassion","ipa":"/kəmˈpæʃ.ən/","m":"(n.) 同情，怜悯"},{"w":"merit","ipa":"/ˈmer.ɪt/","m":"(v.) 值得，应得"},{"w":"capacity","ipa":"/kəˈpæs.ə.ti/","m":"(n.) 能力，容量"}]},{"title":"并驾齐驱？小说中的对位法","en":["In addition, the style of some Black novels, like Jean Toomer's Cane, verges on expressionism or surrealism; does this technique provide a counterpoint to the prevalent theme that portrays the fate against which Black heroes are pitted, a theme usually conveyed by more naturalistic modes of expression?"],"zh":["此外，一些黑人小说（如让·图默的《甘蔗》）的风格接近于表现主义或超现实主义；这种技巧是否为那个普遍的主题——即描绘黑人英雄与之抗争的命运，一个通常用更自然主义表达模式来传达的主题——提供了一种对位？"],"st":[{"t":"这是一个由分号连接一个陈述句和一个疑问句组成的并列句。"},{"t":"分号前：简单陈述句，like... 是插入语。"},{"t":"分号后：疑问句的主干是 does this technique provide a counterpoint to the prevalent theme?。theme 后跟 that 引导的定语从句。该从句中又包含 against which Black heroes are pitted 这个定语从句修饰 fate。句末的 a theme... expression 是 the prevalent theme 的同位语。"}],"vo":[{"w":"verge on","ipa":"/vɜːdʒ ɒn/","m":"(phr.) 接近，濒临"},{"w":"expressionism","ipa":"/ɪkˈspreʃ.ən.ɪ.zəm/","m":"(n.) 表现主义"},{"w":"surrealism","ipa":"/səˈrɪə.lɪ.zəm/","m":"(n.) 超现实主义"},{"w":"counterpoint","ipa":"/ˈkaʊn.tə.pɔɪnt/","m":"(n.) 对位法；对比物"},{"w":"prevalent","ipa":"/ˈprev.əl.ənt/","m":"(adj.) 普遍的，流行的"},{"w":"pit against","ipa":"/pɪt əˈɡenst/","m":"(phr.) 使与...对抗"},{"w":"naturalistic","ipa":"/ˌnætʃ.ər.əˈlɪs.tɪk/","m":"(adj.) 自然主义的"}]},{"title":"文物价值的灵魂之问","en":["Who would want an unmarked pot when another was available whose provenance was known, and that was dated stratigraphically by the professional archaeologist who excavated it?"],"zh":["当另一个出处已知，并且由发掘它的专业考古学家用地层学方法确定了年代的陶罐可供选择时，谁还会想要一个没有标记的陶罐呢？"],"st":[{"t":"这是一个反问句。主句是 Who would want an unmarked pot，后跟 when 引导的时间/条件状语从句。从句的主干是 another was available，其后并列了两个修饰 another (pot) 的定语：whose 引导的定语从句和 that 引导的定语从句。that 从句中又包含一个 who 引导的定语从句修饰 archaeologist。"}],"vo":[{"w":"unmarked","ipa":"/ʌnˈmɑːkt/","m":"(adj.) 无标记的"},{"w":"provenance","ipa":"/ˈprɒv.ə.nəns/","m":"(n.) 出处，起源"},{"w":"date","ipa":"/deɪt/","m":"(v.) 确定...的年代"},{"w":"stratigraphically","ipa":"/ˌstræt.ɪˈɡræf.ɪ.kəl.i/","m":"(adv.) 通过地层学方法"},{"w":"excavate","ipa":"/ˈek.skə.veɪt/","m":"(v.) 发掘，挖掘"}]},{"title":"修辞学地位的沦陷","en":["Under the force of this view,it was perhaps inevitable that the art of rhetoric should pass from the status of being regarded as of questionable worth(because although it might be both a source of pleasure and a means to urge people to right action,it might also be a means to distort truth and a source of misguided action)to the status of being wholly condemned."],"zh":["在这种观点的压力下，修辞艺术的地位发生这样一种转变或许是不可避免的：从一个因其具有双重可能性（既可娱人劝善，亦可曲真误行）而被认为价值存疑的领域，彻底沦为一个被全盘否定的对象。"],"st":[{"t":"这是一个主从复合句。It 是形式主语，真正主语是 that 引导的主语从句。从句主干是：the art of rhetoric should pass from the status of...to the status of...。括号内是 because 引导的原因状语从句，其中又包含although 引导的让步状语从句，形成 because although A,B 的嵌套结构。"}],"vo":[{"w":"rhetoric","ipa":"/ˈret.ər.ɪk/","m":"(n.)修辞学；雄辩术"},{"w":"inevitable","ipa":"/ɪˈnev.ɪ.tə.bəl/","m":"(adj.)不可避免的"},{"w":"pass from...to...","ipa":"/pɑːs frɒm...tuː.../","m":"(phr.)从...转变为..."},{"w":"questionable worth","ipa":"/ˈkwes.tʃə.nə.bəl wɜːθ/","m":"(phr.)可疑的价值"},{"w":"urge to","ipa":"/ɜːdʒtuː/","m":"(phr.)敦促...做..."},{"w":"distort","ipa":"/dɪˈstɔːt/","m":"(v.)歪曲，扭曲"},{"w":"misguided","ipa":"/ˌmɪsˈɡaɪ.dɪd/","m":"(adj.)被误导的，误入歧途的"},{"w":"wholly condemned","ipa":"/ˈhəʊl.li kənˈdemd/","m":"(phr.)被全盘否定"}]},{"title":"稳定性之于文化传承的重要意义","en":["Gutman argues convincingly that the stability of the Black family encouraged the transmission of—and so was crucial in sustaining—the Black heritage of folklore,music,and religious expression from one generation to another,a heritage that slaves were continually fashioning out of their African and American experiences."],"zh":["古特曼令人信服地论证道，黑人家庭的稳定性促进并（因而）对维系黑人文化遗产——包括民间传说、音乐和宗教表达——的代际传承至关重要；这份文化遗产，是奴隶们不断从其非洲与美洲的经历中塑造出来的。"],"st":[{"t":"这是一个主从复合句。主句是 Gutman argues convincingly，后跟 that 引导的宾语从句。从句主干是：the stability...encouraged the transmission of...and...was crucial in sustaining...the Black heritage...。破折号内的 and so was crucial in sustaining 是插入的并列谓语，解释前一动作的结果。from one generation to another 是状语。句末的 a heritage that...是 the Black heritage 的同位语，其中 that 引导定语从句。"}],"vo":[{"w":"aconvincingly","ipa":"/kənˈvɪn.sɪŋ.li/","m":"(adv.)令人信服地"},{"w":"stability","ipa":"/stəˈbɪl.ə.ti/","m":"(n.)稳定性"},{"w":"encourage","ipa":"/ɪnˈkʌr.ɪdʒ/","m":"(v.)鼓励，促进"},{"w":"transmission","ipa":"/trænsˈmɪʃ.ən/","m":"(n.)传递，传输"},{"w":"be crucial in","ipa":"/biːˈkruː.ʃəlɪn/","m":"(phr.)在...方面至关重要"},{"w":"sustain","ipa":"/səˈsteɪn/","m":"(v.)维持，支撑"},{"w":"heritage","ipa":"/ˈher.ɪ.tɪdʒ/","m":"(n.)遗产，传统"},{"w":"fashion out of","ipa":"/ˈfæʃ.ən aʊtɒv/","m":"(phr.)用...塑造，从...中创造出"}]}]},{"no":7,"header":"第八节","passages":[{"title":"文学传统的隐性传承","en":["Yet few of Olsen's readers realize the extent to which her vision and choice of subject are rooted in an earlier literary heritage—the tradition of radical political thought, mostly socialist and anarchist, of the 1910's and 1920's, and the Old Left tradition of the 1930's. I do not mean that one can adequately explain the eloquence of her work in terms of its political origin, or that left-wing politics were the single most important influence on it. My point is that its central consciousness—its profound understanding of class and gender as shaping influences on people's lives—owes much to that earlier literary heritage, a heritage that, in general, has not been sufficiently valued by most contemporary literary critics."],"zh":["然而，然而，奥尔斯恩的读者中很少有人意识到，她的创作视野和题材选择在多大程度上植根于一个更早的文学传统——即 20 世纪 10 至 20 年代以社会主义和无政府主义为主的激进政治思想传统，以及 30 年代的“老左派”传统。我并非意指人们可以仅凭其政治渊源就充分解释她作品的感染力，也并非指左翼政治是其作品的唯一且最重要的影响。我的观点是，她作品的核心意识——即对于阶级和性别作为塑造人生之力量的深刻理解——在很大程度上要归功于那个更早的文学传统；而这个传统，总的来说，并未得到大多数当代文学评论家的足够重视。"],"st":[{"h":"句子 1"},{"t":"核心：Yet few of Olsen's readers realize the extent."},{"t":"非核心:"},{"t":"定语从句：to which her vision and choice of subject are rooted in an earlier literary heritage (修饰 the extent)"},{"t":"同位语：—the tradition... , and the Old Left tradition... (解释 heritage 的具体内容)"},{"t":"同位语中的修饰语： mostly socialist and anarchist, of the 1910's and 1920's ( 修饰 radical political thought)"},{"h":"句子 2"},{"t":"核心：I do not mean that... , or that..."},{"t":"非核心:"},{"t":"宾语从句 1：that one can adequately explain the eloquence of her wo ions at risk，有两个并列谓语：have had no previous contact... 和 are therefore... defenseless。第一个谓语中，diseases 后接一个 that 引导的定语从句 (that strike them)。"}],"vo":[{"w":"virgin-soil epidemic","ipa":"/ˈvɜː.dʒɪn sɔɪl ˌep.ɪˈdem.ɪk/","m":"(n. phr.) 无免疫人群流行病"},{"w":"population at risk","ipa":"/ˌpɒp.jəˈleɪ.ʃən æt rɪsk/","m":"(n. phr.) 风险人群"},{"w":"previous contact","ipa":"/ˈpriː.vi.əs ˈkɒn.tækt/","m":"(n. phr.) 先前接触"},{"w":"strike","ipa":"/straɪk/","m":"(v.) （疾病）侵袭"},{"w":"immunologically","ipa":"/ˌɪm.jə.nəˈlɒdʒ.ɪ.kəl.i/","m":"(adv.) 免疫学上地"},{"w":"defenseless","ipa":"/dɪˈfens.ləs/","m":"(adj.) 无防御能力的"}]},{"title":"钻石与包裹体的同源性证据","en":["It is not known how rare this resemblance is, or whether it is most often seen in inclusions of silicates such as garnet, whose crystallography is generally somewhat similar to that of diamond; but when present, the resemblance is regarded as compelling evidence that the diamonds and inclusions are truly cogenetic."],"zh":["目前尚不清楚这种相似性有多么罕见，或者它是否最常见于石榴石等硅酸盐矿物的包裹体中——这类矿物的晶体结构通常与钻石有些相似；但是，当这种相似性存在时，它被视为一项强有力的证据，表明钻石与包裹体确实是同源的。"],"st":[{"t":"这是一个由分号连接的并列复合句。分号前，It 是形式主语，真正主语是两个由 or 连接的从句：how rare... 和 whether it is...。在 whether 从句中，包含一个 whose 引导的非限制性定语从句修饰 garnet。分号后是一个主从复合句，when present 是省略形式的状语从句，主句是 the resemblance is regarded as evidence，后接一个 that 引导的同位语从句说明 evidence 的内容。"}],"vo":[{"w":"resemblance","ipa":"/rɪˈzem.bləns/","m":"(n.) 相似性"},{"w":"inclusion","ipa":"/ɪnˈkluː.ʒən/","m":"(n.) （矿物）包裹体"},{"w":"silicate","ipa":"/ˈsɪl.ɪ.keɪt/","m":"(n.) 硅酸盐"},{"w":"garnet","ipa":"/ˈɡɑː.nɪt/","m":"(n.) 石榴石"},{"w":"crystallography","ipa":"/ˌkrɪs.təˈlɒɡ.rə.fi/","m":"(n.) 晶体结构学"},{"w":"compelling evidence","ipa":"/kəmˈpel.ɪŋ ˈev.ɪ.dəns/","m":"(n. phr.) 强有力的证据"},{"w":"cogenetic","ipa":"/ˌkəʊ.dʒəˈnet.ɪk/","m":"(adj.) 同源的"}]}]},{"no":8,"header":"第九节","passages":[{"title":"视觉识别的并行与串行假说","en":["Although some experiments show that, as an object becomes familiar, its internal representation becomes more holistic and the recognition process correspondingly more parallel, the weight of evidence seems to support the serial hypothesis, at least for objects that are not notably simple and familiar."],"zh":["尽管一些实验表明，随着一个物体变得熟悉，其内部表征变得更加完整，识别过程也相应地更加并行，但证据的权重似乎支持串行假说，至少对于那些并非特别简单或熟悉的物体来说是这样。"],"st":[{"t":"核心：The weight of evidence seems to support the serial hypothesis."},{"t":"非核心："},{"t":"Although some experiments show that…（让步状语从句）"},{"t":"as an object becomes familiar（时间状语从句）"},{"t":"its internal representation becomes more holistic and the recognition process correspondingly more parallel（show 的宾语从句）"},{"t":"at least for objects that are not notably simple and familiar（条件状语）"}],"vo":[{"w":"holistic","ipa":"/hoʊˈlɪstɪk/","m":"（adj.）完整的"},{"w":"parallel","ipa":"/ˈpærəlel/","m":"（adj.）并行的"},{"w":"serial","ipa":"/ˈsɪriəl/","m":"（adj.）串行的"},{"w":"hypothesis","ipa":"/haɪˈpɑːθəsɪs/","m":"（n.）假说"},{"w":"notably","ipa":"/ˈnoʊtəbli/","m":"（adv.）特别地"}]},{"title":"女权运动对历史研究的影响","en":["In large part as a consequence of the feminist movement, historians have focused a great deal of attention in recent years on determining more accurately the status of women in various periods."],"zh":["很大程度上由于女权运动的影响，历史学家近年来将大量注意力集中在更准确地确定女性在不同时期的地位上。"],"st":[{"t":"核心：Historians have focused a great deal of attention on determining the status of women."},{"t":"非核心："},{"t":"In large part as a consequence of the feminist movement（原因状语）"},{"t":"in recent years（时间状语）"},{"t":"more accurately（方式状语）"},{"t":"in various periods（时间状语）"}],"vo":[{"w":"feminist","ipa":"/ˈfemənɪst/","m":"（adj.）女权主义的"},{"w":"consequence","ipa":"/ˈkɑːnsəkwens/","m":"（n.）结果"},{"w":"focus on","ipa":"/ˈfoʊkəs ɑːn/","m":"（v.）集中于"},{"w":"status","ipa":"/ˈsteɪtəs/","m":"（n.）地位"}]},{"title":"合金密度计算与实验数据的吻合","en":["Calculations of the density of alloys based on Bernal-type models agreed fairly well with the experimentally determined values from measurements on alloys consisting of a noble metal together with a metalloid, such as alloys of palladium and silicon, or alloys consisting of iron, phosphorus, and carbon, although small discrepancies remained."],"zh":["基于伯纳尔模型的合金密度计算与实验测得的数值相当吻合，这些数值来自对由贵金属与类金属组成的合金（如钯和硅的合金）或由铁、磷和碳组成的合金的测量，尽管仍存在微小差异。"],"st":[{"t":"核心：Calculations agreed fairly well with the values."},{"t":"非核心："},{"t":"of the density of alloys（修饰 Calculations）"},{"t":"based on Bernal-type models（修饰 Calculations）"},{"t":"from measurements on alloys…（修饰 values）"},{"t":"such as…（举例说明）"},{"t":"although small discrepancies remained（让步状语）"}],"vo":[{"w":"alloy","ipa":"/ˈælɔɪ/","m":"（n.）合金"},{"w":"density","ipa":"/ˈdensəti/","m":"（n.）密度"},{"w":"metalloid","ipa":"/ˈmetəlɔɪd/","m":"（n.）类金属"},{"w":"discrepancy","ipa":"/dɪˈskrepənsi/","m":"（n.）差异"},{"w":"palladium","ipa":"/pəˈleɪdiəm/","m":"（n.）钯"}]},{"title":"小说的起源与意识形态之局限","en":["Although fiction assuredly springs from political circumstances, its authors react to those circumstances in ways other than ideological, and talking about novels and stories primarily as instruments of ideology circumvents much of the fictional enterprise."],"zh":["尽管小说无疑源于政治环境，但其作者对这些环境的反应方式并非意识形态化的，而将小说和故事主要视为意识形态工具的做法则限制了小说事业的大部分内容。"],"st":[{"t":"核心： Authors react to circumstances in ways other than ideological, and talking about novels as instruments circumvents much of the fictional enterprise."},{"t":"非核心："},{"t":"Although fiction assuredly springs from political circumstances（让步状语）"},{"t":"primarily as instruments of ideology（方式状语）"}],"vo":[{"w":"fiction","ipa":"/ˈfɪkʃn/","m":"（n.）小说"},{"w":"ideological","ipa":"/ˌaɪdiəˈlɑːdʒɪkl/","m":"（adj.）意识形态的"},{"w":"circumvent","ipa":"/ˌsɜːrkəmˈvent/","m":"（v.）规避，限制"},{"w":"enterprise","ipa":"/ˈentərpraɪz/","m":"（n.）事业"}]},{"title":"昆虫与脊椎动物社会的异同","en":["As my own studies have advanced, I have been increasingly impressed with the functional similarities between insect and vertebrate societies and less so with the structural differences that seem, at first glance, to constitute such an immense gulf between them."],"zh":["随着我自身研究的深入，我越来越对昆虫与脊椎动物社会之间的功能相似性印象深刻，而对那些乍看之下构成它们之间巨大鸿沟的结构差异则不那么关注。"],"st":[{"t":"核心：I have been increasingly impressed with the functional similarities and less so with the structural differences."},{"t":"非核心："},{"t":"As my own studies have advanced（时间状语）"},{"t":"between insect and vertebrate societies（修饰 similarities）"},{"t":"that seem…to constitute…（定语从句修饰 differences）"},{"t":"at first glance（插入语）"}],"vo":[{"w":"vertebrate","ipa":"/ˈvɜːrtɪbrət/","m":"（n.）脊椎动物"},{"w":"functional","ipa":"/ˈfʌŋkʃənl/","m":"（adj.）功能的"},{"w":"structural","ipa":"/ˈstrʌktʃərəl/","m":"（adj.）结构的"},{"w":"immense","ipa":"/ɪˈmens/","m":"（adj.）巨大的"},{"w":"gulf","ipa":"/ɡʌlf/","m":"（n.）鸿沟"}]},{"title":"杀虫剂对植物繁殖力的影响","en":["The question of whether the decrease in plant fecundity caused by the spraying of pesticides actually causes a decline in the overall population of flowering plant species still remains unanswered."],"zh":["关于由喷洒杀虫剂引起的植物繁殖力下降是否真的导致开花植物物种整体数量减少的问题，至今仍未得到解答。"],"st":[{"t":"核心：The question still remains unanswered."},{"t":"非核心："},{"t":"of whether…（同位语从句修饰 question）"},{"t":"caused by the spraying of pesticides（过去分词短语修饰 decrease）"},{"t":"in the overall population of flowering plant species（介词短语修饰 decline）"}],"vo":[{"w":"fecundity","ipa":"/fɪˈkʌndəti/","m":"（n.）繁殖力"},{"w":"pesticide","ipa":"/ˈpestɪsaɪd/","m":"（n.）杀虫剂"},{"w":"decline","ipa":"/dɪˈklaɪn/","m":"（n.）下降"},{"w":"species","ipa":"/ˈspiːʃiːz/","m":"（n.）物种"},{"w":"unanswered","ipa":"/ʌnˈænsərd/","m":"（adj.）未回答的"}]},{"title":"为解放思想而斗争","en":["They were fighting, albeit discreetly, to open the intellectual world to the new science and to liberate intellectual life from ecclesiastical philosophy and envisioned their work as contributing to the growth, not of philosophy, but of research in mathematics and physics."],"zh":["他们尽管谨慎，但仍致力于为新科学打开知识界的大门，将思想生活从教会哲学中解放出来，并将其工作视为对数学和物理学研究——而非哲学——发展的贡献。"],"st":[{"t":"核心： They were fighting to open … and to liberate … and envisioned their work as contributing to the growth of research."},{"t":"非核心："},{"t":"albeit discreetly（插入语）"},{"t":"not of philosophy, but of research…（并列结构修饰 growth）"}],"vo":[{"w":"discreetly","ipa":"/dɪˈskriːtli/","m":"（adv.）谨慎地"},{"w":"ecclesiastical","ipa":"/ɪˌkliːziˈæstɪkl/","m":"（adj.）教会的"},{"w":"envision","ipa":"/ɪnˈvɪʒn/","m":"（v.）设想"},{"w":"contribute to","ipa":"/kənˈtrɪbjuːt tuː/","m":"（v.）贡献于"}]},{"title":"群体捕食速率的估算方法","en":["Studies by Hargrave and Geen estimated natural community grazing rates by measuring feeding rates of individual zooplankton species in the laboratory and then computing community grazing rates for field conditions using the known population density of grazers."],"zh":["哈格里夫和吉恩的研究通过测量实验室中单个浮游动物物种的摄食速率，然后利用已知的食草动物种群密度计算野外条件下的群体捕食速率，从而估算了自然群体捕食速率。"],"st":[{"t":"核心：Studies estimated natural community grazing rates."},{"t":"非核心："},{"t":"by Hargrave and Geen（修饰 Studies）"},{"t":"by measuring…and then computing…（方式状语）"},{"t":"using the known population density of grazers（方式状语）"}],"vo":[{"w":"bgrazing","ipa":"/ˈɡreɪzɪŋ/","m":"（n.）摄食"},{"w":"zooplankton","ipa":"/ˌzoʊəˈplæŋktən/","m":"（n.）浮游动物"},{"w":"density","ipa":"/ˈdensəti/","m":"（n.）密度"},{"w":"grazer","ipa":"/ˈɡreɪzər/","m":"（n.）食草动物"}]},{"title":"历史文献中的个案研究","en":["Historians such as Le Roy Ladurie have used the documents to extract case histories, which have illuminated the attitudes of different social groups (these attitudes include, but are not confined to, attitudes toward crime and the law) and have revealed how the authorities administered justice."],"zh":["诸如勒华拉杜里等历史学家利用文献提取个案史，这些个案史阐明了不同社会群体的态度（这些态度包括但不限于对犯罪和法律的态度），并揭示了当局如何执行司法。"],"st":[{"t":"核心：Historians have used the documents to extract case histories, which have illuminated the attitudes and have revealed how…"},{"t":"非核心："},{"t":"such as Le Roy Ladurie（举例）"},{"t":"(these attitudes include…the law)（插入语解释 attitudes）"},{"t":"how the authorities administered justice（revealed 的宾语从句）"}],"vo":[{"w":"extract","ipa":"/ɪkˈstrækt/","m":"（v.）提取"},{"w":"illuminate","ipa":"/ɪˈluːmɪneɪt/","m":"（v.）阐明"},{"w":"administer","ipa":"/ədˈmɪnɪstər/","m":"（v.）执行"},{"w":"justice","ipa":"/ˈdʒʌstɪs/","m":"（n.）司法"}]},{"title":"历史学家如何比较犯罪率？","en":["It can be inferred from the passage that a historian who wished to compare crime rates per thousand in a European city in one decade of the fifteenth century with crime rates in another decade of that century would probably be most aided by better information about which of the following?"],"zh":["从文中可以推断，一个希望比较 15 世纪某欧洲城市在两个不同十年的每千人犯罪率的历史学家，最可能因获得以下哪一方面的更准确信息而受益？"],"st":[{"t":"核心：It can be inferred that a historian would probably be most aided by better information."},{"t":"非核心："},{"t":"who wished to compare…（定语从句修饰 historian）"},{"t":"about which of the following（介词短语修饰 information）"}],"vo":[{"w":"infer","ipa":"/ɪnˈfɜːr/","m":"（v.）推断"},{"w":"decade","ipa":"/ˈdekeɪd/","m":"（n.）十年"},{"w":"aid","ipa":"/eɪd/","m":"（v.）帮助"},{"w":"per thousand","ipa":"/pər ˈθaʊznd/","m":"（每千人）"}]},{"title":"自然界的讽刺：氮的限制","en":["It is one of nature's great ironies that the availability of nitrogen in the soil frequently sets an upper limit on plant growth even though the plants' leaves are bathed in a sea of nitrogen gas."],"zh":["自然界的一大讽刺在于，土壤中氮的可利用性经常限制植物的生长上限，尽管植物的叶子沉浸在氮气的海洋中。"],"st":[{"t":"核心：It is one of nature’s great ironies that…"},{"t":"非核心："},{"t":"that the availability…sets an upper limit（主语从句）"},{"t":"even though…（让步状语从句）"}],"vo":[{"w":"irony","ipa":"/ˈaɪrəni/","m":"（n.）讽刺"},{"w":"nitrogen","ipa":"/ˈnaɪtrədʒən/","m":"（n.）氮"},{"w":"availability","ipa":"/əˌveɪləˈbɪləti/","m":"（n.）可利用性"},{"w":"bathe","ipa":"/beɪð/","m":"（v.）沉浸"}]},{"title":"绿色革命的潜在危机","en":["Unless they succeed, the yield gains of the Green Revolution will be largely lost even if the genes in legumes that equip those plants to enter into a symbiosis with nitrogen-fixing bacteria are identified and isolated, and even if the transfer of those gene complexes, once they are found, becomes possible."],"zh":["除非他们成功，否则绿色革命的产量增益将大幅丧失，即使豆科植物中那些使其能与固氮菌共生的基因被识别和分离出来，即使这些基因复合体在被发现后能够被转移。"],"st":[{"t":"核心：The yield gains will be largely lost."},{"t":"非核心："},{"t":"Unless they succeed（条件状语）"},{"t":"even if the genes…are identified and isolated（让步状语从句）"},{"t":"even if the transfer…becomes possible（让步状语从句）"},{"t":"once they are found（插入语）"}],"vo":[{"w":"legume","ipa":"/ˈleɡjuːm/","m":"（n.）豆科植物"},{"w":"symbiosis","ipa":"/ˌsɪmbaɪˈoʊsɪs/","m":"（n.）共生"},{"w":"nitrogen-fixing","ipa":"/ˈnaɪtrədʒən fɪksɪŋ/","m":"（adj.）固氮的"},{"w":"complex","ipa":"/ˈkɑːmpleks/","m":"（n.）复合体"}]},{"title":"比目鱼眼睛的不对称性","en":["Most striking among the many asymmetries evident in an adult flatfish is eye placement: before maturity one eye migrates, so that in an adult flatfish both eyes are on the same side of the head."],"zh":["在成年比目鱼明显的诸多不对称特征中，最引人注目的是眼睛的位置：成熟前一只眼睛会移动，因此在成年比目鱼中，两只眼睛位于头部的同一侧。"],"st":[{"t":"核心：Most striking is eye placement."},{"t":"非核心："},{"t":"among the many asymmetries evident in an adult flatfish（状语）"},{"t":"before maturity…（时间状语从句）"},{"t":"so that…（结果状语从句）"}],"vo":[{"w":"asymmetry","ipa":"/eɪˈsɪmətri/","m":"（n.）不对称"},{"w":"flatfish","ipa":"/ˈflætfɪʃ/","m":"（n.）比目鱼"},{"w":"migrate","ipa":"/ˈmaɪɡreɪt/","m":"（v.）迁移"},{"w":"maturity","ipa":"/məˈtʃʊrəti/","m":"（n.）成熟"}]},{"title":"种子传播的两种鸟类途径","en":["More probable is bird transport, either externally, by accidental attachment of the seeds to feathers, or internally, by the swallowing of fruit and subsequent excretion of the seeds."],"zh":["更可能的是鸟类传播，既可能是体外传播（通过种子偶然附着在羽毛上），也可能是体内传播（通过吞食果实并随后排出种子）。"],"st":[{"t":"核心：More probable is bird transport."},{"t":"非核心："},{"t":"either externally…or internally…（并列方式状语）"},{"t":"by accidental attachment…（方式状语）"},{"t":"by the swallowing…（方式状语）"}],"vo":[{"w":"transport","ipa":"/ˈtrænspɔːrt/","m":"（n.）传播"},{"w":"attachment","ipa":"/əˈtætʃmənt/","m":"（n.）附着"},{"w":"excretion","ipa":"/ɪkˈskriːʃn/","m":"（n.）排泄"},{"w":"subsequent","ipa":"/ˈsʌbsɪkwənt/","m":"（adj.）随后的"}]}]},{"no":9,"header":"第九节","passages":[{"title":"进化论视角下的生命奇迹","en":["Consider the fact that for 3.8 billion years, a period of time older than the Earth's mountains and rivers and oceans, every one of your forebears on both sides has been attractive enough to find a mate, healthy enough to reproduce, and sufficiently blessed by fate and circumstances to live long enough to do so. Not one of your pertinent ancestors was squashed, devoured, drowned, starved, stranded, stuck fast, untimely wounded, or otherwise deflected from its life's quest of delivering a tiny charge of genetic material to the right partner at the right moment in order to perpetuate the only possible sequence of hereditary combinations that could result— eventually, astoundingly, and all too briefly—in you."],"zh":["试想一下这个事实：在长达 38 亿年——一段比地球上的山川河流海洋还要古老的岁月里——你父系和母系双方的每一位祖先，都足够有魅力找到伴侣，足够健康繁衍后代，并且得到命运和环境的充分眷顾，得以活得足够长久来完成这一切。你没有一位相关的祖先曾被压扁、吃掉、淹死、饿死、搁浅、牢牢困住、意外受伤，或以任何方式偏离其生命使命：即在正确的时刻，将一小份遗传物质传递给正确的伴侣，以延续那个唯一可能导致（最终，惊人地，且极其短暂地）你出现的遗传组合序列。"],"st":[{"t":"核心句 1 (祈使句)： Consider the fact that... （考虑这个事实...）"},{"t":"核心成分： every one of your forebears has been attractive enough..., healthy enough..., and sufficiently blessed... （你的每一位祖先都足够有魅力...、足够健康...、且得到充分眷顾...）"},{"t":"非核心修饰："},{"t":"that for 3.8 billion years 引导同位语从句，说明“事实”的具体内容。"},{"t":"a period of time older than... 是 3.8 billion years 的同位语，进行补充说明。"},{"t":"on both sides 修饰 forebears。"},{"t":"to find a mate, to reproduce, to live long enough to do so 是三个并列的不定式短语，作结果状语。"},{"t":"核心句 2 (陈述句)： Not one of your pertinent ancestors was squashed, devoured... or otherwise deflected from its life's quest... （你没有一位相关的祖先曾被压扁、吞噬...或偏离其使命...）"},{"t":"核心成分： Not one was squashed... or deflected from its quest."},{"t":"非核心修饰："},{"t":"of delivering... to the right partner at the right moment 是介词短语，修饰 quest，说明使命的内容。"},{"t":"in order to perpetuate the only possible sequence... 是目的状语。"},{"t":"that could result... in you 是定语从句，修饰 sequence。"},{"t":"—eventually, astoundingly, and all too briefly— 是插入语，表示评论。"}],"vo":[{"w":"forebears:","ipa":"/ˈfɔːrbeərz/","m":"(n.) 祖先"},{"w":"pertinent:","ipa":"/ˈpɜːrtnənt/","m":"(adj.) 相关的，切题的"},{"w":"squashed:","ipa":"/skwɑːʃt/","m":"(adj.) 被压扁的"},{"w":"devoured:","ipa":"/dɪˈvaʊərd/","m":"(adj.) 被吞噬的"},{"w":"stranded:","ipa":"/ˈstrændɪd/","m":"(adj.) 搁浅的，被困住的"},{"w":"stuck fast:","ipa":"/stʌk fæst/","m":"牢牢卡住的"},{"w":"untimely wounded:","ipa":"/ʌnˈtaɪmli ˈwuːndɪd/","m":"遭受意外伤害的"},{"w":"deflected from:","ipa":"/dɪˈflektɪd frɒm/","m":"从...偏离"},{"w":"a charge of:","ipa":"/ə tʃɑːrdʒ ɒv/","m":"一份，一股 (这里比喻遗传物质)"},{"w":"perpetuate:","ipa":"/pərˈpetʃueɪt/","m":"(v.) 使永久，使延续"},{"w":"hereditary:","ipa":"/həˈredɪteri/","m":"(adj.) 遗传的"}]},{"title":"一次改变认知的阅读体验","en":["The book was a standard-issue 1950s schoolbook—battered, unloved, grimly hefty—but near the front it had an illustration that just captivated me: a cutaway diagram showing the Earth's interior as it would look if you cut into the planet with a large knife and carefully withdrew a wedge representing about a quarter of its bulk. It's hard to believe that there was ever a time when I had not seen such an illustration before, but evidently I had not for I clearly remember being transfixed. I suspect, in honesty, my initial interest was based on a private image of streams of unsuspecting eastbound motorists in the American plains states plunging over the edge of a sudden 4,000-mile-high cliff running between Central America and the North Pole, but gradually my attention did turn in a more scholarly manner to the scientific import of the drawing and the realization that the Earth consisted of discrete layers, ending in the center with a glowing sphere of iron and nickel, which was as hot as the surface of the Sun, according to the caption, and I remember thinking with real wonder: \"How do they know that?\""],"zh":["那是一本标准的 1950 年代教科书——破旧不堪、无人喜爱、厚重得令人压抑——但在靠近书的前部，有一幅插图深深吸引了我：那是一幅剖面图，展示了如果你用一把大刀切开这颗行星，并小心地抽出一块约占其体积四分之一的楔形部分后，地球内部将会呈现的样子。很难相信我曾有那么一段时间从未见过这样的插图，但显然我确实没见过，因为我清楚地记得自己当时看呆了。说实话，我怀疑自己最初的兴趣是基于一个私人想象：美国平原各州那些不知情的东行司机们，突然冲下一道位于中美洲和北极之间、高达 4000 英里的悬崖边缘。但渐渐地，我的注意力确实以更学术的方式转向了这幅图画的科学内涵，并认识到地球是由离散的层构成的，最中心是一个发光的铁镍球体，根据说明，其温度和太阳表面一样高。我记得自己当时真的充满疑惑地想：“他们怎么知道这个的？”"],"st":[{"t":"核心句 1： The book was a standard-issue 1950s schoolbook... but it had an illustration that captivated me."},{"t":"非核心修饰：破折号间的 battered, unloved, grimly hefty 描述书的状态；冒号后的长句是 illustration 的同位语，具体描述插图内容（本身是一个包含条件从句 if you cut... 的复杂结构）。"},{"t":"核心句 2： It's hard to believe... but evidently I had not for I remember being transfixed."},{"t":"核心成分： It's hard to believe (that...) but I had not. 转折结构，后接原因从句 for I remember...。"},{"t":"核心句 3： I suspect... my initial interest was based on a private image..., but gradually my attention did turn... to the scientific import... and the realization..., and I remember thinking..."},{"t":"这是本段最复杂的复合句，由 but 和 and 连接："},{"t":"第一部分 (幻想)： my interest was based on a private image of... motorists plunging...（plunging... 现在分词短语修饰 motorists，running... 分词短语修饰 cliff）。"},{"t":"第二部分 (转折)： but my attention did turn to the import and the realization。"},{"t":"第三部分 (科学认知)： the realization that the Earth consisted of layers, ending with a sphere, which was as hot...（that 引导同位语从句说明 realization，ending...分词结构作状语，which 引导非限制性定语从句修饰 sphere）。"},{"t":"第四部分 (好奇)： and I remember thinking: \"...\"。"}],"vo":[{"w":"standard-issue:","ipa":"/ˈstændərd ˈɪʃuː/","m":"(adj.) 标准配置的，普通常见的"},{"w":"battered:","ipa":"/ˈbætərd/","m":"(adj.) 破旧不堪的"},{"w":"grimly hefty:","ipa":"/ˈɡrɪmli ˈhefti/","m":"沉重得令人压抑的"},{"w":"cutaway diagram:","ipa":"/ˈkʌtəweɪ ˈdaɪəɡræm/","m":"剖面图，分解图"},{"w":"transfixed:","ipa":"/trænsˈfɪkst/","m":"(adj.) 惊呆的，目瞪口呆的"},{"w":"unsuspecting:","ipa":"/ˌʌnsəˈspektɪŋ/","m":"(adj.) 毫无戒备的，不知情的"},{"w":"eastbound:","ipa":"/ˈiːstbaʊnd/","m":"(adj.) 向东行驶的"},{"w":"plunging over:","ipa":"/ˈplʌndʒɪŋ ˈəʊvər/","m":"冲下，坠下"},{"w":"scholarly:","ipa":"/ˈskɒlərli/","m":"(adj.) 学术性的，学者式的"},{"w":"import:","ipa":"/ˈɪmpɔːrt/","m":"(n.) 重要性，含义 (此处不是“进口”)"},{"w":"discrete:","ipa":"/dɪˈskriːt/","m":"(adj.) 分离的，不连续的"},{"w":"glowing sphere:","ipa":"/ˈɡləʊɪŋ sfɪər/","m":"发光的球体"}]},{"title":"自由市场经济理论的一个观点","en":["That each large firm will act with consideration of its own needs and thus avoid selling its products for more than its competitors charge is commonly recognized by advocates of free-market economic theories."],"zh":["自由市场经济理论的支持者们普遍承认，每家大型公司都会基于自身需求行事，从而避免以高于竞争对手的价格销售产品。"],"st":[{"t":"核心句 (被动语态)： That... is commonly recognized by advocates..."},{"t":"主语：整个 That 引导的主语从句 (That each large firm will act... and thus avoid...)。"},{"t":"从句核心：each large firm will act... and avoid selling..."},{"t":"从句修饰：with consideration of its own needs (方式状语)；for more than its competitors charge (比较状语从句，修饰 more)。"},{"t":"谓语： is recognized (被承认)。"},{"t":"动作发出者： by advocates of free-market economic theories。"}],"vo":[{"w":"with consideration of:","ipa":"/wɪð kənˌsɪdəˈreɪʃən ɒv/","m":"考虑到，基于"},{"w":"advocates:","ipa":"/ˈædvəkeɪts/","m":"(n.) 倡导者，支持者"},{"w":"free-market:","ipa":"/ˈfriː ˈmɑːrkɪt/","m":"(adj.) 自由市场的"}]},{"title":"历史流行病研究的资料困境","en":["Unfortunately, the documentation of these and other epidemics is slight and frequently unreliable, and it is necessary to supplement what little we do know with evidence from recent epidemics among Native Americans."],"zh":["不幸的是，关于这些以及其他流行病的记载稀少且常常不可靠，因此有必要用美洲原住民中近期流行病的证据来补充我们仅有的那点知识。"],"st":[{"t":"核心句 (并列句)： The documentation is slight and unreliable, and it is necessary to supplement what we know."},{"t":"分句 1： The documentation is slight and unreliable.（of these... epidemics 修饰 documentation）。"},{"t":"分句 2： it is necessary to supplement...（it 是形式主语，真正主语是 to supplement... 不定式短语）。"},{"t":"不定式短语结构： supplement what little we do know with evidence。"},{"t":"what little we do know 是宾语从句，作 supplement 的宾语。"},{"t":"from recent epidemics among Native Americans 是介词短语，修饰 evidence。"}],"vo":[{"w":"documentation:","ipa":"/ˌdɒkjumenˈteɪʃn/","m":"(n.)文件记载，文献证明"},{"w":"epidemics:","ipa":"/ˌepɪˈdemɪks/","m":"(n.)流行病"},{"w":"slight:","ipa":"/slaɪt/","m":"(adj.)微小的，不足的"},{"w":"supplement:","ipa":"/ˈsʌplɪment/","m":"(v.)补充，增补"},{"w":"Native Americans:","ipa":"/ˈneɪtɪvəˈmerɪkənz/","m":"美洲原住民，印第安人"}]},{"title":"人不能“既要又要”","en":["Perhaps he believed that he could not criticize American foreign policy without endangering the support for civil rights that he had won from the federal government."],"zh":["或许他认为，他不能在不危及他从联邦政府那里赢得的对民权事业的支持的情况下批评美国的对外政策。"],"st":[{"t":"核心：He believed that he could not criticize policy without endangering support. （他相信他不能在不危及支持的情况下批评政策。）"},{"t":"非核心："},{"t":"for civil rights：修饰“支持”的具体内容。"},{"t":"that he had won from the federal government：定语从句，修饰“支持”，说明其来源。"}],"vo":[{"w":"criticize","ipa":"/ˈkrɪtɪsaɪz/","m":"v. 批评"},{"w":"foreign policy","ipa":"/ˈfɒrən ˈpɒləsi/","m":"n. 对外政策，外交政策"},{"w":"endanger","ipa":"/ɪnˈdeɪndʒə(r)/","m":"v. 危及，使遭受危险"},{"w":"civil rights","ipa":"/ˈsɪvl ˈraɪts/","m":"n. 公民权利，民权"},{"w":"federal government","ipa":"/ˈfedərəl ˈɡʌvənmənt/","m":"n. 联邦政府"}]},{"title":"模糊分类与阶级敌意","en":["Despite these vague categories, one should not claim unequivocally that hostility between recognizable classes cannot be legitimately observed."],"zh":["尽管存在这些模糊的分类，我们也不应断然宣称，在可识别的阶级之间无法客观有效地观察到敌意。"],"st":[{"t":"核心：One should not claim that hostility cannot be observed. （人们不应宣称敌意无法被观察到。）"},{"t":"非核心："},{"t":"Despite these vague categories：让步状语。"},{"t":"between recognizable classes：修饰“敌意”的范围。"},{"t":"unequivocally 和 legitimately：副词，分别修饰“宣称”和“观察到”。"}],"vo":[{"w":"despite","ipa":"/dɪˈspaɪt/","m":"prep. 尽管"},{"w":"vague","ipa":"/veɪɡ/","m":"adj. 模糊的"},{"w":"category","ipa":"/ˈkætəɡəri/","m":"n. 类别，分类"},{"w":"claim","ipa":"/kleɪm/","m":"v. 宣称，声称"},{"w":"unequivocally","ipa":"/ˌʌnɪˈkwɪvəkli/","m":"adv. 明确地，毫不含糊地"},{"w":"hostility","ipa":"/hɒˈstɪləti/","m":"n. 敌意，敌对"},{"w":"recognizable","ipa":"/ˈrekəɡnaɪzəbl/","m":"adj. 可识别的"},{"w":"legitimately","ipa":"/lɪˈdʒɪtɪmətli/","m":"adv. 合法地；合理地（此处指客观有效地）"}]},{"title":"舞蹈形式之革新","en":["She wished to discard the traditional methods and established vocabularies of such dance forms as ballet and to explore the internal sources of human expressiveness."],"zh":["她希望摒弃芭蕾等舞蹈形式的传统方法和既定程式，并去探索人类表现力的内在源泉。"],"st":[{"t":"核心：She wished to discard the methods and vocabularies and to explore the sources. （她希望摒弃方法和程式，并探索源泉。）"},{"t":"非核心："},{"t":"traditional 和 established：形容词，分别修饰“方法”和“程式”。"},{"t":"of such dance forms as ballet：介词短语，修饰前面的“方法和程式”。"},{"t":"of human expressiveness：介词短语，修饰“源泉”。"}],"vo":[{"w":"discard","ipa":"/dɪsˈkɑːd/","m":"v. 抛弃，摒弃"},{"w":"established","ipa":"/ɪˈstæblɪʃt/","m":"adj. 既定的，确立的"},{"w":"vocabulary","ipa":"/vəˈkæbjələri/","m":"n. （此处指艺术领域的）表现手法，程式"},{"w":"ballet","ipa":"/ˈbæleɪ/","m":"n. 芭蕾舞"},{"w":"explore","ipa":"/ɪkˈsplɔː(r)/","m":"v. 探索"},{"w":"internal","ipa":"/ɪnˈtɜːnl/","m":"adj. 内部的"},{"w":"expressiveness","ipa":"/ɪkˈspresɪvnəs/","m":"n. 表现力"}]},{"title":"企业主的资金来源","en":["Individual entrepreneurs do not necessarily rely on their kin because they cannot obtain financial backing from commercial resources."],"zh":["个体企业主不一定是因为无法从商业渠道获得资金支持，才去依赖他们的亲属。"],"st":[{"t":"核心：Entrepreneurs do not rely on kin because they cannot obtain backing. （企业主不依赖亲属，因为他们无法获得支持。） *注意：此外“not necessarily because”是一个整体，意为“不一定是因为”，需结合中文语气理解。"},{"t":"非核心："},{"t":"Individual：形容词，修饰“企业主”。"},{"t":"financial 和 commercial：形容词，分别修饰“支持”和“渠道”。"}],"vo":[{"w":"fentrepreneur","ipa":"/ˌɒntrəprəˈnɜː(r)/","m":"n. 企业家，创业者"},{"w":"necessarily","ipa":"/ˌnesəˈserəli/","m":"adv. 必然地"},{"w":"rely on","ipa":"/rɪˈlaɪ ɒn/","m":"v. 依赖，依靠"},{"w":"kin","ipa":"/kɪn/","m":"n. 亲属，家人"},{"w":"obtain","ipa":"/əbˈteɪn/","m":"v. 获得"},{"w":"financial backing","ipa":"/faɪˈnænʃl ˈbækɪŋ/","m":"n. 资金支持"},{"w":"commercial","ipa":"/kəˈmɜːʃl/","m":"adj. 商业的"}]},{"title":"被“掀翻”的火星","en":["An impact capable of ejecting a fragment of the Martian surface into an Earth-intersecting orbit is even less probable than such an event on the Moon, in view of the Moon's smaller size and closer proximity to Earth."],"zh":["考虑到月球体积更小、离地球更近，一次能将火星表面碎片抛射到与地球轨道相交的轨道上的撞击，其发生概率比月球上发生类似事件的概率还要低。"],"st":[{"t":"核心：An impact is less probable than an event. （一次撞击比一个事件的可能性更低。）"},{"t":"非核心："},{"t":"capable of ... orbit：形容词短语作后置定语，修饰“撞击”，描述其能力。"},{"t":"such an event on the Moon：比较的对象。"},{"t":"in view of ... Earth：介词短语作原因状语，说明概率更低的依据。"}],"vo":[{"w":"impact","ipa":"/ˈɪmpækt/","m":"n.撞击"},{"w":"capable of","ipa":"/ˈkeɪpəbləv/","m":"adj.能够…的"},{"w":"eject","ipa":"/iˈdʒekt/","m":"v.喷射，抛射"},{"w":"fragment","ipa":"/ˈfræɡmənt/","m":"n.碎片"},{"w":"Martian","ipa":"/ˈmɑːʃn/","m":"adj.火星的"},{"w":"orbit","ipa":"/ˈɔːbɪt/","m":"n.轨道"},{"w":"Earth-intersecting","ipa":"/ɜːθˈɪntəsektɪŋ/","m":"adj.与地球轨道相交的"},{"w":"probable","ipa":"/ˈprɒbəbl/","m":"adj.可能的"},{"w":"in view of","ipa":"/ɪn vjuːəv/","m":"prep.鉴于，考虑到"},{"w":"proximity","ipa":"/prɒkˈsɪməti/","m":"n.接近，临近"}]},{"title":"趋同进化理论的挑战","en":["But the recent discovery of detailed similarities in the skeletal structure of the flippers in all three groups undermines the attempt to explain away superficial resemblance as due to convergent evolution — the independent development of similarities between unrelated groups in response to similar environmental pressures."],"zh":["但是，最近在三个类群的鳍肢骨骼结构中发现的高度相似性，破坏了那种将表面相似性轻率归因于趋同进化（即不相关的类群为应对相似的环境压力而独立发展出相似性）的企图。"],"st":[{"t":"核心：The discovery undermines the attempt. （这一发现破坏了这一企图。）"},{"t":"非核心："},{"t":"of detailed similarities ... groups：介词短语作定语，修饰“发现”，说明其具体内容。"},{"t":"to explain away ... evolution：不定式短语作定语，修饰“企图”，说明其内容。"},{"t":"破折号后的部分：同位语，解释“趋同进化”的定义。"}],"vo":[{"w":"detailed","ipa":"/ˈdiːteɪld/","m":"adj. 详细的"},{"w":"similarity","ipa":"/ˌsɪməˈlærəti/","m":"n. 相似性"},{"w":"skeletal","ipa":"/ˈskelətl/","m":"adj. 骨骼的"},{"w":"flipper","ipa":"/ˈflɪpə(r)/","m":"n. 鳍肢"},{"w":"undermine","ipa":"/ˌʌndəˈmaɪn/","m":"v. 破坏，削弱"},{"w":"explain away","ipa":"/ɪkˈspleɪn əˈweɪ/","m":"v. 通过解释来否定（或淡化）"},{"w":"superficial","ipa":"/ˌsuːpəˈfɪʃl/","m":"adj. 表面的"},{"w":"resemblance","ipa":"/rɪˈzembləns/","m":"n. 相似"},{"w":"convergent evolution","ipa":"/kənˈvɜːdʒənt ˌiːvəˈluːʃn/","m":"n. 趋同进化"},{"w":"in response to","ipa":"/ɪn rɪˈspɒns tuː/","m":"prep. 作为对…的反应"}]},{"title":"松果结构与花粉传播","en":["For example, the spiral arrangement of scale-bract complexes on ovule-bearing pine cones, where the female reproductive organs of conifers are located, is important to the production of airflow patterns that spiral over the cone's surfaces, thereby passing airborne pollen from one scale to the next."],"zh":["例如，在具胚珠的松果（松柏类植物的雌性生殖器官所在之处）上，鳞苞复合体的螺旋状排列，对于产生在松果表面盘旋的气流模式至关重要，从而将空气中的花粉从一个鳞片传递到下一个鳞片。"],"st":[{"t":"核心：The spiral arrangement is important to the production of airflow patterns. （螺旋状排列对气流模式的产生很重要。）"},{"t":"非核心："},{"t":"of scale-bract complexes on ovule-bearing pine cones：修饰“排列”的具体对象和位置。"},{"t":"where ... are located：非限制性定语从句，补充说明“松果”的功能。"},{"t":"that spiral over the cone's surfaces：定语从句，修饰“气流模式”。"},{"t":"thereby passing ... to the next：现在分词短语作结果状语。"}],"vo":[{"w":"spiral","ipa":"/ˈspaɪrəl/","m":"adj. 螺旋形的 n./v. 螺旋（形）"},{"w":"arrangement","ipa":"/əˈreɪndʒmənt/","m":"n. 排列，布置"},{"w":"scale-bract complex","ipa":"/skeɪl brækt ˈkɒmpleks/","m":"n. 鳞苞复合体"},{"w":"ovule-bearing","ipa":"/ˈɒvjuːl ˈbeərɪŋ/","m":"adj. 具胚珠的"},{"w":"cone","ipa":"/kəʊn/","m":"n. 球果，松果"},{"w":"reproductive","ipa":"/ˌriːprəˈdʌktɪv/","m":"adj. 生殖的"},{"w":"conifer","ipa":"/ˈkɒnɪfə(r)/","m":"n. 针叶树，松柏类植物"},{"w":"airflow","ipa":"/ˈeəfləʊ/","m":"n. 气流"},{"w":"airborne","ipa":"/ˈeəbɔːn/","m":"adj. 空气传播的"},{"w":"pollen","ipa":"/ˈpɒlən/","m":"n. 花粉"}]},{"title":"冰期序列的划分依据","en":["This succession was based primarily on a series of deposits and events not directly related to glacial and interglacial periods, rather than on the more usual modern method of studying biological remains found in interglacial beds themselves interstratified within glacial deposits."],"zh":["这一（冰期）序列的划分，主要依据的是一系列与冰期和间冰期无直接关联的沉积物和事件，而非依据更常用的现代方法——研究那些夹杂在冰川沉积物内部的间冰期地层中所发现的生物遗骸。"],"st":[{"t":"核心：This succession was based on deposits and events, rather than on method. （这一序列是基于沉积物和事件，而不是基于方法。）"},{"t":"非核心："},{"t":"not directly related to ... periods：形容词短语作后置定语，修饰“沉积物和事件”。"},{"t":"of studying biological remains：介词短语作定语，修饰“方法”。"},{"t":"found in ... beds：过去分词短语作定语，修饰“生物遗骸”。"},{"t":"themselves interstratified within glacial deposits：独立主格结构，补充说明“间冰期地层”的状态。"}],"vo":[{"w":"succession","ipa":"/səkˈseʃn/","m":"n. （地质）序列，顺序"},{"w":"primarily","ipa":"/ˈpraɪmrəli/","m":"adv. 主要地"},{"w":"deposit","ipa":"/dɪˈpɒzɪt/","m":"n. 沉积物"},{"w":"glacial","ipa":"/ˈɡleɪʃl/","m":"adj. 冰川的，冰期的"},{"w":"interglacial","ipa":"/ˌɪntəˈɡleɪʃl/","m":"adj. 间冰期的"},{"w":"biological remains","ipa":"/ˌbaɪəˈlɒdʒɪkl rɪˈmeɪnz/","m":"n. 生物遗骸"},{"w":"interstratified","ipa":"/ˌɪntəˈstrætɪfaɪd/","m":"adj. 夹层状的，交错层理的"}]}]},{"no":10,"header":"第十一节","passages":[{"title":"脑过程与心理体验相关性的早期研究","en":["By 1950, the results of attempts to relate brain processes to mental experience appeared rather discouraging. Such variations in size, shape, chemistry, conduction speed, excitation threshold, and the like as had been demonstrated in nerve cells remained negligible in significance for any possible correlation with the manifold dimensions of mental experience. Near the turn of the century, it had been suggested by Hering that different modes of sensation, such as pain, taste, and color, might be correlated with the discharge of specific kinds of nervous energy. However, subsequently developed methods of recording and analyzing nerve potentials failed to reveal any such qualitative diversity. It was possible to demonstrate by other methods refined structural differences among neuron types; however, proof was lacking that the quality of the impulse or its condition was influenced by these differences, which seemed instead to influence the developmental patterning of the neural circuits. Although qualitative variance among nerve energies was never rigidly disproved, the doctrine was generally abandoned in favor of the opposing view, namely, that nerve impulses are essentially homogeneous in quality and are transmitted as \"common currency\" throughout the nervous system."],"zh":["到 1950 年，试图将大脑过程与心理体验联系起来的尝试，其结果显得相当令人沮丧。在神经细胞中已被证实的诸如大小、形状、化学性质、传导速度、兴奋阈值等方面的差异，对于可能与心理体验的多维层面建立任何关联而言，其意义仍然微不足道。接近世纪之交时，赫林曾提出，不同的感觉模式（如痛觉、味觉和颜色知觉）可能与特定种类的神经能量的释放相关。然而，随后发展起来的记录和分析神经电位的方法未能揭示任何此类质的多样性。通过其他方法确实可以证明神经元类型之间存在细微的结构差异；但是，缺乏证据表明冲动本身的性质或其状态受这些差异的影响，这些差异似乎反而影响神经回路的发育模式。尽管神经能量之间的质的差异从未被严格证伪，但该学说已被普遍放弃，转而支持相反的观点，即神经冲动在性质上是基本同质的，并作为“通用货币”在整个神经系统中传递。"],"st":[{"h":"第一句"},{"t":"核心：the results appeared rather discouraging."},{"t":"非核心：By 1950（时间状语），of attempts to relate brain processes to mental experience（定语修饰results）。"},{"h":"第二句"},{"t":"核心：Such variations remained negligible in significance."},{"t":"非核心： in size, shape, chemistry, conduction speed, excitation threshold, and the like （列举修饰variations），as had been demonstrated in nerve cells（定语从句修饰 variations），for any possible correlation with the manifold dimensions of mental experience（目的状语）。"},{"h":"第三句"},{"t":"核心：it had been suggested by Hering that...（形式主语结构，真正主语是 that 从句）。"},{"t":"非核心：Near the turn of the century（时间状语），such as pain, taste, and color（举例修饰 modes）。"},{"h":"第四句"},{"t":"核心：methods failed to reveal any such qualitative diversity."},{"t":"非核心：However（转折副词），subsequently developed（定语修饰 methods），of recording and analyzing nerve potentials（定语修饰 methods）。"},{"h":"第五句"},{"t":"核心 1：It was possible to demonstrate refined structural differences."},{"t":"核心 2：proof was lacking that...（that 从句为同位语从句，说明 proof 的内容）。"},{"t":"非核心：by other methods（方式状语），among neuron types（地点状语），however（转折），which seemed instead to influence the developmental patterning of the neural circuits（非限制性定语从句修饰 differences）。"},{"h":"第六句"},{"t":"核心：the doctrine was generally abandoned."},{"t":"非核心：Although qualitative variance among nerve energies was never rigidly disproved（让步状语从句），in favor of the opposing view（方式状语），namely, that nerve impulses are essentially homogeneous...（同位语从句解释 view）。"}],"vo":[{"w":"relate","ipa":"/rɪˈleɪt/","m":"v. 联系；叙述"},{"w":"discouraging","ipa":"/dɪsˈkɜːrɪdʒɪŋ/","m":"adj. 令人沮丧的"},{"w":"variation","ipa":"/ˌveriˈeɪʃən/","m":"n. 变化；差异"},{"w":"conduction","ipa":"/kənˈdʌkʃən/","m":"n. 传导"},{"w":"threshold","ipa":"/ˈθreʃhoʊld/","m":"n. 阈值；门槛"},{"w":"negligible","ipa":"/ˈneɡlɪdʒəbl/","m":"adj. 微不足道的"},{"w":"manifold","ipa":"/ˈmænɪfoʊld/","m":"adj. 多方面的；多种的"},{"w":"dimension","ipa":"/daɪˈmenʃən/","m":"n. 维度；方面"},{"w":"discharge","ipa":"/dɪsˈtʃɑːrdʒ/","m":"n. 释放；排出"},{"w":"subsequently","ipa":"/ˈsʌbsɪkwəntli/","m":"adv. 随后"},{"w":"potential","ipa":"/pəˈtenʃl/","m":"n. 电位；潜力"},{"w":"qualitative","ipa":"/ˈkwɑːlɪteɪtɪv/","m":"adj. 质的；性质上的"},{"w":"diversity","ipa":"/daɪˈvɜːrsəti/","m":"n. 多样性"},{"w":"refined","ipa":"/rɪˈfaɪnd/","m":"adj. 精细的；优雅的"},{"w":"neuron","ipa":"/ˈnʊrɑːn/","m":"n. 神经元"},{"w":"impulse","ipa":"/ˈɪmpʌls/","m":"n. 冲动；脉冲"},{"w":"patterning","ipa":"/ˈpætərnɪŋ/","m":"n. 模式形成"},{"w":"neural","ipa":"/ˈnʊrəl/","m":"adj. 神经的"},{"w":"circuit","ipa":"/ˈsɜːrkɪt/","m":"n. 回路；电路"},{"w":"variance","ipa":"/ˈveriəns/","m":"n. 差异；变异"},{"w":"rigidly","ipa":"/ˈrɪdʒɪdli/","m":"adv. 严格地； rigidly disproved 被严格证伪"},{"w":"doctrine","ipa":"/ˈdɑːktrɪn/","m":"n. 学说；教义"},{"w":"abandon","ipa":"/əˈbændən/","m":"v. 放弃"},{"w":"in favor of","ipa":"","m":"支持；赞同"},{"w":"opposing","ipa":"/əˈpoʊzɪŋ/","m":"adj. 相反的；对立的"},{"w":"homogeneous","ipa":"/ˌhoʊməˈdʒiːniəs/","m":"adj. 同质的"},{"w":"currency","ipa":"/ˈkɜːrənsi/","m":"n. 货币；流通"}]},{"title":"更新世研究者的幻想模型","en":["Nevertheless, researchers of the Pleistocene epoch have developed all sorts of more or less fanciful model schemes of how they would have arranged the Ice Age had they been in charge of events."],"zh":["然而，更新世的研究者们构想出了各种或多或少有些异想天开的模型方案，设想如果他们当时掌管事态，会如何安排冰河时代。"],"st":[{"t":"核心：researchers have developed all sorts of model schemes."},{"t":"非核心：Nevertheless（转折副词），of the Pleistocene epoch（定语修饰 researchers），more or less fanciful","g":"（定语修饰 model schemes），of how they would have arranged the Ice Age（介词短语修饰 schemes，其中"},{"t":"how 引导宾语从句），had they been in charge of events（虚拟条件句的倒装形式，相当于 if they had been in charge of events，修饰 would have arranged）。"}],"vo":[{"w":"nevertheless","ipa":"/ˌnevərðəˈles/","m":"adv. 然而"},{"w":"Pleistocene","ipa":"/ˈplaɪstəsiːn/","m":"n. 更新世（地质年代）"},{"w":"epoch","ipa":"/ˈepək/","m":"n. 纪元；时期"},{"w":"fanciful","ipa":"/ˈfænsɪfl/","m":"adj. 幻想的；异想天开的"},{"w":"scheme","ipa":"/skiːm/","m":"n. 计划；方案"},{"w":"Ice Age","ipa":"","m":"冰河时代"},{"w":"in charge of","ipa":"","m":"负责；掌管"}]},{"title":"秘书工作的分化","en":["It was not the change in office technology, but rather the separation of secretarial work, previously seen as an apprenticeship for beginning managers, from administrative work that in the 1880s created a new class of “dead-end” jobs, thenceforth considered “women's work”."],"zh":["在 19 世纪 80 年代，创造出一种新的“没有前途”的职业（此后被视为“女性的工作”）的，并不是办公技术的变革，而是秘书工作（之前被视为初级经理的学徒期）与行政工作的分离。"],"st":[{"t":"核心：It was not the change... but rather the separation... that created a new class of “dead-end” jobs.","g":"（强调句型，强调主语 the separation）"},{"t":"非核心：in office technology（定语修饰 change），of secretarial work（定语修饰 separation），previously seen as an apprenticeship for beginning managers（过去分词短语修饰 secretarial work），from administrative work（与 separation 搭配），in the 1880s（时间状语），thenceforth considered “women's work”（过去分词短语修饰 jobs）。"}],"vo":[{"w":"separation","ipa":"/ˌsepəˈreɪʃən/","m":"n. 分离；分开"},{"w":"secretarial","ipa":"/ˌsekrəˈteriəl/","m":"adj. 秘书的"},{"w":"apprenticeship","ipa":"/əˈprentɪʃɪp/","m":"n. 学徒期"},{"w":"administrative","ipa":"/ədˈmɪnɪstreɪtɪv/","m":"adj. 行政的；管理的"},{"w":"dead-end","ipa":"/ˈded end/","m":"adj. 没有前途的；死胡同的"},{"w":"thenceforth","ipa":"/ˌðensˈfɔːrθ/","m":"adv. 此后"}]},{"title":"mRNA 翻译成蛋白质的过程","en":["Transported outside the nucleus to the cytoplasm, the mRNA is translated into the protein it encodes by an organelle known as a ribosome, which strings together amino acids in the order specified by the sequence of elements in the mRNA molecule."],"zh":["mRNA 被转运出细胞核到达细胞质后，由一种称为核糖体的细胞器翻译成它所编码的蛋白质；核糖体按照 mRNA 分子中核苷酸序列所规定的顺序将氨基酸串连在一起。"],"st":[{"t":"核心：the mRNA is translated into the protein."},{"t":"非核心：Transported outside the nucleus to the cytoplasm（过去分词短语作状语，表时间/被动），it encodes（定语从句修饰 protein，省略 that），by an organelle known as a ribosome（方式状语），which strings together amino acids...（非限制性定语从句修饰 ribosome），in the order specified by the sequence of elements in the mRNA molecule（方式状语修饰 strings）。"}],"vo":[{"w":"transported","ipa":"/trænˈspɔːrtɪd/","m":"v. 运输（过去分词）"},{"w":"nucleus","ipa":"/ˈnuːkliəs/","m":"n. 细胞核"},{"w":"cytoplasm","ipa":"/ˈsaɪtəplæzəm/","m":"n. 细胞质"},{"w":"translate","ipa":"/trænsˈleɪt/","m":"v. 翻译（此处指遗传信息的翻译）"},{"w":"encode","ipa":"/ɪnˈkoʊd/","m":"v. 编码"},{"w":"organelle","ipa":"/ˌɔːrɡəˈnel/","m":"n. 细胞器"},{"w":"ribosome","ipa":"/ˈraɪbəsoʊm/","m":"n. 核糖体"},{"w":"string together","ipa":"","m":"串连；连接"},{"w":"amino acid","ipa":"/əˈmiːnoʊ ˈæsɪd/","m":"氨基酸"},{"w":"specify","ipa":"/ˈspesɪfaɪ/","m":"v. 指定；规定"},{"w":"sequence","ipa":"/ˈsiːkwəns/","m":"n. 序列"},{"w":"element","ipa":"/ˈelɪmənt/","m":"n. 元素（此处指核苷酸）"}]},{"title":"童年观念的社会传播","en":["Well established among segments of the middle and upper classes by the mid-1800's, this new view of childhood spread throughout society in the late-nineteenth and early-twentieth centuries as reformers introduced child-labor regulations and compulsory education laws predicated in part on the assumption that a child's emotional value made child labor taboo."],"zh":["到 19 世纪中叶，这种新的童年观已在部分中上层阶级中牢固确立，并在 19 世纪末 20 世纪初传播至整个社会，当时改革者们引入了童工法规和义务教育法，这些法律部分基于这样一种假设：儿童的情感价值使得童工成为禁忌。"],"st":[{"t":"核心：this new view spread throughout society."},{"t":"非核心：Well established among segments of the middle and upper classes by the mid-1800's（过去分词短语作状语，表伴随状态），in the late-nineteenth and early-twentieth centuries（时间状语），as reformers introduced child-labor regulations and compulsory education laws（时间状语从句），predicated in part on the assumption（过去分词短语修饰 laws），that a child's emotional value made child labor taboo（同位语从句修饰 assumption）。"}],"vo":[{"w":"well established","ipa":"","m":"牢固确立的"},{"w":"segment","ipa":"/ˈseɡmənt/","m":"n. 部分；阶层"},{"w":"mid-1800's","ipa":"","m":"19 世纪中叶"},{"w":"spread","ipa":"/spred/","m":"v. 传播"},{"w":"reformer","ipa":"/rɪˈfɔːrmər/","m":"n. 改革者"},{"w":"child-labor","ipa":"/tʃaɪld ˈleɪbər/","m":"n. 童工"},{"w":"regulation","ipa":"/ˌreɡjuˈleɪʃən/","m":"n. 法规；规章"},{"w":"compulsory","ipa":"/kəmˈpʌlsəri/","m":"adj. 义务的；强制的"},{"w":"compulsory education","ipa":"","m":"义务教育"},{"w":"predicate","ipa":"/ˈpredɪkeɪt/","m":"v. 基于；断定"},{"w":"in part","ipa":"","m":"部分地"},{"w":"assumption","ipa":"/əˈsʌmpʃən/","m":"n. 假设；假定"},{"w":"emotional","ipa":"/ɪˈmoʊʃənl/","m":"adj. 情感的"},{"w":"taboo","ipa":"/təˈbuː/","m":"n. 禁忌"}]},{"title":"地幔对流的传统观点","en":["The traditional view supposes that the upper mantle of the earth behaves as a liquid when it is subjected to small forces for long periods and that differences in temperature under oceans and continents are sufficient to produce convection in the mantle of the earth with rising convection currents under the mid-ocean ridges and sinking currents under the continents."],"zh":["传统观点认为，地球的上地幔在长时间受到微小作用力时会表现得像液体一样，并且海洋和大陆下方的温度差异足以在地幔中产生对流，其中上升对流出现在大洋中脊下方，下沉对流出现在大陆下方。"],"st":[{"t":"核心：The traditional view supposes that... and that... （两个并列的宾语从句）"},{"t":"第一个 that 从句：the upper mantle behaves as a liquid."},{"t":"非核心：when it is subjected to small forces for long periods（时间状语从句）。"},{"t":"第二个 that 从句：differences in temperature are sufficient to produce convection."},{"t":"非核心：under oceans and continents（定语修饰 temperature），in the mantle of the earth（地点状语），with rising convection currents under the mid-ocean ridges and sinking currents under the continents（伴随状语，具体描述对流形式）。"}],"vo":[{"w":"mantle","ipa":"/ˈmæntl/","m":"n. 地幔"},{"w":"behave","ipa":"/bɪˈheɪv/","m":"v. 表现；行为"},{"w":"subject to","ipa":"","m":"使经受；使遭受"},{"w":"sufficient","ipa":"/səˈfɪʃənt/","m":"adj. 足够的"},{"w":"convection","ipa":"/kənˈvekʃən/","m":"n. 对流"},{"w":"current","ipa":"/ˈkɜːrənt/","m":"n. 流；电流"},{"w":"mid-ocean ridge","ipa":"","m":"大洋中脊"},{"w":"sinking","ipa":"/ˈsɪŋkɪŋ/","m":"adj. 下沉的"}]}]}]</script>
<script>
{
const D = JSON.parse(document.getElementById('data').textContent);
const KEY = 'nnkj:v1';
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CN = ['','一','二','三','四','五','六','七','八','九','十'];

// ── 状态 ──
let S = {p: {}, ui: {mode: 'pair', fs: 17, veil: false, hidev: false, tip: true}};
try { const o = JSON.parse(localStorage.getItem(KEY) || 'null'); if (o && o.p) S = Object.assign(S, o); } catch (e) {}
const pdata = pid => (S.p[pid] = S.p[pid] || {marks: [], reads: 0, ts: 0});
function saveLocal() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function touch(pid) { pdata(pid).ts = Date.now(); saveLocal(); queueDb(pid); }

// ── 云端同步（Claude 页面上的 db；本地打开时没有，只用浏览器存储）──
let DB = null, UID = null, dirty = new Set(), timer = null, writing = false;
const syncEl = $('#sync');
function syncNote(t) { syncEl.textContent = t; }
function queueDb(pid) { if (!DB) return; dirty.add(pid); clearTimeout(timer); timer = setTimeout(flushDb, 800); }
async function flushDb() {
  if (!DB || writing) return;
  writing = true;
  try {
    while (dirty.size) {
      const pid = dirty.values().next().value; dirty.delete(pid);
      const d = S.p[pid] || {marks: [], reads: 0, ts: Date.now()};
      try { await DB.collection('data/users/' + UID).doc(pid).set({marks: d.marks, reads: d.reads, ts: d.ts}); }
      catch (e) { if (e && e.code === 'unavailable') { dirty.add(pid); await new Promise(r => setTimeout(r, 1500)); } else { syncNote('云端保存失败，已存在本机'); } }
    }
    syncNote('已同步');
  } finally { writing = false; }
}
(async () => {
  try {
    if (!window.claude || !window.claude.use) { syncNote('保存在本机浏览器'); return; }
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    const id = user ? await user.id() : null;
    if (!db || !id) { syncNote('保存在本机浏览器'); return; }
    DB = db; UID = id; syncNote('同步中…');
    const to = setTimeout(() => syncNote('云端暂时连不上，先存在本机'), 10000);
    const snap = await DB.collection('data/users/' + UID).get();
    clearTimeout(to);
    const seen = new Set();
    snap.docs.forEach(d => {
      const v = d.data(); if (!v) return; seen.add(d.id);
      const loc = S.p[d.id];
      if (!loc || (v.ts || 0) > (loc.ts || 0)) S.p[d.id] = {marks: v.marks || [], reads: v.reads || 0, ts: v.ts || 0};

  S.p = p; keys.forEach(k => { if (S.p[k]) S.p[k].ts = now; else S.p[k] = {marks: [], reads: 0, ts: now}; queueDb(k); });
  saveLocal(); render(true);
  toast(msg, () => { const old = JSON.parse(before); const ks = new Set([...Object.keys(old), ...Object.keys(S.p)]); S.p = old; ks.forEach(k => { if (!S.p[k]) S.p[k] = {marks: [], reads: 0}; S.p[k].ts = Date.now(); queueDb(k); }); saveLocal(); render(true); });
}
$('#mimp').onclick = () => {
  let o; try { o = JSON.parse($('#mtext').value); } catch (e) { $('#mmsg').textContent = '这段文字不是有效的备份。'; return; }
  if (!o || typeof o.p !== 'object') { $('#mmsg').textContent = '这段文字不是有效的备份。'; return; }
  const merged = JSON.parse(JSON.stringify(S.p));
  Object.keys(o.p).forEach(k => { const a = merged[k], b = o.p[k]; if (!a) merged[k] = b; else { const ids = new Set(a.marks.map(m => m.id)); b.marks.forEach(m => { if (!ids.has(m.id)) a.marks.push(m); }); a.reads = Math.max(a.reads || 0, b.reads || 0); } });
  applyAll(merged, '已导入备份'); $('#modal').classList.remove('on');
};
$('#mreset').onclick = () => { applyAll({}, '已清空全部记录'); $('#modal').classList.remove('on'); };

go();
}
</script>

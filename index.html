<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>楠楠阅读班课件 · 七期速成</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* VOICE  安静、专注的阅读器：像一本带页边批注的课本
   IDEA   书页 + 荧光笔：正文是主角，工具退到边上
   PICTURE 中英并排的段落本身；高亮是唯一的彩色
   COLOUR 白纸黑字，青绿作强调（与 7 课学习网页同色），四色荧光笔
   TYPE   英文 Source Serif 4，中文 Noto Serif SC，界面用系统无衬线 */
:root{color-scheme:light dark;
  --bg:light-dark(#fbfbf9,#15181a);--paper:light-dark(#ffffff,#1c2023);--ink:light-dark(#1d2326,#e6e9ea);
  --muted:light-dark(#69737a,#9aa4aa);--line:light-dark(#e3e6e6,#2d3337);--accent:light-dark(#2f6e6a,#7cc3bb);
  --soft:light-dark(#e3efed,#1f2b2a);
  --h1:light-dark(#fff0a3,#5c5214);--h2:light-dark(#cdeec9,#24482a);--h3:light-dark(#ffd1dc,#5a2433);--h4:light-dark(#cfe4ff,#1f3a5c);
  --en:"Source Serif 4",Georgia,serif;--zh:"Noto Serif SC","Songti SC",serif;
  --ui:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --fs:17px}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--ui);overflow-x:clip}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .in{display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:1320px;margin:0 auto;padding:9px 16px}
.brand{font-family:var(--zh);font-weight:700;font-size:16px;white-space:nowrap}
.brand small{font-family:var(--ui);font-weight:400;color:var(--muted);font-size:12.5px;margin-left:6px}
.sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:none;padding:6px 10px;font-size:13px;min-height:34px}
.seg button.on{background:var(--accent);color:var(--paper)}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 11px;font-size:13px;min-height:34px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.btn:focus-visible,.seg button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#q{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--paper);width:180px;font-size:14px;min-height:34px}
.wrap{display:grid;grid-template-columns:270px minmax(0,1fr);gap:28px;max-width:1320px;margin:0 auto;padding:18px 16px 120px}
aside{position:sticky;top:64px;align-self:start;max-height:calc(100vh - 80px);overflow:auto;padding-right:4px}
.les{border-bottom:1px solid var(--line);padding:4px 0}
.les>button{display:flex;width:100%;align-items:baseline;gap:8px;border:0;background:none;text-align:left;padding:8px 6px;border-radius:6px;min-height:40px}
.les>button:hover{background:var(--soft)}
.les.on>button{color:var(--accent);font-weight:600}
.les .no{font-family:var(--zh);font-weight:700;width:3.6em;flex:none}
.les .meta{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.pl{list-style:none;margin:0 0 6px;padding:0 0 0 10px;display:none}
.les.on .pl{display:block}
.pl a{display:flex;gap:6px;padding:4px 6px;border-radius:5px;color:var(--ink);text-decoration:none;font-size:13.5px;line-height:1.45}
.pl a:hover{background:var(--soft)}
.pl .n{color:var(--muted);font-variant-numeric:tabular-nums;width:1.6em;flex:none;text-align:right}
.pl .c{margin-left:auto;font-size:11.5px;color:var(--muted);white-space:nowrap}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--h1);border:1px solid color-mix(in srgb,var(--ink) 25%,transparent);margin-right:3px;vertical-align:1px}
main h1{font-family:var(--zh);font-size:clamp(26px,3.4vw,38px);line-height:1.15;margin:4px 0 2px;text-wrap:balance}
.lede{color:var(--muted);margin:0 0 18px;font-size:14px}
.tip{background:var(--soft);border-radius:8px;padding:9px 13px;font-size:13.5px;margin:0 0 18px;display:flex;gap:10px;align-items:flex-start}
.tip button{margin-left:auto;border:0;background:none;color:var(--muted);font-size:13px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:22px clamp(16px,3vw,32px);margin:0 0 22px;scroll-margin-top:72px}
.ch{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.ch .pn{font-family:var(--en);color:var(--accent);font-size:15px}
.ch h2{font-family:var(--zh);font-size:22px;margin:0;line-height:1.3}
.reads{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap}
.reads b{color:var(--ink);font-variant-numeric:tabular-nums}
.sec{margin:18px 0 0}
.sec>.sh{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);letter-spacing:.02em;margin:0 0 8px;border:0;background:none;padding:0;min-height:28px}
.sec>.sh::before{content:"";width:14px;height:2px;background:var(--accent);display:inline-block}
.sec.fold>.sb{display:none}
.sec>.sh .tg{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px}
.pair{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:8px 28px;align-items:start}
.pair+.pair{margin-top:12px}
.en{font-family:var(--en);font-size:var(--fs);line-height:1.78;margin:0;hyphens:auto}
.zh{font-family:var(--zh);font-size:calc(var(--fs) - 1.5px);line-height:1.95;margin:0;color:color-mix(in srgb,var(--ink) 88%,var(--muted))}
body[data-mode=en] .zh, body[data-mode=en] .pair{grid-template-columns:1fr}
body[data-mode=en] .zhcol{display:none}
body[data-mode=zh] .encol{display:none}
body[data-mode=zh] .pair{grid-template-columns:1fr}
body[data-mode=stack] .pair{grid-template-columns:1fr;gap:6px}
.veil .zhcol .zh{filter:blur(5px);cursor:pointer;user-select:none;transition:filter .15s}
.veil .zhcol .zh.show{filter:none;user-select:text}
.st{list-style:none;margin:0;padding:0}
.st li{padding:6px 0 6px 12px;border-left:2px solid var(--line);margin:0 0 4px;font-size:15px;line-height:1.7}
.st li.h{border:0;padding:8px 0 2px;font-weight:600;color:var(--accent);font-size:13.5px}
.st .lab{display:inline-block;font-size:12.5px;color:var(--accent);background:var(--soft);border-radius:4px;padding:0 6px;margin-right:6px;white-space:nowrap}
.st .x{font-family:var(--en)}
.vo{width:100%;border-collapse:collapse;font-size:14.5px}
.vo td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.vo td.w{font-family:var(--en);font-weight:600;font-size:15.5px;white-space:nowrap;width:1%}
.vo td.i{font-family:var(--en);color:var(--muted);white-space:nowrap;width:1%}
.hidev .vo td.m .t{filter:blur(5px);cursor:pointer}
.hidev .vo td.m .t.show{filter:none}
mark.hl{color:inherit;border-radius:2px;padding:0 1px;cursor:pointer;box-decoration-break:clone;-webkit-box-decoration-break:clone}
mark.c1{background:var(--h1)}mark.c2{background:var(--h2)}mark.c3{background:var(--h3)}mark.c4{background:var(--h4)}
mark.hl[data-note]::after{content:"✎";font-family:var(--ui);font-size:.68em;vertical-align:super;color:var(--accent);margin-left:1px}
mark.flash{outline:2px solid var(--accent);outline-offset:2px}
#bar{position:fixed;z-index:50;display:none;background:var(--ink);color:var(--paper);border-radius:10px;padding:6px;gap:4px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#bar.on{display:flex}
#bar .sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent}
#bar .sw:hover,#bar .sw.cur{border-color:var(--paper)}
#bar .s1{background:#ffe766}#bar .s2{background:#9fe39a}#bar .s3{background:#ff9fb6}#bar .s4{background:#9cc7ff}
#bar .tx{border:0;background:none;color:var(--paper);padding:6px 9px;border-radius:6px;font-size:13.5px;min-height:34px}
#bar .tx:hover{background:color-mix(in srgb,var(--paper) 15%,transparent)}
#pop{position:fixed;z-index:51;display:none;width:min(340px,calc(100vw - 24px));background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
#pop.on{display:block}
#pop .q{font-family:var(--en);font-size:14px;color:var(--muted);border-left:3px solid var(--accent);padding-left:8px;margin:0 0 8px;max-height:5.5em;overflow:auto}
#pop textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);font-size:16px;resize:vertical}
#pop .row{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}
#pop .sw{width:24px;height:24px;border-radius:50%;border:2px solid transparent}
#pop .sw.cur{border-color:var(--ink)}
#pop .s1{background:#ffe766}#pop .s2{background:#9fe39a}#pop .s3{background:#ff9fb6}#pop .s4{background:#9cc7ff}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--paper);border-radius:10px;padding:9px 14px;font-size:14px;display:flex;gap:14px;align-items:center;transition:.2s;z-index:60;max-width:calc(100vw - 24px)}
.toast.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{border:0;background:none;color:var(--h1);font-weight:600;padding:4px}
.sync{font-size:12px;color:var(--muted);white-space:nowrap}
.notes .nl{list-style:none;margin:0;padding:0}
.notes .ni{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 10px;cursor:pointer}
.notes .ni:hover{border-color:var(--accent)}
.notes .ni .where{font-size:12px;color:var(--muted);margin-bottom:4px}
.notes .ni .tx{font-family:var(--en);line-height:1.6}
.notes .ni .nt{margin-top:6px;font-size:14.5px;white-space:pre-wrap}
.notes .ni .nt::before{content:"✎ ";color:var(--accent)}
.notes h3{font-family:var(--zh);margin:22px 0 8px;font-size:17px}
.empty{color:var(--muted);padding:30px 0;text-align:center}
.res{list-style:none;margin:0;padding:0}
.res li{padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin:0 0 8px;background:var(--paper);cursor:pointer}
.res li:hover{border-color:var(--accent)}
.res .where{font-size:12px;color:var(--muted)}
.res em{font-style:normal;background:var(--h1)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:70;padding:16px}
.modal.on{display:flex}
.modal .box{background:var(--paper);border-radius:12px;padding:18px;width:min(560px,100%);max-height:90vh;overflow:auto}
.modal h3{margin:0 0 8px;font-family:var(--zh)}
.modal textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);font:13px/1.5 ui-monospace,Menlo,monospace}
.modal .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.mtog{display:none}
@media(max-width:860px){
  .wrap{grid-template-columns:1fr;gap:0;padding-top:10px}
  aside{position:fixed;inset:0 25% 0 0;max-width:340px;max-height:none;top:0;background:var(--bg);z-index:40;padding:16px;transform:translateX(-105%);transition:transform .2s;box-shadow:4px 0 20px rgba(0,0,0,.15)}
  body.side aside{transform:none}
  .mtog{display:inline-block}
  .pair{grid-template-columns:1fr;gap:6px}
  #q{width:130px}
  .hide-s{display:none}
  #bar{left:50%!important;transform:translateX(-50%);top:auto!important;bottom:16px}
  .vo td.i{display:none}
  .sync{display:none}
  .top .in{gap:6px;padding:7px 10px}
  .seg button,.btn{padding:5px 8px}
  .tip button{white-space:nowrap}
}
@media print{.top,aside,.reads,#bar,#pop{display:none!important}.wrap{display:block}.card{break-inside:avoid;border:0}}
</style>
</head>
<body data-mode="pair">
<header class="top"><div class="in">
  <button class="btn mtog" id="mside" aria-label="打开目录">目录</button>
  <span class="brand">楠楠阅读班课件<small class="hide-s">七期 · 速成 1–10 · 详解版</small></span>
  <span class="sp"></span>
  <input id="q" type="search" placeholder="搜索原文、翻译、词汇" aria-label="搜索">
  <div class="seg" role="group" aria-label="显示方式">
    <button data-m="pair" class="on">中英并排</button><button data-m="stack" class="hide-s">上下</button><button data-m="en">只看英文</button><button data-m="zh" class="hide-s">只看中文</button>
  </div>
  <button class="btn" id="veil" title="把翻译模糊掉，点一段才显示">遮翻译</button>
  <button class="btn" id="hidev" title="把词汇释义模糊掉，自测用">遮释义</button>
  <div class="seg hide-s" role="group" aria-label="字号"><button id="fsm">A−</button><button id="fsp">A+</button></div>
  <button class="btn pri" id="gonotes">我的批注 <span id="ncount">0</span></button>
  <button class="btn" id="backup">备份</button>
  <span class="sync" id="sync"></span>
</div></header>

<div class="wrap">
  <aside id="side"></aside>
  <main id="main"></main>
</div>

<div id="bar" role="toolbar" aria-label="高亮">
  <button class="sw s1" data-c="1" aria-label="黄色高亮"></button>
  <button class="sw s2" data-c="2" aria-label="绿色高亮"></button>
  <button class="sw s3" data-c="3" aria-label="粉色高亮"></button>
  <button class="sw s4" data-c="4" aria-label="蓝色高亮"></button>
  <button class="tx" data-act="note">批注</button>
</div>
<div id="pop" role="dialog" aria-label="批注">
  <p class="q" id="popq"></p>
  <textarea id="popt" placeholder="写下你的批注（自动保存）"></textarea>
  <div class="row">
    <button class="sw s1" data-c="1" aria-label="黄"></button><button class="sw s2" data-c="2" aria-label="绿"></button><button class="sw s3" data-c="3" aria-label="粉"></button><button class="sw s4" data-c="4" aria-label="蓝"></button>
    <span class="sp"></span>
    <button class="btn" id="popdel">删除高亮</button>
    <button class="btn pri" id="popok">完成</button>
  </div>
</div>
<div class="toast" id="toast"><span id="tmsg"></span><button id="tundo">撤销</button></div>
<div class="modal" id="modal"><div class="box">
  <h3>备份与恢复</h3>
  <p style="margin:0 0 8px;font-size:14px;color:var(--muted)">高亮、批注和“读了几遍”都保存在这个页面里。点“复制备份”把全部记录复制下来，存到备忘录或发给自己；换设备时粘贴到下面，点“导入”。</p>
  <textarea id="mtext" placeholder="把备份粘贴到这里"></textarea>
  <div class="row">
    <button class="btn pri" id="mcopy">复制备份</button>
    <button class="btn" id="mimp">导入</button>
    <span class="sp"></span>
    <button class="btn" id="mreset">清空我的全部记录</button>
    <button class="btn" id="mclose">关闭</button>
  </div>
  <p id="mmsg" style="font-size:13px;color:var(--accent);min-height:1.3em;margin:8px 0 0"></p>

<script id="data" type="application/json">[{"no":1,"header":"第二节","passages":[{"title":"地幔结构之争","en":["Geologists have long known that the Earth's mantle is heterogeneous, but its spatial arrangement remains unresolved—is the mantle essentially layered or irregularly heterogeneous? The best evidence for the layered mantle thesis is the well-established fact that volcanic rocks found on oceanic islands, islands believed to result from mantle plumes arising from the lower mantle, are composed of material fundamentally different from that of the midocean ridge system, whose source, most geologists contend, is the upper mantle.","Some geologists, however, on the basis of observations concerning mantle xenoliths, argue that the mantle is not layered, but that heterogeneity is created by fluids rich in incompatible elements (elements tending toward liquid rather than solid state) percolating upward and transforming portions of the upper mantle irregularly, according to the vagaries of the fluids' pathways. We believe that this debate can be resolved through further study, and that the underexplored midocean ridge system is the key."],"zh":["地质学家长期以来都知道地球的地幔是异质的，但其空间排列方式仍悬而未决——地幔本质上是分层的，还是不规则异质的？对“分层地幔论”最好的证据是一个公认的事实：在海洋岛屿上发现的火山岩（这些岛屿被认为是由源于下地幔的地幔柱形成的）由与大洋中脊系统的物质根本不同的物质构成，而大多数地质学家主张，大洋中脊的来源是上地幔。","然而，一些地质学家基于对地幔捕虏体的观察，认为地幔并非分层结构，而是异质性由富含不相容元素（即倾向于液态而非固态的元素）的流体向上渗透，并根据流体路径的变幻莫测，不规则地转变部分上地幔而形成的。我们相信，通过进一步研究可以解决这场辩论，而尚未被充分探索的大洋中脊系统是关键。"],"st":[{"h":"第一段"},{"t":"并列句 1：Geologists have long known that ...（地质学家一直以来都知道...）"},{"t":"并列句 2：but its spatial arrangement remains unresolved（但其空间排列未解决）"},{"t":"主句：The best evidence ... is the well-established fact that ...（最佳证据是...公认事实）"},{"t":"从句解释 fact：that volcanic rocks ... are composed of material ... different from that of the midocean ridge system（...火山岩由与...不同的物质构成）"},{"t":"同位语：islands believed to result from mantle plumes ...（这些岛屿被认为源于地幔柱...）"},{"t":"从句：whose source ... is the upper mantle（其来源是上地幔）"},{"h":"第二段"},{"t":"主句：Some geolo ation","ipa":"/ˌsepəˈreɪʃn/","m":"n. 分离"},{"w":"frequent","ipa":"/ˈfriːkwənt/","m":"adj. 频繁的"},{"w":"preference","ipa":"/ˈprefrəns/","m":"n. 偏好"},{"w":"revealed","ipa":"/rɪˈviːld/","m":"v. 被揭示（reveal 的过去分词）"},{"w":"plantations","ipa":"/plɑːnˈteɪʃənz/","m":"n. 种植园（复数）"},{"w":"infrequent","ipa":"/ɪnˈfriːkwənt/","m":"adj. 不频繁的"},{"w":"stable","ipa":"/ˈsteɪbl/","m":"adj. 稳定的"},{"w":"monogamy","ipa":"/məˈnɒɡəmi/","m":"n. 一夫一妻制"}]},{"title":"外婚偏好的起源","en":["This preference for exogamy, Gutman suggests, may have derived from West African rules governing marriage, which, though they differed from one tribal group to another, all involved some kind of prohibition against unions with close kin."],"zh":["古特曼提出，这种对外婚的偏好可能源于西非的婚姻规则。这些规则尽管因部落而异，但都包含了某种对近亲联姻的禁止。"],"st":[{"t":"主句：This preference for exogamy ... may have derived from West African rules ...","g":"（这种外婚偏好...可能源于西非的规则）"},{"t":"插入语：Gutman suggests（古特曼提出）"},{"t":"修饰 rules：governing marriage（管辖婚姻的）"},{"t":"从句修饰 rules：which ... all involved some kind of prohibition ...","g":"（这些规则...都包含了某种禁止）"},{"t":"插入的让步从句：though they differed from one tribal group to another","g":"（尽管它们在部落间有所不同）"},{"t":"禁止对象：against unions with close kin（反对与近亲结合）"}],"vo":[{"w":"preference","ipa":"/ˈprefrəns/","m":"n. 偏好"},{"w":"exogamy","ipa":"/ekˈsɒɡəmi/","m":"n. 外婚制（与异族通婚）"},{"w":"suggests","ipa":"/səˈdʒests/","m":"v. 提出，表明（suggest 的三单）"},{"w":"derived","ipa":"/dɪˈraɪvd/","m":"v. 源于（derive 的过去分词）"},{"w":"governing","ipa":"/ˈɡʌvənɪŋ/","m":"v. 管辖，管理（govern 的现在分词）"},{"w":"tribal","ipa":"/ˈtraɪbl/","m":"adj. 部落的"},{"w":"involved","ipa":"/ɪnˈvɒlvd/","m":"v. 包含（involve 的过去分词）"},{"w":"prohibition","ipa":"/ˌprəʊɪˈbɪʃn/","m":"n. 禁止"},{"w":"unions","ipa":"/ˈjuːniənz/","m":"n. 结合，婚姻（复数）"},{"w":"kin","ipa":"/kɪn/","m":"n. 亲属"}]},{"title":"推断消费者需求","en":["Although it has been possible to infer from the goods and services actually produced what manufactures and servicing trades thought their customers wanted, only a study of relevant personal documents written by actual consumers will provide a precise picture of who wanted what."],"zh":["尽管我们有可能从实际生产的商品和提供的服务中，推断出制造商和服务业认为他们的顾客需要什么，但只有对由实际消费者撰写的相关个人文件进行研究，才能精确地揭示出“谁”到底需要“什么”。"],"st":[{"t":"让步从句：Although it has been possible to infer ... what ... trades thought ...","g":"（尽管我们有可能从...推断出...行业的想法）"},{"t":"推断来源：from the goods and services actually produced"},{"t":"推断内容：what manufactures and servicing trades thought their customers wanted（制造商和服务业认为顾客想要什么）"},{"t":"主句：only a study ... will provide a precise picture ...","g":"（只有一项研究...才能提供精确的图景）修饰 study：of relevant personal documents written by actual consumers（对由实际消费者撰写的相关个人文件的研究）"},{"t":"图景内容：of who wanted what（关于“谁想要什么”的）"}],"vo":[{"w":"infer","ipa":"/ɪnˈfɜː(r)/","m":"v. 推断"},{"w":"goods","ipa":"/ɡʊdz/","m":"n. 商品"},{"w":"services","ipa":"/ˈsɜːvɪsɪz/","m":"n. 服务（复数）"},{"w":"actually","ipa":"/ˈæktʃuəli/","m":"adv. 实际地"},{"w":"manufactures","ipa":"/ˌmænjuˈfæktʃəz/","m":"n. 制造业"},{"w":"trades","ipa":"/treɪdz/","m":"n. 行业（复数）"},{"w":"relevant","ipa":"/ˈreləvənt/","m":"adj. 相关的"},{"w":"documents","ipa":"/ˈdɒkjumənts/","m":"n. 文件（复数）"},{"w":"actual","ipa":"/ˈæktʃuəl/","m":"adj. 实际的，真实的"},{"w":"consumers","ipa":"/kənˈsjuːməz/","m":"n. 消费者（复数）"},{"w":"precise","ipa":"/prɪˈsaɪs/","m":"adj. 精确的"}]},{"title":"弗吉尼亚·伍尔夫的创作宣言","en":["“ I want to criticize the social system, and to show it at work, at its most intense. ” Virginia Woolf's provocative statement about her intentions in writing Mrs. Dalloway has regularly been ignored by the critics, since it highlights an aspect of her literary interests very different from the traditional picture of the poetic novelist concerned with examining states of reverie and vision and with following the intricate pathways of individual consciousness."],"zh":["“我想要批判社会制度，并展现它在其最剧烈时的运作。”弗吉尼亚·伍尔夫关于其创作《戴洛维夫人》意图的这番挑衅性声明，经常被评论家所忽视，因为它所凸显的她的文学兴趣的一个方面，与那种传统形象——即一位专注于审视出神与幻想状态、并追寻个人意识复杂路径的诗意小说家——大相径庭。"],"st":[{"t":"主句：Virginia Woolf's provocative statement ... has regularly been ignored by the critics","g":"（弗吉尼亚·伍尔夫的挑衅性声明...常被评论家忽视）"},{"t":"原因从句：since it highlights an aspect ...","g":"（因为它凸显了一个方面...）"},{"t":"修饰 aspect：of her literary interests very different from the traditional picture ...","g":"（她的文学兴趣的一个方面，与...的传统形象非常不同）"},{"t":"修饰 picture：of the poetic novelist concerned with examining ... and with following ...","g":"（那位专注于审视...和追寻...的诗意小说家的形象）"}],"vo":[{"w":"provocative","ipa":"/prəˈvɒkətɪv/","m":"adj. 挑衅的，引起争论的"},{"w":"intentions","ipa":"/ɪnˈtenʃənz/","m":"n. 意图，目的（复数）"},{"w":"ignored","ipa":"/ɪɡˈnɔːd/","m":"v. 被忽视"},{"w":"highlights","ipa":"/ˈhaɪlaɪts/","m":"v. 突出，强调"},{"w":"aspect","ipa":"/ˈæspekt/","m":"n. 方面"},{"w":"literary","ipa":"/ˈlɪtərəri/","m":"adj. 文学的"},{"w":"traditional","ipa":"/trəˈdɪʃənl/","m":"adj. 传统的"},{"w":"reverie","ipa":"/ˈrevəri/","m":"n. 出神，遐想"},{"w":"vision","ipa":"/ˈvɪʒn/","m":"n. 幻象，视觉"},{"w":"intricate","ipa":"/ˈɪntrɪkət/","m":"adj. 复杂的，错综的"},{"w":"pathways","ipa":"/ˈpɑːθweɪz/","m":"n. 路径，道路（复数）"},{"w":"consciousness","ipa":"/ˈkɒnʃəsnəs/","m":"n. 意识"}]},{"title":"基因工程的设想","en":["One such novel idea is that of inserting into the chromosomes of plants discrete genes that are not a part of the plants' natural constitution: specifically, the idea of inserting into nonleguminous plants the genes, if they can be identified and isolated, that fit the leguminous plants to be hosts for nitrogen-fixing bacteria."],"zh":["一个这样的新想法是，将并非植物自然组成部分的独立基因插入植物的染色体中：具体来说，这个想法是，将那些使豆科植物适合成为固氮细菌宿主的基因——如果这些基因能够被识别和分离出来的话——插入到非豆科植物中。"],"st":[{"t":"主句：One such novel idea is that of inserting ... genes ...","g":"（一个这样的新想法是插入...基因的想法）"},{"t":"从句修饰 genes：that are not a part of the plants' natural constitution","g":"（不是植物自然组成部分的基因）"},{"t":"同位语：specifically, the idea of inserting ... the genes ...","g":"（具体来说，这个想法是插入...基因...）"},{"t":"插入语：if they can be identified and isolated","g":"（如果它们能被识别和分离）"},{"t":"从句修饰 genes：that fit the leguminous plants to be hosts ...","g":"（那些使豆科植物成为...宿主的基因）"}],"vo":[{"w":"novel","ipa":"/ˈnɒvl/","m":"adj. 新颖的"},{"w":"inserting","ipa":"/ɪnˈsɜːtɪŋ/","m":"v. 插入"},{"w":"chromosomes","ipa":"/ˈkrəʊməsəʊmz/","m":"n. 染色体（复数）"},{"w":"discrete","ipa":"/dɪˈskriːt/","m":"adj. 独立的，分离的"},{"w":"constitution","ipa":"/ˌkɒnstɪˈtjuːʃn/","m":"n. 构成，组成"},{"w":"specifically","ipa":"/spəˈsɪfɪkli/","m":"adv. 具体来说"},{"w":"nonleguminous","ipa":"/ˌnɒnleɡˈjuːmɪnəs/","m":"adj. 非豆科的"},{"w":"identified","ipa":"/aɪˈdentɪfaɪd/","m":"v. 被识别"},{"w":"isolated","ipa":"/ˈaɪsəleɪtɪd/","m":"v. 被分离"},{"w":"leguminous","ipa":"/leɡˈjuːmɪnəs/","m":"adj. 豆科的"},{"w":"nitrogen-fixing","ipa":"/ˈnaɪtrədʒən fɪksɪŋ/","m":"adj. 固氮的"},{"w":"bacteria","ipa":"/bækˈtɪəriə/","m":"n. 细菌（复数）"}]}]},{"no":2,"header":"第三节","passages":[{"title":"Fallois 的文学推测","en":["Fallois proposed that Proust had tried to begin a novel in 1908, abandoned it for what was to be a long demonstration of Saint-Beuve's blindness to the real nature of great writing, found the essay giving rise to personal memories and fictional developments, and allowed these to take over in a steadily developing novel."],"zh":["Fallois 提出，普鲁斯特曾在 1908 年尝试开始写一部小说，但为了撰写一篇原本打算成为长篇论述的文章而放弃了它，这篇文章旨在揭示圣伯夫对伟大作品本质的视而不见；后来他发现这篇文章引发了个人的回忆和小说情节的发展，并最终让这些内容在一部稳步发展的小说中占据了主导地位。"],"st":[{"t":"主句: Fallois proposed that ..."},{"t":"宾语从句: that Proust had tried ..., abandoned ..., found ..., and allowed ...","g":"（这是一个由 that 引导的宾语从句，作 proposed 的宾语。从句内部有四个并列的谓语动词，由 had"},{"t":"驱动，描述 Proust 的一系列连续动作。）"}],"vo":[{"w":"propose","ipa":"/prəˈpoʊz/","m":"v. 提出"},{"w":"abandon","ipa":"/əˈbændən/","m":"v. 放弃"},{"w":"demonstration","ipa":"/ˌdemənˈstreɪʃn/","m":"n. 论证，展示"},{"w":"blindness","ipa":"/ˈblaɪndnəs/","m":"n. 盲目，视而不见"},{"w":"fictional","ipa":"/ˈfɪkʃənl/","m":"adj. 虚构的"},{"w":"give rise to","ipa":"/ɡɪv raɪz tu/","m":"引起，导致"},{"w":"take over","ipa":"/teɪk ˈoʊvər/","m":"接管，占据主导"}]},{"title":"思绪的纷繁与复杂","en":["The very richness and complexity of the meaningful relationships that kept presenting and rearranging themselves on all levels, from abstract intelligence to profound dreamy feelings, made it difficult for Proust to set them out coherently."],"zh":["正是这些有意义的关联在从抽象理智到深邃梦幻情感的所有层面上不断呈现并重新排列自身的丰富性和复杂性，使得普鲁斯特难以将它们连贯地阐述清楚。"],"st":[{"t":"主句: The very richness and complexity ... made it difficult for Proust to set them out coherently."},{"t":"定语从句: that kept presenting and rearranging themselves on all levels (修饰 relationships)"},{"t":"插入语: from abstract intelligence to profound dreamy feelings (补充说明 all levels)"}],"vo":[{"w":"richness","ipa":"/ˈrɪtʃnəs/","m":"n. 丰富性"},{"w":"complexity","ipa":"/kəmˈpleksəti/","m":"n. 复杂性"},{"w":"present","ipa":"/prɪˈzent/","m":"v. 呈现"},{"w":"rearrange","ipa":"/ˌriːəˈreɪndʒ/","m":"v. 重新排列"},{"w":"profound","ipa":"/prəˈfaʊnd/","m":"adj. 深刻的，深邃的"},{"w":"coherently","ipa":"/koʊˈhɪrəntli/","m":"adv. 连贯地"},{"w":"set out","ipa":"/set aʊt/","m":"阐述，陈述"}]},{"title":"希望与失望","en":["But those of us who hoped, with Kolb, that Kolb's newly published complete edition of Proust's correspondence for 1909 would document the process in greater detail are disappointed."],"zh":["但我们中那些和 Kolb 一样希望 Kolb 新出版的普鲁斯特 1909 年书信全集能更详细地记录这一过程的人，都感到失望。"],"st":[{"t":"主句: But those of us ... are disappointed."},{"t":"定语从句: who hoped, with Kolb, that ... (修饰 those of us)"},{"t":"宾语从句: that Kolb's newly published ... would document the process ... (作 hoped 的宾语)"}],"vo":[{"w":"correspondence","ipa":"/ˌkɔːrəˈspɑːndəns/","m":"n. 通信，书信"},{"w":"document","ipa":"/ˈdɑːkjument/","m":"v. 记录，记载"},{"w":"disappointed","ipa":"/ˌdɪsəˈpɔɪntɪd/","m":"adj. 失望的"},{"w":"those of us who...","ipa":"/ðoʊz ʌv ʌs hu/","m":"我们中那些…的人"}]},{"title":"伊斯兰法","en":["Islamic law is a particularly instructive example of \"sacred law.\" Islamic law is a phenomenon so different from all other forms of law—notwithstanding, of course, a considerable and inevitable number of coincidences with one or the other of them as far as subject matter and positive enactments are concerned—that its study is indispensable in order to appreciate adequately the full range of possible legal phenomena. Even the two other representatives of sacred law that are historically and geographically nearest to it, Jewish law and Roman Catholic canon law, are perceptibly different.","Both Jewish law and canon law are more uniform than Islamic law. Though historically there is a discernible break between Jewish law of the sovereign state of ancient Israel and of the Diaspora (the dispersion of Jewish people after the conquest of Israel), the spirit of the legal matter in later parts of the Old Testament is very close to that of the Talmud, one of the primary codifications of Jewish law in the Diaspora. Islam, on the other hand, represented a radical breakaway from the Arab paganism that preceded it; Islamic law is the result of an examination from a religious angle, of legal subject matter that was far from uniform, comprising as it did the various components of the laws of pre-Islamic Arabia and numerous legal elements taken over from the non-Arab peoples of the conquered territories. All this was unified by being subjected to the same kind of religious scrutiny, the impact of which varied greatly, being almost nonexistent in some fields, and in others originating novel institutions."],"zh":["伊斯兰法是“神圣法”的一个特别具有启发性的例子。伊斯兰法是一种如此不同于所有其他法律形式的现象——当然，尽管在法律主题和具体条文方面，它与其他法律体系存在大量且不可避免的相似之处——以至于对它的研究是不可或缺的，以便充分理解所有可能存在的法律现象的全貌。即使是历史上和地理上最接近它的另外两种神圣法代表——犹太法和罗马天主教教会法，也与它有着明显的不同。","犹太法和教会法都比伊斯兰法更加统一。尽管历史上，古以色列主权国家的犹太法与（以色列被征服后）大流散时期的犹太法之间存在明显的断裂，但《旧约全书》后期篇章中法律内容的精神，与《塔木德》——大流散时期犹太法的主要法典之一——的精神是非常接近的。另一方面，伊斯兰教代表着与先前阿拉伯异教信仰的彻底决裂；伊斯兰法是从宗教角度对远非统一的法律素材进行审视的结果，这些素材包含了伊斯兰教兴起前阿拉伯的各种法律成分，以及从被征服领土上的非阿拉伯民族那里吸收来的大量法律元素。所有这一切通过被置于同一种宗教审查之下而统一起来，而这种审查的影响程度差异很大，在某些领域几乎不存在，而在另一些领域则催生了全新的制度。"],"st":[{"t":"主干: Islamic law is a phenomenon so different from all other forms of law ... that its study is indispensable ..."},{"t":"修饰成分:"},{"t":"—notwithstanding, of course, a considerable and inevitable number of coincidences with one or the other of them as far as subject matter and positive enactments are concerned— (插入语，作让步状语)"},{"t":"in order to appreciate adequately the full range of possible legal phenomena (目的状语)"},{"t":"主干: Even the two other representatives of sacred law ... are perceptibly different."},{"t":"修饰成分:"},{"t":"that are historically and geographically nearest to it (定语从句，修饰 representatives)"},{"t":"Jewish law and Roman Catholic canon law (同位语，解释 representatives)"},{"t":"主干: the spirit of the legal matter ... is very close to that of the Talmud ..."},{"t":"修饰成分:"},{"t":"Though historically there is a discernible break between Jewish law of the sovereign state of ancient Israel and of the Diaspora ... (让步状语从句)"},{"t":"in later parts of the Old Testament (地点状语)"},{"t":"one of the primary codifications of Jewish law in the Diaspora (同位语，解释 the Talmud)"},{"t":"主干: Islam ... represented a radical breakaway from the Arab paganism ...; Islamic law is the result of an examination ..."},{"t":"修饰成分:"},{"t":"on the other hand (转折副词短语)"},{"t":"that preceded it (定语从句修饰 paganism)"},{"t":"from a religious angle (介词短语作状语)"},{"t":"of legal subject matter that was far from uniform (介词短语修饰 examination，其中 that 引导定语从句修饰 matter)"},{"t":"comprising as it did the various components ... and numerous legal elements ... (现在分词短语作状语，表伴随，其中 as it did 是插入语表强调，taken over from...是过去分词短语作后置定语修饰 elements)"},{"t":"主干: All this was unified by being subjected to the same kind of religious scrutiny"},{"t":"修饰成分:"},{"t":"the impact of which varied greatly, (非限制性定语从句修饰 scrutiny)"},{"t":"being almost nonexistent in some fields, and in others originating novel institutions (现在分词短语作状语，补充说明 impact)"}],"vo":[{"w":"instructive :","ipa":"/ɪnˈstrʌktɪv/","m":"adj.有启发性的，有教育意义的"},{"w":"sacred law :","ipa":"/ˈseɪkrɪd lɔː/","m":"n.神圣法"},{"w":"so...that... :","ipa":"/ˈsəʊ ðæt/","m":"conj.如此……以至于……"},{"w":"notwithstanding :","ipa":"/ˌnɒtwɪθˈstændɪŋ/","m":"prep.尽管"},{"w":"a considerable number of :","ipa":"/ə kənˈsɪdərəbəl ˈnʌmbər ɒv/","m":"adj.大量的"},{"w":"coincidences :","ipa":"/kəʊˈɪnsɪdənsɪz/","m":"n.巧合，一致之处"},{"w":"as far as...are concerned :","ipa":"/əz fɑːr əz ɑː kənˈsɜːnd/","m":"conj.就……而言"},{"w":"subject matter :","ipa":"/ˈsʌbdʒɪkt ˈmætə(r)/","m":"n.主题，内容"},{"w":"positive enactments :","ipa":"/ˈpɒzətɪv ɪˈnæktmənts/","m":"n.具体的法律条文，成文法"},{"w":"indispensable :","ipa":"/ˌɪndɪˈspensəb(ə)l/","m":"adj.不可或缺的，必不可少的"},{"w":"appreciate :","ipa":"/əˈpriːʃieɪt/","m":"v.理解，领会"},{"w":"the full range of :","ipa":"/ðə fʊl reɪndʒ ɒv/","m":"...的全范围"},{"w":"phenomena :","ipa":"/fəˈnɒmɪnə/","m":"n.(phenomenon 的复数)现象"},{"w":"representatives :","ipa":"/ˌreprɪˈzentətɪvz/","m":"n.代表"},{"w":"canon law :","ipa":"/ˈkænən lɔː/","m":"n.教会法"},{"w":"perceptibly :","ipa":"/pəˈseptəbli/","m":"adv.可察觉地，明显地"},{"w":"uniform :","ipa":"/ˈjuːnɪfɔːm/","m":"adj.统一的，一致的"},{"w":"discernible :","ipa":"/dɪˈsɜːnəb(ə)l/","m":"adj.可辨别的，可察觉的"},{"w":"break :","ipa":"/breɪk/","m":"n.断裂，中断"},{"w":"the Diaspora :","ipa":"/ðə daɪˈæspərə/","m":"n.(特指犹太人的)大流散"},{"w":"the Old Testament :","ipa":"/ði əʊld ˈtestəmənt/","m":"n.《旧约全书》"},{"w":"the Talmud :","ipa":"/ðə ˈtælmʊd/","m":"n.《塔木德》"},{"w":"spirit :","ipa":"/ˈspɪrɪt/","m":"n.精神，精髓"},{"w":"codifications :","ipa":"/ˌkəʊdɪfɪˈkeɪʃ(ə)nz/","m":"n.法典编纂，法律汇编"},{"w":"on the other hand :","ipa":"/ɒn ði ˈʌðə hænd/","m":"adv.另一方面"},{"w":"radical :","ipa":"/ˈrædɪk(ə)l/","m":"adj.彻底的，根本的"},{"w":"breakaway :","ipa":"/ˈbreɪkəweɪ/","m":"n.脱离，决裂"},{"w":"paganism :","ipa":"/ˈpeɪɡənɪzəm/","m":"n.异教信仰"},{"w":"precede :","ipa":"/prɪˈsiːd/","m":"v.在……之前，先于"},{"w":"from a religious angle :","ipa":"/frɒm ə rɪˈlɪdʒəs ˈæŋɡ(ə)l/","m":"prep.从宗教角度"},{"w":"legal subject matter :","ipa":"/ˈliːɡ(ə)l ˈsʌbdʒɪkt ˈmætə(r)/","m":"n.法律主题事物"},{"w":"far from uniform :","ipa":"/fɑː frɒm ˈjuːnɪfɔːm/","m":"adj.远非统一"},{"w":"comprising :","ipa":"/kəmˈpraɪzɪŋ/","m":"v.包含，由……组成"},{"w":"as it did :","ipa":"/əz ɪt dɪd/","m":"(插入语)正如它确实那样，表强调"},{"w":"components :","ipa":"/kəmˈpəʊnənts/","m":"n.组成部分，成分"},{"w":"taken over from :","ipa":"/ˈteɪkən ˈəʊvə frɒm/","m":"v.从……吸收/借鉴而来"},{"w":"conquered territories :","ipa":"/ˈkɒŋkəd ˈterətrɪz/","m":"n.被征服的领土"},{"w":"be subjected to :","ipa":"/bi səbˈdʒektɪd tu/","m":"v.经受，遭受"},{"w":"scrutiny :","ipa":"/ˈskruːtəni/","m":"n.仔细的审查，监督"},{"w":"the impact of which :","ipa":"/ði ˈɪmpækt ɒv wɪtʃ/","m":"它的影响（which 指代 scrutiny）"},{"w":"vary greatly :","ipa":"/ˈveəri ˈɡreɪtli/","m":"v.差别很大，大相径庭"},{"w":"nonexistent :","ipa":"/ˌnɒnɪɡˈzɪstənt/","m":"adj.不存在的"},{"w":"originate :","ipa":"/əˈrɪdʒɪneɪt/","m":"v.创始，开创"},{"w":"novel :","ipa":"/ˈnɒv(ə)l/","m":"adj.新颖的，新的"},{"w":"institutions :","ipa":"/ˌɪnstɪˈtjuːʃ(ə)nz/","m":"n.制度，体系"}]},{"title":"波伏娃的激进观点","en":["Open acknowledgement of the existence of women's oppression was too radical for the United States in the fifties, and Beauvoir's conclusion, that change in women's economic condition, though insufficient by itself, \"remains the basic factor\" in improving women's situation, was particularly unacceptable."],"zh":["公开承认女性压迫的存在对 50 年代的美国来说太过激进，而波伏娃的结论——即女性经济状况的改变虽然本身不足，但“仍然是改善女性处境的基本因素”——尤其不可接受。"],"st":[{"t":"主句 1: Open acknowledgement ... was too radical for the United States ..."},{"t":"主句 2: and Beauvoir's conclusion ... was particularly unacceptable."},{"t":"同位语从句: that change in women's economic condition ... \"remains the basic factor\" ... (作 conclusion 的同位语，解释结论内容)"},{"t":"插入语: though insufficient by itself (在同位语从句中作让步状语)"}],"vo":[{"w":"acknowledgement","ipa":"/əkˈnɑːlɪdʒmənt/","m":"n. 承认"},{"w":"oppression","ipa":"/əˈpreʃn/","m":"n. 压迫"},{"w":"radical","ipa":"/ˈrædɪkl/","m":"adj. 激进的"},{"w":"conclusion","ipa":"/kənˈkluːʒn/","m":"n. 结论"},{"w":"insufficient","ipa":"/ˌɪnsəˈfɪʃnt/","m":"adj. 不足的"},{"w":"unacceptable","ipa":"/ˌʌnəkˈseptəbl/","m":"adj. 不可接受的"},{"w":"too ... for ...","ipa":"/tu ... fɔːr .../","m":"对…来说太…"}]},{"title":"已婚女性就业增长的动因","en":["The increase in the numbers of married women employed outside the home in the twentieth century had less to do with the mechanization of housework and an increase in leisure time for these women than it did with their own economic necessity and with high marriage rates that shrank the available pool of single women workers, previously, in many cases, the only women employers would hire."],"zh":["20 世纪外出就业的已婚女性数量的增加，与其说与家务机械化和女性闲暇时间增加有关，不如说与她们自身的经济需求以及高结婚率有关，而高结婚率减少了可用的单身女性劳动力资源——在此之前，单身女性往往是雇主唯一愿意雇佣的女性。"],"st":[{"t":"主句: The increase ... had less to do with A than it did with B and with C."},{"t":"定语从句 1: that shrank the available pool ... (修饰 high marriage rates)"},{"t":"同位语 : previously, in many cases, the only women employers would hire ( 补充说明 single women workers)"}],"vo":[{"w":"mechanization","ipa":"/ˌmekənaɪˈzeɪʃn/","m":"n.机械化"},{"w":"leisure","ipa":"/ˈliːʒər/","m":"n.闲暇"},{"w":"necessity","ipa":"/nəˈsesəti/","m":"n.必要性，必需品"},{"w":"shrink","ipa":"/ʃrɪŋk/","m":"v.(使)缩小"},{"w":"available","ipa":"/əˈveɪləbl/","m":"adj.可用的"},{"w":"pool","ipa":"/puːl/","m":"n.（人才）库，储备"},{"w":"previously","ipa":"/ˈpriːviəsli/","m":"adv.先前地"},{"w":"employer","ipa":"/ɪmˈplɔɪər/","m":"n.雇主"},{"w":"hire","ipa":"/ˈhaɪər/","m":"v.雇佣"},{"w":"have less to do with A than with B","ipa":"/hæv les tu duːwɪðeɪðæn wɪðbi/","m":"与其说与 A 有关，不如说与 B 有关"}]},{"title":"生态学中的“信号”与“噪声”","en":["In order to understand the nature of the ecologist's investigation, we may think of the density-dependent effects on growth parameters as the \"signal\" ecologists are trying to isolate and interpret, one that tends to make the population increase from relatively low values or decrease from relatively high ones, while the density-independent effects act to produce \"noise\" in the population dynamics."],"zh":["为了理解生态学家研究的本质，我们可以把对生长参数具有密度依赖性的效应看作生态学家试图分离和解读的“信号”，这种信号倾向于使种群从较低值上升或从较高值下降，而密度无关效应则在种群动态中产生“噪声”。"],"st":[{"t":"主句: we may think of the density-dependent effects ... as the \"signal\" ..."},{"t":"目的状语: In order to understand the nature of the ecologist's investigation"},{"t":"定语从句: ecologists are trying to isolate and interpret (修饰 \"signal\"，省略了关系代词 that/which)"},{"t":"同位语: one that tends to ... (指代前面的 \"signal\"，并对其进行补充说明)"},{"t":"状语从句: while the density-independent effects act to ... (表示对比)"}],"vo":[{"w":"ecologist","ipa":"/iˈkɑːlədʒɪst/","m":"n.生态学家"},{"w":"investigation","ipa":"/ɪnˌvestɪˈɡeɪʃn/","m":"n.调查，研究"},{"w":"density-dependent","ipa":"/ˈdensəti dɪˈpendənt/","m":"adj.密度依赖的"},{"w":"parameter","ipa":"/pəˈræmɪtər/","m":"n.参数"},{"w":"signal","ipa":"/ˈsɪɡnəl/","m":"n.信号"},{"w":"isolate","ipa":"/ˈaɪsəleɪt/","m":"v.分离，隔离"},{"w":"interpret","ipa":"/ɪnˈtɜːrprət/","m":"v.解读，阐释"},{"w":"tend","ipa":"/tend/","m":"v.倾向于"},{"w":"relatively","ipa":"/ˈrelətɪvli/","m":"adv.相对地"},{"w":"density-independent","ipa":"/ˈdensətiˌɪndɪˈpendənt/","m":"adj.密度无关的"},{"w":"dynamics","ipa":"/daɪˈnæmɪks/","m":"n.动态"},{"w":"think of A as B","ipa":"/θɪŋkʌv eɪæz bi/","m":"将 A 视作 B"}]},{"title":"物理学家对论证的忧虑","en":["The physicist rightly dreads precise argument, since an argument that is convincing only if it is precise loses all its force if the assumptions on which it is based are slightly changed, whereas an argument that is convincing though imprecise may well be stable under small perturbations of its underlying assumptions."],"zh":["物理学家有充分理由害怕精确的论证，因为一个只有在精确时才令人信服的论证，一旦其所基于的假设发生微小变化，就会失去所有说服力；而一个尽管不精确却仍令人信服的论证，在其底层假设发生微小扰动时很可能保持稳定。"],"st":[{"t":"主句: The physicist rightly dreads precise argument"},{"t":"原因状语从句: since an argument ... loses all its force ..., whereas an argument ... may well be stable ..."},{"t":"(这是一个由 since 引导的、内部含有 whereas 表示对比的并列句，共同说明原因。)"}],"vo":[{"w":"physicist","ipa":"/ˈfɪzɪsɪst/","m":"n.物理学家"},{"w":"rightly","ipa":"/ˈraɪtli/","m":"adv.有理由地，正确地"},{"w":"dread","ipa":"/dred/","m":"v.害怕，担忧"},{"w":"precise","ipa":"/prɪˈsaɪs/","m":"adj.精确的"},{"w":"argument","ipa":"/ˈɑːrɡjumənt/","m":"n.论证"},{"w":"convincing","ipa":"/kənˈvɪnsɪŋ/","m":"adj.有说服力的"},{"w":"assumption","ipa":"/əˈsʌmpʃn/","m":"n.假设"},{"w":"slightly","ipa":"/ˈslaɪtli/","m":"adv.轻微地"},{"w":"imprecise","ipa":"/ˌɪmprɪˈsaɪs/","m":"adj.不精确的"},{"w":"stable","ipa":"/ˈsteɪbl/","m":"adj.稳定的"},{"w":"perturbation","ipa":"/ˌpɜːrtərˈbeɪʃn/","m":"n.扰动"},{"w":"underlying","ipa":"/ˌʌndərˈlaɪɪŋ/","m":"adj.潜在的，根本的"},{"w":"only if","ipa":"/ˈoʊnliɪf/","m":"只有当…才"},{"w":"may well","ipa":"/meɪwel/","m":"很可能"}]}]},{"no":3,"header":"第四节","passages":[{"title":"哈代的“渣男式”创作论","en":["In his novels these various impulses were sacrificed to each other inevitably and often. Inevitably, because Hardy did not care in the way that novelists such as Flaubert or James cared, and therefore took paths of least resistance. Thus, one impulse often surrendered to a fresher one and, unfortunately, instead of exacting a compromise, simply disappeared. A desire to throw over reality a light that never was might give way abruptly to the desire on the part of what we might consider a novelist-scientist to record exactly and concretely the structure and texture of a flower."],"zh":["在他的小说中，这些不同的创作冲动不可避免地且经常地彼此牺牲。之所以不可避免，是因为哈代并不像福楼拜或詹姆斯那样在乎（艺术的精雕细琢），因此他选择了一条阻力最小的道路。于是，一种冲动常常会屈从于一种更新的冲动，并且不幸的是，它不是达成一种妥协，而是直接消失了。一种想要用一束从未存在过的光去照亮现实的欲望，可能会突然让位于另一种欲望，即我们可以称之为“小说家-科学家”的那种人，想要精确而具体地记录一朵花的结构与纹理的欲望。"],"st":[{"t":"主干: A desire ... might give way abruptly to the desire ..."},{"t":"修饰成分:"},{"t":"to throw over reality a light that never was (不定式作后置定语，修饰第一个 desire，其中 that never was 为定语从句修饰 light)"},{"t":"on the part of what we might consider a novelist-scientist (介词短语作后置定语，修饰第二个 desire，其中 what 引导宾语从句)"},{"t":"to record exactly and concretely the structure and texture of a flower ( 不定式作后置定语，解释 a novelist-scientist 的欲望内容)"}],"vo":[{"w":"impulses","ipa":"","m":"n.冲动；推动力；此处指“创作冲动”"},{"w":"be sacrificed to","ipa":"","m":"被牺牲给……"},{"w":"paths of least resistance","ipa":"","m":"阻力最小的道路；比喻最省事、最不费力的方法"},{"w":"surrender to","ipa":"","m":"v.屈服于，屈从于"},{"w":"fresher","ipa":"","m":"adj.(fresh 的比较级)较新的，较新鲜的"},{"w":"exact","ipa":"","m":"v.强求，要求"},{"w":"compromise","ipa":"","m":"n.妥协，折中方案"},{"w":"give way to","ipa":"","m":"让位于，屈服于"},{"w":"on the part of","ipa":"","m":"来自于……的，由……所发出的"},{"w":"throw over...a light","ipa":"","m":"向……投射一束光；比喻用一种独特的视角去阐释现实"},{"w":"texture","ipa":"","m":"n.纹理，质地"}]},{"title":"风媒传粉的生存策略","en":["Traditionally, pollination by wind has been viewed as a reproductive process marked by random events in which the vagaries of the wind are compensated for by the generation of vast quantities of pollen, so that the ultimate production of new seeds is assured at the expense of producing much more pollen than is actually used. Because the potential hazards pollen grains are subject to as they are transported over long distances are enormous, wind pollinated plants have, in the view above, compensated for the ensuing loss of pollen through happenstance by virtue of producing an amount of pollen that is one to three orders of magnitude greater than the amount produced by species pollinated by insects."],"zh":["传统上，风媒传粉被视为一种以随机事件为特征的繁殖过程，在这些事件中，风的反复无常通过产生大量花粉来补偿，从而确保新种子的最终产出，代价是产生的花粉远多于实际使用量。由于花粉颗粒在长距离传播过程中面临的潜在风险巨大，因此按照上述观点，风媒植物通过产生比虫媒植物多 1 到 3个数量级的花粉量，来弥补因偶然事件造成的花粉损失。"],"st":[{"h":"第一句"},{"t":"主句: pollination by wind has been viewed as a reproductive process"},{"t":"过去分词作定语: marked by random events (修饰 process)"},{"t":"定语从句: in which the vagaries of the wind are compensated for ... (修饰 random events)"},{"t":"结果状语从句: so that the ultimate production of new seeds is assured ..."},{"h":"第二句"},{"t":"主句: wind pollinated plants have compensated for the ensuing loss of pollen"},{"t":"原因状语从句: Because the potential hazards ... are enormous"},{"t":"(在该从句中， pollen grains are subject to 是修饰 hazards 的定语从句，省略了 that；as they are transported...是时间状语从句。)"},{"t":"方式状语: by virtue of producing an amount of pollen ..."}],"vo":[{"w":"traditionally","ipa":"/trəˈdɪʃənəli/","m":"adv.传统上"},{"w":"pollination","ipa":"/ˌpɑːlɪˈneɪʃn/","m":"n.授粉"},{"w":"view","ipa":"/vjuː/","m":"v.视作"},{"w":"reproductive","ipa":"/ˌriːprəˈdʌktɪv/","m":"adj.繁殖的"},{"w":"random","ipa":"/ˈrændəm/","m":"adj.随机的"},{"w":"vagary","ipa":"/ˈveɪɡəri/","m":"n.变幻莫测"},{"w":"compensate","ipa":"/ˈkɑːmpenseɪt/","m":"v.补偿"},{"w":"generation","ipa":"/ˌdʒenəˈreɪʃn/","m":"n.产生"},{"w":"vast","ipa":"/væst/","m":"adj.巨大的"},{"w":"quantity","ipa":"/ˈkwɑːntəti/","m":"n.数量"},{"w":"pollen","ipa":"/ˈpɑːlən/","m":"n.花粉"},{"w":"ultimate","ipa":"/ˈʌltɪmət/","m":"adj.最终的"},{"w":"assure","ipa":"/əˈʃʊr/","m":"v.保证"},{"w":"expense","ipa":"/ɪkˈspens/","m":"n.代价"},{"w":"be viewed as","ipa":"/bi vjuːdæz/","m":"被视为"},{"w":"marked by","ipa":"/mɑːrkt baɪ/","m":"以…为特征"},{"w":"compensate for","ipa":"/ˈkɑːmpenseɪt fɔːr/","m":"补偿"},{"w":"at the expense of","ipa":"/ætðiɪkˈspensʌv/","m":"以…为代价"},{"w":"orders of magnitude","ipa":"","m":"数量级"},{"w":"potential","ipa":"/pəˈtenʃl/","m":"adj. 潜在的"},{"w":"hazard","ipa":"/ˈhæzərd/","m":"n. 风险"},{"w":"grain","ipa":"/ɡreɪn/","m":"n. 颗粒"},{"w":"subject","ipa":"/səbˈdʒekt/","m":"adj. 易遭受…的"},{"w":"transport","ipa":"/trænˈspɔːrt/","m":"v. 运输"},{"w":"enormous","ipa":"/ɪˈnɔːrməs/","m":"adj. 巨大的"},{"w":"ensuing","ipa":"/ɪnˈsuːɪŋ/","m":"adj. 随之而来的"},{"w":"happenstance","ipa":"/ˈhæpənstæns/","m":"n. 偶然事件"},{"w":"virtue","ipa":"/ˈvɜːrtʃuː/","m":"n. 优点，美德"},{"w":"magnitude","ipa":"/ˈmæɡnɪtuːd/","m":"n. 大小，量级"},{"w":"species","ipa":"/ˈspiːʃiːz/","m":"n. 物种"},{"w":"insect","ipa":"/ˈɪnsekt/","m":"n. 昆虫"},{"w":"be subject to","ipa":"/bi ˈsʌbdʒekt tu/","m":"经受，面临"},{"w":"by virtue of","ipa":"/baɪ ˈvɜːrtʃuː ʌv/","m":"凭借，由于"}]},{"title":"学术争论背后的“权力斗争”","en":["These questions are political in the sense that the debate over them will inevitably be less an exploration of abstract matters in a spirit of disinterested inquiry than an academic power struggle in which the careers and professional fortunes of many women scholars — only now entering the academic profession in substantial numbers—will be at stake, and with them the chances for a distinctive contribution to humanistic understanding, a contribution that might be an important influence against sexism in our society."],"zh":["这些问题在这个意义上是有政治意味的，那就是关于这些问题的争论将不可避免地与其说是一种本着无私探索精神对抽象问题的探讨，不如说是一场学术权力斗争。在这场斗争中，许多女性学者——她们只是现在才开始大量进入学术界——的职业生涯与专业命运将岌岌可危，与之共存亡的，是为人文理解做出独特贡献的机会；而这种贡献，很可能成为对抗我们社会中性别歧视的一股重要力量。"],"st":[{"t":"主干:These questions are political in the sense that..."},{"t":"修饰成分:"},{"t":"that the debate over them will inevitably be less an exploration...than an academic power struggle...(同位语从句，解释 sense)"},{"t":"在同位语从句中，主干是:the debate...will be less an exploration...than an academic power struggle"},{"t":"修饰成分:"},{"t":"of abstract matters(介词短语修饰 exploration)"},{"t":"in a spirit of disinterested inquiry(介词短语修饰 exploration)"},{"t":"in which the careers and professional fortunes...will be at stake(定语从句修饰 struggle)"},{"t":"—only now entering the academic profession in substantial numbers—(插入语，修饰 women scholars)"},{"t":"and with them the chances for a distinctive contribution to humanistic understanding(并列的省略结构，相当于 and with them[will be at stake]the chances...)"},{"t":"a contribution that might be an important influence against sexism in our society( 同位语，解释contribution，其中 that 引导定语从句)"}],"vo":[{"w":"in the sense that","ipa":"","m":"在……的意义上"},{"w":"debate over","ipa":"","m":"关于……的争论"},{"w":"less A than B","ipa":"","m":"与其说是 A，不如说是 B"},{"w":"disinterested","ipa":"","m":"adj.公正的，无私的，不偏不倚的"},{"w":"inquiry","ipa":"","m":"n.探究，探索"},{"w":"academic power struggle","ipa":"","m":"学术权力斗争"},{"w":"careers and professional fortunes","ipa":"","m":"职业生涯和专业命运"},{"w":"at stake","ipa":"","m":"处于危险中，岌岌可危"},{"w":"in substantial numbers","ipa":"","m":"大量地"},{"w":"and with them","ipa":"","m":"（随之而来的）连带关系"},{"w":"a distinctive contribution to","ipa":"","m":"对……的独特贡献"},{"w":"humanistic understanding","ipa":"","m":"人文理解"},{"w":"sexism","ipa":"","m":"n.性别歧视"}]},{"title":"关于“种族偏见”定义的讨论","en":["His thesis works relatively well when applied to discrimination against Blacks in the United States, but his definition of racial prejudice as “racially-based negative prejudgments against a group generally accepted as a race in any given region of ethnic competition, ” can be interpreted as also including hostility toward such ethnic groups as the Chinese in California and the Jews in medieval Europe."],"zh":["他的论点在应用于针对美国黑人的歧视时相对有效，但他将种族偏见定义为“在任一特定种族竞争地区中，针对被普遍认作一个种族的群体，基于种族的负面预判”，这一定义可被解读为也包括针对诸如加利福尼亚的华人或中世纪欧洲的犹太人等族裔群体的敌意。"],"st":[{"t":"主句为并列句：“ His thesis works relatively well... but his definition... can be interpreted as also including hostility...”。"},{"t":"“when applied to...”为省略时间状语从句；“as‘racially-based...’”为介词短语作宾语补足语；“toward such ethnic groups as...”为后置定语修饰“hostility”。"}],"vo":[{"w":"thesis","ipa":"/ˈθiːsɪs/","m":"n. 论点；论文"},{"w":"discrimination","ipa":"/dɪˌskrɪmɪˈneɪʃn/","m":"n. 歧视"},{"w":"prejudice","ipa":"/ˈpredʒudɪs/","m":"n. 偏见"},{"w":"prejudgments","ipa":"/ˌpriːˈdʒʌdʒmənts/","m":"n. 预判；事先判断"},{"w":"ethnic competition","ipa":"/ˈeθnɪk ˌkɒmpəˈtɪʃn/","m":"n. 种族竞争"},{"w":"hostility","ipa":"/hɒˈstɪləti/","m":"n. 敌意"},{"w":"medieval","ipa":"/ˌmediˈiːvl/","m":"adj. 中世纪的"}]},{"title":"历史研究重点之转变","en":["In the early 1950's, historians who studied preindustrial Europe (which we may define here as Europe in the period from roughly 1300 to 1800) began, for the first time in large numbers, to investigate more of the preindustrial European population than the 2 or 3 percent who comprised the political and social elite: the kings, generals, judges, nobles, bishops, and local magnates who had hitherto usually filled history books."],"zh":["20 世纪 50 年代初，研究前工业化欧洲（此处我们可将其大致定义为 1300 年至 1800 年期间的欧洲）的历史学家首次开始大规模地调查前工业化欧洲人口当中占比更多的部分，而不是那 2%到 3%由政治和社会精英构成的群体：即迄今为止通常充斥历史书籍的国王、将军、法官、贵族、主教和地方权贵。"],"st":[{"t":"主句为“historians began to investigate more... than the 2 or 3 percent...”。"},{"t":"“who studied preindustrial Europe”为定语从句修饰“historians”；括号内为插入性定语从句修饰“preindustrial Europe”；","g":"“who comprised the political and social elite”为定语从句修饰“the 2 or 3 percent”；"},{"t":"冒号后为同位语列举精英成分；“who had hitherto usually filled history books”为定语从句修饰前述精英群体。"}],"vo":[{"w":"preindustrial","ipa":"/ˌpriːɪnˈdʌstriəl/","m":"adj. 前工业化的"},{"w":"comprised","ipa":"/kəmˈpraɪzd/","m":"v. 构成；包含"},{"w":"elite","ipa":"/eɪˈliːt/","m":"n. 精英"},{"w":"bishops","ipa":"/ˈbɪʃəps/","m":"n. 主教"},{"w":"magnates","ipa":"/ˈmæɡneɪts/","m":"n. 权贵；巨头"},{"w":"hitherto","ipa":"/ˌhɪðəˈtuː/","m":"adv. 迄今；至今"}]},{"title":"哲学基本问题的重要性","en":["Such philosophical concerns as the mind-body problem or, more generally, the nature of human knowledge, are basic human questions whose tentative philosophical solutions have served as the necessary foundations on which all other intellectual speculation has rested."],"zh":["诸如身心问题或更广义的人类知识本质之类的哲学关切，都是人类的基本问题；其尝试性的哲学解决方案，一直是所有其他智力思索所依赖的必要基础。"],"st":[{"t":"主句为“Such philosophical concerns are basic human questions”。"},{"t":"“as the mind-body problem or... the nature of human knowledge”为举例说明；","g":"“whose”引导定语从句"},{"t":"修饰“questions”；“on which”引导定语从句修饰“foundations”。"}],"vo":[{"w":"philosophical","ipa":"/ˌfɪləˈsɒfɪkl/","m":"adj. 哲学的"},{"w":"mind-body problem","ipa":"/maɪnd ˈbɒdi ˈprɒbləm/","m":"n. 身心问题"},{"w":"tentative","ipa":"/ˈtentətɪv/","m":"adj. 尝试性的；暂定的"},{"w":"foundations","ipa":"/faʊnˈdeɪʃnz/","m":"n. 基础"},{"w":"intellectual speculation","ipa":"/ˌɪntəˈlektʃuəl ˌspekjʊˈleɪʃn/","m":"n. 智力思索；思辨"}]},{"title":"“边疆关闭”引爆农民不满","en":["The historian Frederick J. Turner wrote in the 1890's that the agrarian discontent that had been developing steadily in the United States since about 1870 had been precipitated by the closing of the internal frontier—that is, the depletion of available new land needed for further expansion of the American farming system."],"zh":["历史学家弗雷德里克·J·特纳在 19 世纪 90 年代写道：大约自 1870 年以来在美国持续酝酿的农民不满情绪，其最终的爆发是由内部边疆的关闭所导致的——所谓内部边疆的关闭，即是指美国农业体系进一步发展所必需的可开垦新土地已被消耗殆尽。"],"st":[{"t":"主干: The historian Frederick J. Turner wrote ... that ..."},{"t":"修饰成分:"},{"t":"in the 1890's (时间状语)"},{"t":"that the agrarian discontent ... had been precipitated by ... (宾语从句)"},{"t":"在宾语从句中，主干是: the agrarian discontent ... had been precipitated by the closing of the internal frontier"},{"t":"修饰成分:"},{"t":"that had been developing steadily in the United States since about 1870 (定语从句，修饰 discontent)"},{"t":"—that is, the depletion of available new land needed for further expansion of the American farming system (同位语，解释 the closing of the internal frontier，其中 needed for...是过去分词短语作后置定语修饰 land)"}],"vo":[{"w":"agrarian","ipa":"","m":"adj. 农业的，耕地的"},{"w":"discontent","ipa":"","m":"n. 不满"},{"w":"had been developing steadily","ipa":"","m":"过去完成进行时，表示“一直在持续发展”"},{"w":"precipitate","ipa":"","m":"v. 促使……突然发生，加速……的到来；此处意为“引发，导致”"},{"w":"the closing of the internal frontier","ipa":"","m":"内部边疆的关闭"},{"w":"depletion","ipa":"","m":"n. 耗尽，枯竭"},{"w":"that is","ipa":"","m":"即，也就是说"}]},{"title":"“漏网之鱼”导致的认知偏差","en":["Perhaps the fact that many of these first studies considered only algae of a size that could be collected in a net (net phytoplankton), a practice that over-looked the smaller phytoplankton (nannoplankton) that we now know grazers are most likely to feed on, led to a de-emphasis of the role of grazers in subsequent research."],"zh":["或许，正是因为许多早期研究只考虑了那些能用网采集的藻类（即“网采浮游植物”），而忽略了更小的浮游植物（即“纳米浮游植物”）——我们现在知道，后者恰恰是食草动物最可能摄取的食物——这种做法才导致了在后续研究中，食草动物的作用未能得到足够的重视。"],"st":[{"t":"主干: Perhaps the fact ... led to a de-emphasis of the role of grazers in subsequent research."},{"t":"修饰成分:"},{"t":"that many of these first studies considered only algae of a size that could be collected in a net (net phytoplankton) (同位语从句，解释 fact 的内容，其中 that could be collected in a net 是定语从句修饰 size)"},{"t":"a practice that over-looked the smaller phytoplankton (nannoplankton) that we now know grazers are most likely to feed on (同位语，解释前面的整件事，其中 that over-looked...是定语从句修饰 practice，而 that we now know...又是定语从句修饰 phytoplankton)"}],"vo":[{"w":"algae","ipa":"","m":"n. 藻类"},{"w":"phytoplankton","ipa":"","m":"n. 浮游植物"},{"w":"over-look","ipa":"","m":"v. 忽略，忽视"},{"w":"grazers","ipa":"","m":"n. 食草动物；此处指以浮游植物为生的浮游动物"},{"w":"are most likely to feed on","ipa":"","m":"最有可能以此为食"},{"w":"de-emphasis","ipa":"","m":"n. 不再重视，降低重要性"},{"w":"subsequent","ipa":"","m":"adj. 随后的，后来的"}]},{"title":"儿童价值的重塑","en":["During the nineteenth century, she argues, the concept of the “ useful ” child who contributed to the family economy gave way gradually to the present-day notion of the “useless” child who, though producing no income for, and indeed extremely costly to, its parents, is yet considered emotionally “priceless.”"],"zh":["她认为，在整个十九世纪，那种为家庭经济做贡献的“有用”儿童的概念，逐渐让位于当今的“无用”儿童的概念。这种“无用”儿童，尽管不为父母创造任何收入，而且事实上对父母来说极其昂贵，但在情感上却被认为是“无价的”。"],"st":[{"t":"主干: the concept gave way to the notion."},{"t":"结构分析:"},{"t":"During the nineteenth century 是时间状语。"},{"t":"she argues 是插入语。"},{"t":"of the \"useful\" child 是介词短语作后置定语，修饰 concept。"},{"t":"who contributed to the family economy 是定语从句，修饰 \"useful\" child。"},{"t":"of the \"useless\" child 是介词短语作后置定语，修饰 notion。"},{"t":"who...is yet considered emotionally \"priceless\" 是定语从句，修饰 \"useless\" child。"},{"t":"在这个定语从句中，though producing no income for, and indeed extremely costly to, its parents 是让步状语。"}],"vo":[{"w":"give way to","ipa":"","m":"(phr.) 让位于；被...取代"},{"w":"contribute to","ipa":"","m":"(phr.) 贡献于"},{"w":"notion","ipa":"/ˈnəʊ.ʃən/","m":"(n.) 观念；概念"},{"w":"costly","ipa":"/ˈkɒst.li/","m":"(adj.) 昂贵的；代价高的"},{"w":"priceless","ipa":"/ˈpraɪs.ləs/","m":"(adj.) 无价的；极其珍贵的"}]}]},{"no":4,"header":"第五节","passages":[{"title":"生物材料领域的核心挑战","en":["Currently, the paramount problem in the field of biomaterials, the science of replacing diseased tissue with human-made implants, is control over the interface, or surface, between implanted biomaterials and living tissues. The physical properties of most tissues can be matched by careful selection of raw materials: metals, ceramics, or several varieties of polymer materials. Even the requirement that biomaterials processed from these materials be nontoxic to host tissue can be met by techniques derived from studying the reactions of tissue cultures to biomaterials or from short-term implants. But achieving necessary matches in physical properties across interfaces between living and nonliving matter requires knowledge of which molecules control the bonding of cells to each other—an area that we have not yet explored thoroughly. Although recent research has allowed us to stabilize the tissue-biomaterial interface by controlling either the chemical reactions or the microstructure of the biomaterials, our fundamental understanding of how implant devices adhere to tissues remains woefully incomplete."],"zh":["目前，生物材料（即用人造植入物替代病变组织的科学）领域最重要的问题，是对植入生物材料与活体组织之间的界面或表面的控制。大多数组织的物理特性可以通过仔细选择原材料——金属、陶瓷或几种聚合物材料——来匹配。甚至对于由这些材料加工而成的生物材料必须对宿主组织无毒这一要求，也可以通过研究组织培养物对生物材料的反应或通过短期植入物衍生出的技术来满足。但是，要在活体与非活体物质之间的界面上实现必要的物理特性匹配，就需要了解是哪些分子控制着细胞彼此间的粘附——这是一个我们尚未彻底探索的领域。尽管近期的研究使我们能够通过控制生物材料的化学反应或微观结构来稳定组织-生物材料界面，但我们对于植入设备如何粘附于组织的基本理解仍然非常不完整。"],"st":[{"h":"第一句"},{"t":"主句：... the paramount problem ... is control over the interface ...","g":"（...首要问题是...对界面的控制）"},{"t":"同位语：the science of replacing ...（...的科学）"},{"h":"第二句"},{"t":"被动句：The physical properties ... can be matched by ... selection of ...","g":"（物理特性可以通过选择...来匹配）"},{"h":"第三句"},{"t":"主句：Even the requirement ... can be met by techniques ...","g":"（甚至...要求也能通过...技术满足）"},{"t":"从句解释 requirement：that biomaterials ... be nontoxic ...","g":"（生物材料必须无毒）"},{"t":"修饰 techniques：derived from studying ... or from ...（源于研究...或...）"},{"t":"第四句（核心转折）："},{"t":"主句： But achieving ... matches ... requires knowledge of ...","g":"（但实现...匹配需要...的知识）"},{"t":"从句（知识的内容）：which molecules control the bonding ...","g":"（哪些分子控制着...结合）"},{"t":"破折号补充：an area that we have not yet explored thoroughly（一个我们尚未彻底探索的领域）"},{"t":"第五句（让步）："},{"t":"让步从句：Although recent research has allowed us to stabilize ... by controlling either ... or ...","g":"（尽管近期研究让我们能通过控制...或...来稳定...）"},{"t":"主句： our fundamental understanding ... remains woefully incomplete","g":"（我们的基础理解...仍非常不完整）"}],"vo":[{"w":"currently","ipa":"/ˈkʌrəntli/","m":"adv. 目前"},{"w":"paramount","ipa":"/ˈpærəmaʊnt/","m":"adj. 至高无上的，最重要的"},{"w":"biomaterials","ipa":"/ˌbaɪəʊməˈtɪəriəlz/","m":"n. 生物材料（复数）"},{"w":"diseased","ipa":"/dɪˈziːzd/","m":"adj. 病变的"},{"w":"implants","ipa":"/ɪmˈplɑːnts/","m":"n. 植入物（复数）"},{"w":"interface","ipa":"/ˈɪntəfeɪs/","m":"n. 界面"},{"w":"physical properties","ipa":"/ˈfɪzɪkl ˈprɒpətiz/","m":"n. 物理特性"},{"w":"matched","ipa":"/mætʃt/","m":"v. 被匹配（match 的过去分词）"},{"w":"raw materials","ipa":"/rɔː məˈtɪəriəlz/","m":"n. 原材料"},{"w":"ceramics","ipa":"/səˈræmɪks/","m":"n. 陶瓷"},{"w":"varieties","ipa":"/vəˈraɪətiz/","m":"n. 种类（复数）"},{"w":"polymer","ipa":"/ˈpɒlɪmə(r)/","m":"n. 聚合物"},{"w":"requirement","ipa":"/rɪˈkwaɪəmənt/","m":"n. 要求"},{"w":"processed","ipa":"/ˈprəʊsest/","m":"v. 被加工（process 的过去分词）"},{"w":"nontoxic","ipa":"/ˌnɒnˈtɒksɪk/","m":"adj. 无毒的"},{"w":"host tissue","ipa":"/həʊst ˈtɪʃuː/","m":"n. 宿主组织"},{"w":"techniques","ipa":"/tekˈniːks/","m":"n. 技术（复数）"},{"w":"derived","ipa":"/dɪˈraɪvd/","m":"v. 源于（derive 的过去分词）"},{"w":"tissue cultures","ipa":"/ˈtɪʃuː ˈkʌltʃəz/","m":"n. 组织培养"},{"w":"short-term","ipa":"/ˌʃɔːt ˈtɜːm/","m":"adj. 短期的"},{"w":"across","ipa":"/əˈkrɒs/","m":"prep. 跨越"},{"w":"molecules","ipa":"/ˈmɒlɪkjuːlz/","m":"n. 分子（复数）"},{"w":"bonding","ipa":"/ˈbɒndɪŋ/","m":"n. 结合，键合"},{"w":"explored","ipa":"/ɪkˈsplɔːd/","m":"v. 探索（explore 的过去分词）"},{"w":"thoroughly","ipa":"/ˈθʌrəli/","m":"adv. 彻底地"},{"w":"stabilize","ipa":"/ˈsteɪbəlaɪz/","m":"v. 稳定"},{"w":"chemical reactions","ipa":"/ˈkemɪkl riˈækʃənz/","m":"n. 化学反应"},{"w":"microstructure","ipa":"/ˈmaɪkrəʊˌstrʌktʃə(r)/","m":"n. 微观结构"},{"w":"fundamental","ipa":"/ˌfʌndəˈmentl/","m":"adj. 根本的，基础的"},{"w":"adhere","ipa":"/ədˈhɪə(r)/","m":"v. 粘附"},{"w":"woefully","ipa":"/ˈwəʊfəli/","m":"adv. 可悲地，非常地"},{"w":"incomplete","ipa":"/ˌɪnkəmˈpliːt/","m":"adj. 不完整的"}]},{"title":"一部小说的理想与幻灭","en":["Hank Morgan, the hero of Mark Twain's A Connecticut Yankee in King Arthur's Court, is a nineteenth-century master mechanic who mysteriously awakening in sixth-century Britain, launches what he hopes will be a peaceful revolution to transform Arthurian Britain into an industrialized modern democracy. The novel, written as a spoof (a light humorous parody) of Thomas Malory's Morted' Arthur, a popular collection of fifteenth-century legends about sixth-century Britain, has been made into three upbeat movies and two musical comedies. None of these translations to screen and stage, however, dramatize the anarchy at the conclusion of A Connecticut Yankee, which ends with the violent overthrow of Morgan's three-year-old progressive order and his return to the nineteenth century, where he apparently commits suicide after being labeled a lunatic for his incoherent babblings about drawbridges and battlements. The American public, although enjoying Twain's humor, evidently rejected his cynicism about technological advancement and change through peaceful revolution as antithetical to the United States doctrine of progress."],"zh":["汉克·摩根——马克·吐温所著《康州美国佬在亚瑟王朝》中的主人公——是一位十九世纪的机械大师。他神秘地苏醒在六世纪的英国后，发起了一场他希望能是和平的革命，旨在将亚瑟时代的英国转变为一个工业化的现代民主国家。这部小说是对托马斯·马洛礼的《亚瑟之死》（一部关于六世纪英国的、流行于十五世纪的传奇故事集）的诙谐模仿，它已被改编成三部乐观向上的电影和两部音乐喜剧。然而，所有这些搬上银幕和舞台的改编作品，都没有演绎出《康州美国佬》结局处的混乱无序。该小说的结局是：摩根建立三年的进步秩序被暴力推翻，他本人也回到了十九世纪，在那里，他因喋喋不休地念叨着吊桥和城垛而被视为疯子，并最终显然自杀了。美国公众虽然喜欢吐温的幽默，但显然拒绝接受他对于技术发展和和平革命所带来的改变的冷嘲热讽，认为这与美国的进步信条相悖。"],"st":[{"t":"主干: Hank Morgan is a nineteenth-century master mechanic."},{"t":"结构分析:"},{"t":"the hero of...Court 是主语的同位语。"},{"t":"who...democracy 是一个长的定语从句，修饰 master mechanic。该从句的主干是 who launches what...。"},{"t":"what he hopes will be a peaceful revolution 是宾语从句，作 launches 的宾语。"},{"t":"to transform...democracy 是不定式作目的状语，修饰 revolution。"},{"t":"主干: The novel has been made into three upbeat movies and two musical comedies."},{"t":"结构分析:"},{"t":"written as...Britain 是过去分词短语作后置定语，修饰 The novel。"},{"t":"a spoof of Thomas Malory's Morted' Arthur 解释小说的性质。"},{"t":"a popular collection...Britain 是 Morted' Arthur 的同位语。"},{"t":"主干: None of these translations dramatize the anarchy."},{"t":"结构分析:"},{"t":"to screen and stage 是介词短语作后置定语，修饰 translations。"},{"t":"at the conclusion...Yankee 是介词短语作后置定语，修饰 anarchy。"},{"t":"which ends with... 是一个非限制性定语从句，修饰整个 conclusion 或前句的 anarchy。"},{"t":"where he apparently commits suicide... 是又一个定语从句，修饰 the nineteenth century。"},{"t":"after being labeled...battlements 是时间状语。"},{"t":"主干: The American public rejected his cynicism."},{"t":"结构分析:"},{"t":"although enjoying Twain's humor 是让步状语。"},{"t":"about technological advancement...revolution 是介词短语作后置定语，修饰 cynicism。"},{"t":"as antithetical to...progress 是宾语补足语，说明 cynicism 被如何看待。"}],"vo":[{"w":"mechanic","ipa":"/məˈkæn.ɪk/","m":"(n.) 机械师"},{"w":"launch","ipa":"/lɔːntʃ/","m":"(v.) 发起"},{"w":"democracy","ipa":"/dɪˈmɒk.rə.si/","m":"(n.) 民主"},{"w":"spoof","ipa":"/spuːf/","m":"(n.) 诙谐的模仿"},{"w":"parody","ipa":"/ˈpær.ə.di/","m":"(n.) 戏仿作品"},{"w":"upbeat","ipa":"/ˈʌp.biːt/","m":"(adj.) 乐观的"},{"w":"anarchy","ipa":"/ˈæn.ə.ki/","m":"(n.) 无政府状态；混乱"},{"w":"overthrow","ipa":"/ˌəʊ.vəˈθrəʊ/","m":"(n./v.) 推翻"},{"w":"lunatic","ipa":"/ˈluː.nə.tɪk/","m":"(n.) 疯子"},{"w":"incoherent","ipa":"/ˌɪn.kəʊˈhɪə.rənt/","m":"(adj.) 语无伦次的"},{"w":"babbling","ipa":"/ˈbæb.lɪŋ/","m":"(n.) 含糊不清的言语"},{"w":"drawbridge","ipa":"/ˈdrɔː.brɪdʒ/","m":"(n.) 吊桥"},{"w":"battlement","ipa":"/ˈbæt.əl.mənt/","m":"(n.) 城垛"},{"w":"cynicism","ipa":"/ˈsɪn.ɪ.sɪ.zəm/","m":"(n.) 愤世嫉俗；冷嘲热讽"},{"w":"antithetical","ipa":"/ˌæn.tɪˈθet.ɪ.kəl/","m":"(adj.) 对立的；完全相反的"},{"w":"doctrine","ipa":"/ˈdɒk.trɪn/","m":"(n.) 信条；主义"}]},{"title":"第十四修正案的扩展","en":["This doctrine has broadened the application of the Fourteenth Amendment to other, nonracial forms of discrimination, for while some justices have refused to find any legislative classification other than race to be constitutionally disfavored, most have been receptive to arguments that at least some nonracial discriminations, sexual discrimination in particular, are “suspect” and deserve this heightened scrutiny by the courts."],"zh":["这一信条扩大了第十四修正案在其它非种族歧视形式上的应用范围。因为，虽然一些法官拒绝承认除种族以外的任何立法分类在宪法上是不受青睐的，但大多数法官已经接受了这样的论点，即至少某些非种族歧视，特别是性别歧视，是“可疑的”，理应受到法院的这种更严格的审查。"],"st":[{"t":"主干: This doctrine has broadened the application."},{"t":"结构分析:","g":"of the Fourteenth Amendment...discrimination 是介词短语作后置定语，修饰 application。for while some justices... 是一个原因状语从句，解释为什么说信条扩大了应用范围。在这个原因状语从句中，又包含了一个由 while （虽然）引导的让步状语从句 while some"},{"t":"justices...disfavored。","g":"主句是 most have been receptive to arguments...。that at least some nonracial discriminations...by the courts 是同位语从句，解释 arguments 的内容。"}],"vo":[{"w":"amendment","ipa":"/əˈmend.mənt/","m":"(n.) 修正案"},{"w":"discrimination","ipa":"/dɪˌskrɪm.ɪˈneɪ.ʃən/","m":"(n.) 歧视"},{"w":"legislative","ipa":"/ˈledʒ.ɪ.slə.tɪv/","m":"(adj.) 立法的"},{"w":"classification","ipa":"/ˌklæs.ɪ.fɪˈkeɪ.ʃən/","m":"(n.) 分类"},{"w":"constitutionally","ipa":"/ˌkɒn.stɪˈtjuː.ʃən.əl.i/","m":"(adv.) 宪法上地"},{"w":"disfavored","ipa":"/dɪsˈfeɪ.vəd/","m":"(adj.) 不受欢迎的；受冷落的"},{"w":"receptive","ipa":"/rɪˈsep.tɪv/","m":"(adj.) 乐于接受的"},{"w":"scrutiny","ipa":"/ˈskruː.tɪ.ni/","m":"(n.) 仔细审查"}]},{"title":"自由市场观点的局限","en":["Moreover, those economists who argue that allowing the free market to operate without interference is the most efficient method of establishing prices have not considered the economies of nonsocialist countries other than the United States."],"zh":["此外，那些认为让自由市场不受干扰地运行是建立价格体系最有效方法的经学家们，并没有考虑过美国以外的非社会主义国家的经济状况。"],"st":[{"t":"主干: those economists have not considered the economies."},{"t":"结构分析:"},{"t":"who argue that...prices 是一个长的定语从句，修饰 economists。"},{"t":"在这个定语从句中，that allowing...prices 是宾语从句，作 argue 的宾语。"},{"t":"该宾语从句的主语是动名词短语 allowing the free market to operate without interference。"},{"t":"of nonsocialist countries other than the United States 是介词短语作后置定语，修饰 economies。"}],"vo":[{"w":"interference","ipa":"/ˌɪn.təˈfɪə.rəns/","m":"(n.) 干涉；干扰"},{"w":"efficient","ipa":"/ɪˈfɪʃ.ənt/","m":"(adj.) 有效率的"},{"w":"nonsocialist","ipa":"/ˌnɒnˈsəʊ.ʃə.lɪst/","m":"(adj.) 非社会主义的"}]},{"title":"比尔登的艺术身份与使命","en":["When speaking of Romare Bearden, one is tempted to say, \"A great Black American artist.\" The subject matter of Bearden's collages is certainly Black. Portrayals of the folk of Mecklenburg County, North Carolina, whom he remembers from early childhood, of the jazz musicians and tenement roofs of his Harlem days, of Pittsburgh steelworkers, and his reconstruction of classical Greek myths in the guise of the ancient Black kingdom of Benin, attest to this. In natural harmony with this choice of subject matter are the social sensibilities of the artist, who remains active today with the Cinque Gallery in Manhattan, which he helped found and which is devoted to showing the work of minority artists."],"zh":["当谈到罗梅尔·比尔登时，人们总会忍不住说：“一位伟大的美国黑人艺术家。”比尔登拼贴画的主题无疑是黑人的。对北卡罗来纳州梅克伦堡县民众（他自幼记得的那些人）的描绘，对他在哈莱姆区岁月中的爵士音乐家和公寓屋顶的描绘，对匹兹堡钢铁工人的描绘，以及他以古老的贝宁王国为外衣对古希腊神话的重构，都证明了这一点。与这种题材选择天然和谐一致的，是这位艺术家的社会意识。他至今仍活跃于曼哈顿的辛克画廊，这个画廊是他协助创立的，并致力于展出少数族裔艺术家的作品。"],"st":[{"t":"主干: Portrayals ... and his reconstruction ... attest to this."},{"t":"结构分析:"},{"t":"主语很长，由 Portrayals of..., of..., of..., and his reconstruction of... 这个并列结构组成。"},{"t":"whom he remembers from early childhood 是定语从句，修饰 the folk。"},{"t":"in the guise of...Benin 是介词短语作方式状语，修饰 reconstruction。"},{"t":"主干 : In natural harmony ... are the social sensibilities... ( 这是一个完全倒装句，正常语序是 The social sensibilities ... are in natural harmony...)"},{"t":"结构分析:"},{"t":"of the artist 是后置定语，修饰 sensibilities。"},{"t":"who remains active... 是定语从句，修饰 artist。"},{"t":"with the Cinque Gallery in Manhattan 是介词短语作状语。"},{"t":"which he helped found 和 which is devoted to... 是两个并列的定语从句，共同修饰 Cinque Gallery。"}],"vo":[{"w":"be tempted to","ipa":"","m":"(phr.) 忍不住想；倾向于"},{"w":"collage","ipa":"/ˈkɒl.ɑːʒ/","m":"(n.) 拼贴画"},{"w":"portrayal","ipa":"/pɔːˈtreɪ.əl/","m":"(n.) 描绘；刻画"},{"w":"tenement","ipa":"/ˈten.ə.mənt/","m":"(n.) 经济公寓；廉租公寓"},{"w":"attest to","ipa":"","m":"(phr.) 证明；证实"},{"w":"in the guise of","ipa":"","m":"(phr.) 假借；在...的伪装下"},{"w":"sensibility","ipa":"/ˌsen.səˈbɪl.ə.ti/","m":"(n.) 感受力；敏感性"},{"w":"be devoted to","ipa":"","m":"(phr.) 致力于；专注于"}]},{"title":"资本主义的缺陷","en":["Yet Walzer's argument, however deficient, does point to one of the most serious weaknesses of capitalism-namely, that it brings to predominant positions in a society people who, no matter how legitimately they have earned their material rewards, often lack those other qualities that evoke affection or admiration."],"zh":["然而，Walzer 的论点无论有多少缺陷，确实指出了资本主义最严重的弱点之一——即，它将这样一些人推向社会的主导地位：无论他们如何合法地获得物质回报，却常常缺乏那些能唤起爱戴或钦佩的其他品质。"],"st":[{"t":"主句: Yet Walzer's argument does point to one of the most serious weaknesses of capitalism"},{"t":"同位语从句: that it brings to predominant positions ... people who ... (作 weaknesses 的同位语，解释其内容)"},{"t":"(在该从句中，people 是 brings 的宾语，因其修饰成分过长而被后置)"}],"vo":[{"w":"deficient","ipa":"/dɪˈfɪʃnt/","m":"adj. 有缺陷的，不足的"},{"w":"weakness","ipa":"/ˈwiːknəs/","m":"n. 弱点"},{"w":"capitalism","ipa":"/ˈkæpɪtəlɪzəm/","m":"n. 资本主义"},{"w":"namely","ipa":"/ˈneɪmli/","m":"adv. 即，也就是"},{"w":"predominant","ipa":"/prɪˈdɑːmɪnənt/","m":"adj. 主导的，占优势的"},{"w":"legitimately","ipa":"/lɪˈdʒɪtɪmətli/","m":"adv. 合法地"},{"w":"material","ipa":"/məˈtɪriəl/","m":"adj. 物质的"},{"w":"reward","ipa":"/rɪˈwɔːrd/","m":"n. 回报"},{"w":"evoke","ipa":"/ɪˈvoʊk/","m":"v. 唤起，引起"},{"w":"affection","ipa":"/əˈfekʃn/","m":"n. 喜爱，关爱"},{"w":"admiration","ipa":"/ˌædməˈreɪʃn/","m":"n. 钦佩，赞赏"},{"w":"point to","ipa":"/pɔɪnt tu/","m":"指出"},{"w":"no matter how","ipa":"/noʊ ˈmætər haʊ/","m":"无论如何"}]},{"title":"“蓝袜女”的团结 vs “沙龙女”的孤立","en":["However, as they gained cohesion, the Bluestockings came to regard themselves as a women's group and to possess a sense of female solidarity lacking in the salonnieres, who remained isolated from one another by the primacy each held in her own salon."],"zh":["然而，随着她们凝聚力增强，“蓝袜女”开始将自己视为一个女性团体，并拥有了一种“沙龙女”所缺乏的女性团结意识；而“沙龙女”们则因各自在自己沙龙中的主导地位而彼此孤立。"],"st":[{"t":"主干:the Bluestockings came to regard themselves as a women's group and to possess a sense of female solidarity"},{"t":"修饰成分:"},{"t":"However(转折副词)"},{"t":"as they gained cohesion(时间状语从句)"},{"t":"lacking in the salonnieres(现在分词短语作后置定语，修饰 solidarity)"},{"t":",who remained isolated from one another by the primacy each held in her own salon(非限制性定语从句，修饰 salonnieres，其中 each held in her own salon 是省略了关系代词的定语从句，修饰 primacy)"}],"vo":[{"w":"cohesion","ipa":"","m":"n. 凝聚力，团结"},{"w":"the Bluestockings","ipa":"","m":"n. 蓝袜女（指 18 世纪英国的知识女性团体）"},{"w":"regard ... as ...","ipa":"","m":"将……视为……"},{"w":"solidarity","ipa":"","m":"n. 团结一致"},{"w":"lacking in","ipa":"","m":"为……所缺乏的"},{"w":"salonnieres","ipa":"","m":"n. 沙龙女主人"},{"w":"isolated from one another","ipa":"","m":"彼此孤立"},{"w":"primacy","ipa":"","m":"n. 首位，主导地位"}]},{"title":"人类学研究的难易程度","en":["Anthropologists and others are on much firmer ground when they attempt to describe the cultural norms for a small homogeneous tribe or village than when they undertake the formidable task of discovering the norms that exist in a complex modern nation-state composed of many disparate groups."],"zh":["人类学家和其他学者在描述一个小型同质部落或村庄的文化规范时，比他们在承担发现存在于由许多不同群体组成的复杂现代单一民族国家中的规范这一艰巨任务时，站在更坚实（更有把握）的基础上。"],"st":[{"t":"主句: Anthropologists and others are on much firmer ground"},{"t":"比较状语从句: when they attempt to ... than when they undertake ..."},{"t":"(两个 when 引导的从句并列，由 than 连接，比较两种不同情况)状语从句: while the density-independent effects act to ... (表示对比)"}],"vo":[{"w":"anthropologist","ipa":"/ˌænθrəˈpɑːlədʒɪst/","m":"n. 人类学家"},{"w":"firm","ipa":"/fɜːrm/","m":"adj. 坚实的"},{"w":"attempt","ipa":"/əˈtempt/","m":"v. 尝试"},{"w":"norm","ipa":"/nɔːrm/","m":"n. 规范"},{"w":"homogeneous","ipa":"/ˌhoʊməˈdʒiːniəs/","m":"adj. 同质的"},{"w":"undertake","ipa":"/ˌʌndərˈteɪk/","m":"v. 承担"},{"w":"formidable","ipa":"/ˈfɔːrmɪdəbl/","m":"adj. 艰巨的"},{"w":"nation-state","ipa":"/ˈneɪʃn steɪt/","m":"n. 单一民族国家"},{"w":"compose","ipa":"/kəmˈpoʊz/","m":"v. 组成"},{"w":"disparate","ipa":"/ˈdɪspərət/","m":"adj. 不同的"},{"w":"on firmer ground","ipa":"/ɒn ˈfɜːrmər ɡraʊnd/","m":"处于更坚实的基础之上"}]}]},{"no":5,"header":"第六节","passages":[{"title":"为汉斯贝里正名","en":["In A Raisin in the Sun, Lorraine Hansberry does not reject integration or the economic and moral promise of the American dream; rather, she remains loyal to this dream while looking, realistically, at its incomplete realization. Once we recognize this dual vision, we can accept the play's ironic nuances as deliberate social commentaries by Hansberry rather than as the \"unintentional\" irony that Bigsby attributes to the work. Indeed, a curiously persistent refusal to credit Hansberry with a capacity for intentional irony has led some critics to interpret the play's thematic conflicts as mere confusion, contradiction, or eclecticism. Isaacs, for example, cannot easily reconcile Hansberry's intense concern for her race with her ideal of human reconciliation. But the play's complex view of Black self-esteem and human solidarity as compatible is no more \"contradictory\" than Du Bois' famous, well-considered ideal of ethnic self-awareness coexisting with human unity, or Fanon's emphasis on an ideal internationalism that also accommodates national identities and roles."],"zh":["在《太阳下的葡萄干》中，洛兰·汉斯贝里并没有拒绝融合或是美国梦在经济和道德上的承诺；相反，她在现实主义地审视其未竟实现的同时，依然忠于这个梦想。一旦我们认识到这种双重视野，我们就能接受剧中的反讽微光是汉斯贝里刻意为之的社会评论，而非比格斯比所归咎于该作品的“非故意”反讽。事实上，一种异乎寻常的、拒绝承认汉斯贝里具备故意使用反讽之能力的顽固态度，导致一些评论家将剧本的主题冲突解释为纯粹的混乱、矛盾或折中主义。例如，艾萨克斯就很难调和汉斯贝里对自身种族的深切关怀与她关于人类和解的理想。但是，该剧关于黑人自尊与人类团结可以相容的复杂观点，和杜波伊斯那著名的、经过深思熟虑的、民族自我意识与人类大同共存的理想，或者法农所强调的、同样包容民族身份与角色的理想国际主义一样，都不“矛盾”。"],"st":[{"t":"结构: Once we recognize... 是条件状语从句。主句是 we can accept A as B rather than as C。that Bigsby attributes... 是定语从句修饰 \"unintentional\" irony。"},{"t":"结构: But 引出转折。主句主干是 the play's complex view... is no more \"contradictory\" than Du Bois'ideal... or Fanon's emphasis...。这是一个比较结构。of ethnic self-awareness... 是修饰 ideal 的后置定语，that also accommodates... 是修饰 internationalism 的定语从句。"}],"vo":[{"w":"integration","ipa":"/ˌɪntɪˈɡreɪʃ(ə)n/","m":"n.融合，整合"},{"w":"dual vision","ipa":"/ˈdjuːəlˈvɪʒ(ə)n/","m":"n.双重视野"},{"w":"ironic nuances","ipa":"/aɪˈrɒnɪkˈnjuːɑːnsɪz/","m":"n.反讽的细微差别"},{"w":"deliberate","ipa":"/dɪˈlɪbərət/","m":"adj.故意的，蓄意的"},{"w":"attribute A to B","ipa":"/əˈtrɪbju(ː)t/","m":"v.将 A 归因于 B"},{"w":"credit sb.with sth.","ipa":"/ˈkredɪt/","m":"v.认为某人有某事物（尤指优点或能力）"},{"w":"persistent","ipa":"/pəˈsɪstənt/","m":"adj.执着的，持续的"},{"w":"thematic","ipa":"/θɪˈmætɪk/","m":"adj.主题的"},{"w":"eclecticism","ipa":"/ɪˈklektəsɪzəm/","m":"n.折中主义"},{"w":"self-esteem","ipa":"/ˌselfɪˈstiːm/","m":"n.自尊"},{"w":"solidarity","ipa":"/ˌsɒlɪˈdærəti/","m":"n.团结"},{"w":"compatible","ipa":"/kəmˈpætəb(ə)l/","m":"adj.相容的，不矛盾的"},{"w":"coexist","ipa":"/ˌkəʊɪɡˈzɪst/","m":"v.共存"},{"w":"accommodate","ipa":"/əˈkɒmədeɪt/","m":"v.容纳，适应"}]},{"title":"美国殖民地史观","en":["A long-held view of the history of the English colonies that became the United States has been that England's policy toward these colonies before 1763 was dictated by commercial interests and that a change to a more imperial policy, dominated by expansionist militarist objectives, generated the tensions that ultimately led to the American Revolution."],"zh":["关于那些后来成为美国的英国殖民地的历史，一个长期持有的观点是：1763 年以前，英国对这些殖民地的政策是由商业利益主导的；而之后转向一种由扩张主义和军事目标所主导的、更加帝国化的政策，这种转变引发了最终导致美国革命的紧张局势。"],"st":[{"t":"主句：A long-held view ... has been that ... and that ...","g":"（一个长期观点...一直是... 和... ）"},{"t":"主语：A long-held view of the history of the English colonies (that became the United States)"},{"t":"并列从句 1：that England's policy ... was dictated by commercial interests"},{"t":"并列从句 2：that a change ... generated the tensions (that ultimately led to the American Revolution)"}],"vo":[{"w":"long-held","ipa":"/ˌlɔːŋ ˈheld/","m":"adj. 长期持有的"},{"w":"colonies","ipa":"/ˈkɒləniːz/","m":"n. 殖民地（复数）"},{"w":"dictated","ipa":"/dɪkˈteɪtɪd/","m":"v. 被...支配，主宰"},{"w":"commercial","ipa":"/kəˈmɜːʃl/","m":"adj. 商业的"},{"w":"imperial","ipa":"/ɪmˈpɪəriəl/","m":"adj. 帝国的"},{"w":"dominated","ipa":"/ˈdɒmɪneɪtɪd/","m":"v. 由...主导"},{"w":"expansionist","ipa":"/ɪkˈspænʃənɪst/","m":"adj. 扩张主义的"},{"w":"militarist","ipa":"/ˈmɪlɪtərɪst/","m":"adj. 军国主义的"},{"w":"generated","ipa":"/ˈdʒenəreɪtɪd/","m":"v. 产生，引发"},{"w":"tensions","ipa":"/ˈtenʃənz/","m":"n. 紧张关系（复数）"},{"w":"ultimately","ipa":"/ˈʌltɪmətli/","m":"adv. 最终"},{"w":"revolution","ipa":"/ˌrevəˈluːʃn/","m":"n. 革命"}]},{"title":"剧烈运动后的生理弱点","en":["With the conclusion of a burst of activity, the lactic acid level is high in the body fluids, leaving the large animal vulnerable to attack until the acid is reconverted, via oxidative metabolism, by the liver into glucose, which is then sent (in part) back to the muscles for glycogen resynthesis."],"zh":["随着一阵剧烈活动的结束，体液中乳酸含量会很高，这使得大型动物容易受到攻击，直到乳酸通过氧化代谢被肝脏转化为葡萄糖，然后（部分）葡萄糖被送回肌肉，用于糖原的再合成。"],"st":[{"t":"主句: the lactic acid level is high in the body fluids（体液中乳酸含量很高）"},{"t":"状语: With the conclusion of a burst of activity（随着一阵剧烈活动的结束）"},{"t":"结果状语: leaving the large animal vulnerable to attack（使得大型动物容易受到攻击）"},{"t":"时间状语从句: until the acid is reconverted... into glucose（直到酸被转化为葡萄糖）"},{"t":"方式状语: via oxidative metabolism（通过氧化代谢），by the liver（被肝脏）"},{"t":"定语从句: which is then sent (in part) back to the muscles for glycogen resynthesis（然后它被（部分）送回肌肉，用于糖原的再合成），修饰 glucose。"}],"vo":[{"w":"lactic acid","ipa":"/ˈlæktɪk ˈæsɪd/","m":"n. 乳酸"},{"w":"body fluids","ipa":"/ˈbɒdi ˈfluːɪdz/","m":"n. 体液"},{"w":"vulnerable","ipa":"/ˈvʌlnərəb(ə)l/","m":"adj. 易受攻击的，脆弱的"},{"w":"reconvert","ipa":"/ˌriːkənˈvɜːt/","m":"v. 再转化，重新转变"},{"w":"oxidative metabolism","ipa":"/ˈɒksɪdeɪtɪv məˈtæbəlɪzəm/","m":"n. 氧化代谢"},{"w":"glucose","ipa":"/ˈɡluːkəʊs/","m":"n. 葡萄糖"},{"w":"glycogen","ipa":"/ˈɡlaɪkəʊdʒən/","m":"n. 糖原"},{"w":"resynthesis","ipa":"/riˈsɪnθəsɪs/","m":"n. 再合成"}]},{"title":"新发现的潜在威胁","en":["While the new doctrine seems almost certainly correct, the one papyrus fragment raises the specter that another may be unearthed, showing, for instance, that it was the Danaid tetralogy that bested Sophocles, and throwing the date once more into utter confusion."],"zh":["尽管新学说几乎可以肯定是正确的，但那一份纸莎草碎片却引出了一个幽灵般的可能性：可能还会有另一份碎片被发掘出来，例如，上面显示是《达那伊得斯》四部曲击败了索福克勒斯，从而将（悲剧比赛的）日期再次抛入彻底的混乱之中。"],"st":[{"t":"主句: the one papyrus fragment raises the specter（那一份纸莎草碎片引出了一个幽灵）"},{"t":"让步状语从句: While the new doctrine seems almost certainly correct（尽管新学说几乎可以肯定是正确的）"},{"t":"同位语从句: that another may be unearthed（可能还会有另一份被发掘出来），解释 specter 的内容。"},{"t":"现在分词状语: showing... that it was... 和 throwing... 作为状语，修饰 unearthed，表示伴随状况或结果。其中 that it was... Sophocles 是 showing 的宾语从句。"}],"vo":[{"w":"doctrine","ipa":"/ˈdɒktrɪn/","m":"n. 学说，信条"},{"w":"papyrus","ipa":"/pəˈpaɪrəs/","m":"n. 纸莎草；纸莎草纸"},{"w":"fragment","ipa":"/ˈfræɡmənt/","m":"n. 碎片"},{"w":"specter","ipa":"/ˈspektə(r)/","m":"n. 幽灵；萦绕心头的恐惧"},{"w":"unearth","ipa":"/ʌnˈɜːθ/","m":"v. 发掘，挖掘"},{"w":"tetralogy","ipa":"/tɛˈtrælədʒi/","m":"n. 四部曲"},{"w":"bested","ipa":"/ˈbestɪd/","m":"v. (best 的过去式) 击败，胜过"},{"w":"utter confusion","ipa":"/ˈʌtə kənˈfjuːʒ(ə)n/","m":"n. 彻底的混乱"}]},{"title":"发掘被忽视的作品","en":["Black Fiction surveys a wide variety of novels, bringing to our attention in the process some fascinating and little-known works like James Weldon Johnson's Autobiography of an Ex-Colored Man."],"zh":["《黑人小说》考察了各种各样的小说，在此过程中让我们注意到一些引人入胜却鲜为人知的作品，例如詹姆斯·韦尔登·约翰逊的《一个前有色人的自传》。"],"st":[{"t":"主句: Black Fiction surveys a wide variety of novels（《黑人小说》考察了各种各样的小说）"},{"t":"现在分词短语作状语: bringing to our attention... some fascinating and little-known works（让我们注意到……一些引人入胜却鲜为人知的作品），表示伴随主句动作发生的结果。like... 是介词短语，举例说明works。"}],"vo":[{"w":"survey","ipa":"/ˈsɜːveɪ/","m":"v.调查，考察，审视"},{"w":"a wide variety of","ipa":"/əwaɪd vəˈraɪətiɒv/","m":"phr.各种各样的"},{"w":"bring to one's attention","ipa":"/brɪŋtəwʌnzəˈtenʃ(ə)n/","m":"phr.引起某人的注意"},{"w":"fascinating","ipa":"/ˈfæsɪneɪtɪŋ/","m":"adj.迷人的，极有吸引力的"},{"w":"little-known","ipa":"/ˈlɪt(ə)l nəʊn/","m":"adj.鲜为人知的"}]},{"title":"水循环的定义","en":["The hydrologic cycle, a major topic in this science, is the complete cycle of phenomena through which water passes, beginning as atmospheric water vapor, passing into liquid and solid form as precipitation, thence along and into the ground surface, and finally again returning to the form of atmospheric water vapor by means of evaporation and transpiration."],"zh":["水循环，这门科学中的一个主要课题，是水所经历的完整现象循环：从大气中的水蒸气开始，变成液态或固态的降水，然后沿着地表并进入地下，最终通过蒸发和蒸腾作用再次回到大气水蒸气的形态。"],"st":[{"t":"主句: The hydrologic cycle... is the complete cycle of phenomena（水循环是完整的现象循环）"},{"t":"同位语: a major topic in this science（这门科学中的一个主要课题），修饰 The hydrologic cycle。"},{"t":"定语从句: through whic
